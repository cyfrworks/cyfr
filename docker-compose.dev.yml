#
# The source development stack: the locus-runtime service of
# docker-compose.yml, built from this checkout, beside a control plane run
# from the checkout with `mix phx.server` (CONTRIBUTING.md, "Running from
# source"). Layered last, and started by scripts/dev-stack.sh:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d locus-runtime
#
# Never shipped: scripts/scaffold-tarball.sh names its items, and this file
# is none of them. Every setting not named here stays the shipped
# service's: the keeper, its capabilities, the read-only root, the tmpfs
# mounts and the limits.

# A project of its own, whatever the checkout's directory is called, so the
# dev stack never recreates a shipped stack's containers.
name: cyfr-dev

services:
  locus-runtime:
    # Built from this tree under a local tag, never the published one, and
    # never pulled.
    image: cyfr-locus:dev
    pull_policy: build
    container_name: cyfr-dev-locus-runtime
    # The id CYFR dispatches to by default (`wrk_local`, at
    # http://127.0.0.1:4200), so the key scripts/dev-stack.sh derives for it
    # from CYFR_LOCUS_RUNTIME_ROOT is the one CYFR holds.
    environment:
      - LOCUS_RUNTIME_SERVICE_ID=wrk_local
      # CYFR's host API on the host, at the locus-runtime network's gateway
      # (below). The mix boot binds it there (CYFR_HOST_API_BIND=172.16.231.1):
      # the tightest bind the container reaches, an address that exists only
      # on this network's bridge, so no other interface of the host serves
      # it. Loopback is unreachable from a bridge network, and 0.0.0.0 would
      # serve the host API on every interface the host has.
      - LOCUS_RUNTIME_HOST_API_URL=http://172.16.231.1:${CYFR_HOST_API_PORT:-4300}
    # The runtime's listener on the host's loopback alone, where the mix
    # boot dispatches to.
    ports:
      - "127.0.0.1:4200:4200"
    # The shipped list with the keeper's profile at its tracked path: the
    # scaffold ships it beside docker-compose.yml as keeper.seccomp.json,
    # which a checkout does not hold.
    security_opt: !override
      - no-new-privileges:true
      - writable-cgroups=true
      - seccomp=./apps/locus/keeper/seccomp/keeper.json

networks:
  # The shipped subnet, its gateway named: the address the host API binds
  # and the runtime posts to.
  locus-runtime:
    ipam:
      config: !override
        - subnet: 172.16.231.0/24
          ip_range: 172.16.231.128/25
          gateway: 172.16.231.1
