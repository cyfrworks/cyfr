#
# The setup proof's overlay (tests/setup-proof/run.sh), which the run copies
# into each project directory as docker-compose.override.yml: the one
# override of the default file set that `cyfr setup` and the proof's own
# compose calls resolve beside docker-compose.yml. It is the Compose
# proof's (tests/compose-proof/compose.yml) less its Tailscale stand-in,
# since setup makes a CYFR reached from this device, and less its change of
# cyfr's port: cyfr is published at 127.0.0.1:CYFR_PORT as shipped, the
# port the run's template names, so the address the pages move the browser
# to is CYFR's. It adds only:
#
#   - the app image built from the tree, named by a variable of the run's
#     template (no COMPOSE_* name: cyfr refuses one in .env);
#   - a directory and a registry under `.invalid` names for cyfr, which
#     resolve nowhere, so the first person meets a cyfr.run that does not
#     answer and nothing of the run reaches cyfr.run (the container cannot
#     reach this machine's loopback, where the cyfr.run stand-in would
#     listen);
#   - the project's names in place of the shipped container name, so a
#     run meets no deployed stack;
#   - the Locus runtime and backends services under a profile no head
#     selects: the proof is of the setup, and starts no Locus service, as
#     builds are off in its template.
services:
  cyfr:
    image: ${PROOF_APP_IMAGE:?set PROOF_APP_IMAGE}
    pull_policy: never
    container_name: !reset null
    environment:
      - CYFR_DIRECTORY_URL=https://directory.invalid
      - CYFR_REGISTRY_URL=registry.invalid
  locus-runtime:
    profiles: ["proof-never"]
  locus-backends:
    profiles: ["proof-never"]
  locus-backends-guard:
    profiles: ["proof-never"]
