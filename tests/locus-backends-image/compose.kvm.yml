#
# Layered last by vm.py's cases of a person's VM (harness.py's
# `Stack(layers=...)`): the devices a keeper gives the VM wall with. The
# locus service is given /dev/kvm, which every VMM holds, and /dev/net/tun,
# which a VMM attaches its tap through; the guard is given /dev/net/tun,
# through which it makes each VM's tap. Nothing else changes: a stack
# without this layer is the shipped one, which gives spaces.
services:
  locus:
    devices:
      - /dev/kvm
      - /dev/net/tun
  locus-guard:
    devices:
      - /dev/net/tun
