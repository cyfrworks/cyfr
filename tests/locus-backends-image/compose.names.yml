#
# Layered last by harness.py's `Stack(names=True)`: the backends guard's
# namespace takes the suites' name listener (name-listener.mjs) as its
# resolver's upstream, so Docker's resolver, which the guard asks for every
# space's names, asks it in turn. The listener shares the guard's
# namespace, on 127.0.0.53:53, which the guard's rules let the namespace's
# own processes reach (its loopback).
services:
  locus-backends-guard:
    dns:
      - 127.0.0.53
  name-listener:
    image: ${BACKENDS_IMAGE:?set BACKENDS_IMAGE}
    pull_policy: never
    network_mode: service:locus-backends-guard
    entrypoint: ["node", "/listener/name-listener.mjs"]
    volumes:
      - ${PROBE_DIR:?set PROBE_DIR}:/listener:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
