# Layered over docker-compose.yml by the backends image tests
# (tests/locus-backends-image/harness.py): the locus-backends service keeps
# every setting compose gives it, its security options, tmpfs mounts and
# limits among them (compose appends a list and refuses an entry named
# twice, so none of those is named here), and the namespace of its guard,
# in which it listens. This adds only the image under test, the probe
# backend (probe-backend.mjs) and the residue canary
# (tests/fixtures/residue-canary.go), read-only, and the two settings a
# test chooses: the backend pool's uid range and the per-backend memory
# bound (empty for the default). On the guard it adds the image under
# test, a loopback port for the service's listener, which the guard's
# namespace holds, and a tools directory first on its PATH, empty in every
# case but the one that starts the guard with an ip6tables that fails. It
# adds a stand-in for cyfr, the image under test answering on port 4000 at
# cyfr's fixed endpoint address and under cyfr's name on the backends
# network, which the suite proves a backend cannot reach, and it enables
# IPv6 on the backends network, so the guard's IPv6 rules meet routed
# packets. The containers take the names compose gives them from the
# project, so a run does not meet a deployed stack on the same host. The
# harness is the control plane: it supplies the backends key as
# CYFR_LOCUS_BACKENDS_KEY through the environment compose interpolates,
# which the shipped service reads as LOCUS_BACKENDS_KEY, and signs every
# request with it.
services:
  locus-backends:
    image: ${BACKENDS_IMAGE:?set BACKENDS_IMAGE}
    container_name: !reset null
    pull_policy: never
    volumes:
      - ${PROBE_DIR:?set PROBE_DIR}:/probe:ro
      - ${CANARY_DIR:?set CANARY_DIR}:/canary:ro
    entrypoint: ["cyfr-locus", "serve", "--pool", "backends:${BACKENDS_POOL:?set BACKENDS_POOL}", "--home-root", "/var/lib/locus/homes", "--client-user", "locus", "--", "/app/bin/locus", "start"]
    environment:
      - LOCUS_BACKENDS_MEMORY_BYTES=${LOCUS_BACKENDS_MEMORY_BYTES:-}
  locus-backends-guard:
    image: ${BACKENDS_IMAGE:?set BACKENDS_IMAGE}
    container_name: !reset null
    pull_policy: never
    ports:
      - "127.0.0.1::4101"
    volumes:
      - ${GUARD_TOOLS_DIR:?set GUARD_TOOLS_DIR}:/opt/cyfr-guard-tools:ro
    environment:
      - PATH=/opt/cyfr-guard-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  cyfr-stand-in:
    image: ${BACKENDS_IMAGE:?set BACKENDS_IMAGE}
    pull_policy: never
    entrypoint: ["node", "-e", "require('http').createServer((q, s) => s.end('stand-in')).listen(4000, '::')"]
    cap_drop:
      - ALL
    read_only: true
    networks:
      default:
        ipv4_address: ${ENDPOINT_ADDRESS:?set ENDPOINT_ADDRESS}
      locus-backends:
        aliases:
          - cyfr
networks:
  locus-backends:
    enable_ipv6: true
