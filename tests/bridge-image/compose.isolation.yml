#
# Layered over docker-compose.yml by isolation.test.mjs. The mcp-bridge
# service keeps every setting compose gives it; this adds only the image
# under test, a loopback port for the test to call, the probe backend and a
# planted secret in the bridge's own environment, and puts /data on a fresh
# volume, which takes the image's ownership of /data (the bridge's user,
# mode 0700) as a correctly owned host directory would.
services:
  mcp-bridge:
    image: ${BRIDGE_IMAGE:?set BRIDGE_IMAGE}
    pull_policy: never
    ports:
      - "127.0.0.1::8001"
    volumes:
      - bridge-data:/data
      - ${PROBE_DIR:?set PROBE_DIR}:/probe:ro
    environment:
      - CYFR_CRYPTO_KEYRING=planted-keyring-value

volumes:
  bridge-data: {}
