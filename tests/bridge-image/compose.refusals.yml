#
# Layered over docker-compose.yml and compose.isolation.yml by
# refusals.test.mjs: the image's entrypoint with a pool of three uids, so
# the test can fill it.
services:
  mcp-bridge:
    entrypoint: ["cyfr-keeper", "serve", "--pool", "backends:20001-20003", "--home-root", "/var/lib/cyfr-bridge/homes", "--client-user", "cyfr-bridge", "--", "node", "server.mjs"]
