# Layered over docker-compose.yml by the runtime image tests
# (tests/locus-runtime-image/stack.py): the locus service keeps every
# setting compose gives it: cyfr-locus's capabilities, its security options
# (`writable-cgroups=true` among them: compose appends a `security_opt`
# list and refuses an entry named twice, so none is named here), the
# read-only root, `ipc: none`, the homes and /run/locus tmpfs mounts, the
# runtime's bounds, the restart policy and its entrypoint. The suite sets
# the runtime's key alone, so the keeper starts the runtime role and no
# other. This adds only the image under test and the pool settings a test
# chooses, and on the guard the image under test and a loopback port for
# the tests to call the runtime on, which the guard forwards into the
# role's space; and it lets compose name the containers after the project,
# so a run does not meet a deployed stack on the same host. The tests
# supply the runtime's id, key and host URL through the environment
# compose interpolates, as .env would.
services:
  locus:
    image: ${LOCUS_RUNTIME_IMAGE:?set LOCUS_RUNTIME_IMAGE}
    container_name: !reset null
    pull_policy: never
    environment:
      - LOCUS_RUNTIME_POOL_SIZE=${LOCUS_RUNTIME_POOL_SIZE:?set LOCUS_RUNTIME_POOL_SIZE}
      - LOCUS_RUNTIME_IDLE_TTL_MS=${LOCUS_RUNTIME_IDLE_TTL_MS:?set LOCUS_RUNTIME_IDLE_TTL_MS}
      - LOCUS_RUNTIME_WATCHDOG_GRACE_MS=${LOCUS_RUNTIME_WATCHDOG_GRACE_MS:?set LOCUS_RUNTIME_WATCHDOG_GRACE_MS}
      - LOCUS_RUNTIME_RELEASE_GRACE_MS=${LOCUS_RUNTIME_RELEASE_GRACE_MS:?set LOCUS_RUNTIME_RELEASE_GRACE_MS}
  locus-guard:
    image: ${LOCUS_RUNTIME_IMAGE:?set LOCUS_RUNTIME_IMAGE}
    container_name: !reset null
    pull_policy: never
    ports:
      - "127.0.0.1::4200"
