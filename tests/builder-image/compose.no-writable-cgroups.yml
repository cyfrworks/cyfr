#
# Layered last by the builder image tests (tests/builder-image/stack.py,
# `up(writable_cgroups=False)`): the locus-builds service as a deployment
# without the `writable-cgroups=true` security option runs it, on a Docker
# Engine before 28 or from a compose file that predates the option. The
# list replaces the shipped one instead of joining it; every other setting
# stays the shipped service's.
services:
  locus-builds:
    security_opt: !override
      - no-new-privileges:true
