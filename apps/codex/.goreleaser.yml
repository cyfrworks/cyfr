version: 2
project_name: cyfr

builds:
  - main: .
    binary: cyfr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # A Mac is Apple silicon: CYFR builds nothing for Intel Macs.
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w
      - -X github.com/cyfr/codex/internal/version.Version={{.Version}}
      - -X github.com/cyfr/codex/internal/version.Commit={{.Commit}}
      - -X github.com/cyfr/codex/internal/version.Date={{.Date}}
    # Every binary the release publishes, each target's as it is built:
    # built with no build tag and holding none of the release proof or of
    # the tests' cheap key derivation, or the release fails before any
    # archive or upload (the script's header).
    # The path is from the workdir, apps/codex.
    hooks:
      post:
        - cmd: ../../scripts/ci/release-binary-check.sh "{{ .Path }}"
          output: true

archives:
  - name_template: "cyfr_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: ['tar.gz']
    format_overrides:
      - goos: windows
        formats: ['zip']

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # The scaffold tarball carries docker-compose.yml, which names the images
  # `cyfr up` pulls and runs — it must be in the signed checksum manifest,
  # not just attached beside it.
  extra_files:
    - glob: cyfr-scaffold.tar.gz
    # The CYFR app's five installers, which the release workflow builds
    # outside the checkout: cyfr takes one only as the signed checksums name
    # it. An unset RELEASE_PACKAGES_DIR or a missing installer fails the
    # checksums, before anything is uploaded; the release attaches the same
    # five below.
    - glob: "{{ .Env.RELEASE_PACKAGES_DIR }}/cyfr-desktop_{{ .Version }}_linux_amd64.deb"
    - glob: "{{ .Env.RELEASE_PACKAGES_DIR }}/cyfr-desktop_{{ .Version }}_linux_arm64.deb"
    - glob: "{{ .Env.RELEASE_PACKAGES_DIR }}/cyfr-desktop_{{ .Version }}_darwin_arm64.dmg"
    - glob: "{{ .Env.RELEASE_PACKAGES_DIR }}/cyfr-desktop_{{ .Version }}_windows_amd64.msi"
    - glob: "{{ .Env.RELEASE_PACKAGES_DIR }}/cyfr-desktop_{{ .Version }}_windows_arm64.msi"

signs:
  # Repeated up to three times, as release.yml signs release.json, and for
  # its reason. The path is from the workdir, apps/codex.
  - cmd: ../../scripts/ci/retry.sh
    signature: "${artifact}.sigstore.json"
    # The protobuf bundle (media type v0.3) sigstore-go reads: `cyfr init`
    # and `cyfr update` verify checksums.txt with it.
    args:
      - "cosign"
      - "sign-blob"
      - "--new-bundle-format"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# The release's notes are the tag's written note, which the release
# workflow hands GoReleaser (--release-notes) in place of a list of
# commits. The changelog step is what reads that file, so it is never
# disabled: a disabled changelog publishes an empty body.
release:
  github:
    owner: cyfrworks
    name: cyfr
  # A tag with a pre-release (0.6.0-alpha.1) publishes a GitHub pre-release,
  # which install.sh's latest and `cyfr update` skip.
  prerelease: auto
  make_latest: false
  extra_files:
    - glob: cyfr-scaffold.tar.gz
    - glob: "{{ .Env.RELEASE_PACKAGES_DIR }}/cyfr-desktop_{{ .Version }}_linux_amd64.deb"
    - glob: "{{ .Env.RELEASE_PACKAGES_DIR }}/cyfr-desktop_{{ .Version }}_linux_arm64.deb"
    - glob: "{{ .Env.RELEASE_PACKAGES_DIR }}/cyfr-desktop_{{ .Version }}_darwin_arm64.dmg"
    - glob: "{{ .Env.RELEASE_PACKAGES_DIR }}/cyfr-desktop_{{ .Version }}_windows_amd64.msi"
    - glob: "{{ .Env.RELEASE_PACKAGES_DIR }}/cyfr-desktop_{{ .Version }}_windows_arm64.msi"
    # Publish the installer as a release asset, pinned to its tag. `cyfr
    # update` runs no installer: it verifies the archive itself against the
    # signed checksums.txt (internal/release.FetchBinary).
    - glob: ../../scripts/install.sh
    # The release's manifest and its keyless signature, which the release
    # workflow writes and signs outside the checkout before this runs:
    # `cyfr update` verifies them against the workflow's identity at the
    # tag. An unset RELEASE_MANIFEST_DIR or a missing file fails the release.
    - glob: "{{ .Env.RELEASE_MANIFEST_DIR }}/release.json"
    - glob: "{{ .Env.RELEASE_MANIFEST_DIR }}/release.json.sigstore.json"
