version: 2
project_name: cyfr

builds:
  - main: .
    binary: cyfr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/cyfr/codex/internal/version.Version={{.Version}}
      - -X github.com/cyfr/codex/internal/version.Commit={{.Commit}}
      - -X github.com/cyfr/codex/internal/version.Date={{.Date}}

archives:
  - name_template: "cyfr_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: ['tar.gz']
    format_overrides:
      - goos: windows
        formats: ['zip']

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # The scaffold tarball carries docker-compose.yml, which names the images
  # `cyfr up` pulls and runs — it must be in the signed checksum manifest,
  # not just attached beside it.
  extra_files:
    - glob: cyfr-scaffold.tar.gz

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    # The protobuf bundle (media type v0.3) sigstore-go reads: `cyfr init`
    # and `cyfr update` verify checksums.txt with it.
    args:
      - "sign-blob"
      - "--new-bundle-format"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

homebrew_casks:
  - repository:
      owner: cyfrworks
      name: homebrew-cyfr
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://cyfr.run"
    description: "CLI for the CYFR sandboxed WASM runtime"
    binaries:
      - cyfr
    # Binaries are cosign-signed but not Apple-notarized, so macOS Gatekeeper
    # would quarantine them. Strip the quarantine xattr on install.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/cyfr"]
          end
    # Generate the cask into dist/ but do not push it — the release workflow
    # pushes it in a separate, non-fatal step.
    skip_upload: true

release:
  github:
    owner: cyfrworks
    name: cyfr
  make_latest: false
  extra_files:
    - glob: cyfr-scaffold.tar.gz
    # Publish the installer as a release asset so `cyfr upgrade` can fetch a
    # tag-pinned installer instead of piping main-branch HEAD to sh.
    - glob: ../../scripts/install.sh
    # The release's manifest and its keyless signature, which the release
    # workflow writes and signs outside the checkout before this runs:
    # `cyfr update` verifies them against the workflow's identity at the
    # tag. An unset RELEASE_MANIFEST_DIR or a missing file fails the release.
    - glob: "{{ .Env.RELEASE_MANIFEST_DIR }}/release.json"
    - glob: "{{ .Env.RELEASE_MANIFEST_DIR }}/release.json.sigstore.json"
