version: 2
project_name: cyfr

builds:
  - main: .
    binary: cyfr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/cyfr/codex/cmd.Version={{.Version}}
      - -X github.com/cyfr/codex/cmd.Commit={{.Commit}}
      - -X github.com/cyfr/codex/cmd.Date={{.Date}}

archives:
  - name_template: "cyfr_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: ['tar.gz']
    format_overrides:
      - goos: windows
        formats: ['zip']

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

brews:
  - repository:
      owner: cyfrworks
      name: homebrew-cyfr
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://cyfr.run"
    description: "CLI for the CYFR sandboxed WASM runtime"

release:
  github:
    owner: cyfrworks
    name: cyfr
  extra_files:
    - glob: cyfr-scaffold.tar.gz
