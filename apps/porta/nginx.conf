# nginx config for the porta image: serve the built A.Q.U.A. PWA and proxy
# the cyfr paths. Route shape mirrors vite.config.ts (preview.proxy), the
# Caddyfile, and the workbox navigateFallbackDenylist — the same request maps
# to cyfr everywhere:
#   /mcp (+ query/subpath)  → cyfr MCP endpoint; /mcp-servers (a PWA page)
#                             must NOT be caught, hence exact + ^~ prefix.
#   /api/ /auth/ /t/        → cyfr; sub-paths only, so /tinctures stays SPA.
# Host defaults to $proxy_host (the cyfr upstream), matching vite preview's
# changeOrigin: true.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches EmissaryWeb.Endpoint's Plug.Parsers limit.
    client_max_body_size 28m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /mcp {
        proxy_pass http://cyfr:4000;
        proxy_http_version 1.1;
        # MCP responses may be SSE streams — never buffer, never time out early.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /mcp/ {
        proxy_pass http://cyfr:4000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api|auth|t)/ {
        proxy_pass http://cyfr:4000;
        proxy_http_version 1.1;
        # /api serves SSE event streams as well.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every other path serves the app shell.
    location / {
        try_files $uri /index.html;
    }
}
