# cargo-audit configuration for porta (Tauri 2.x desktop client).
#
# Real CVEs are fixed by Cargo.lock pins (e.g. rustls-webpki bumped to 0.103.13+
# closes RUSTSEC-2026-0098/0099/0104). The ignores below are exclusively for
# `unmaintained` and `unsound` advisories that come from Tauri's transitive
# Linux/GTK3 dependency tree, which Tauri 2.x cannot yet move off. Re-evaluate
# when Tauri publishes its GTK4 migration.

[advisories]
ignore = [
    # ── GTK3 bindings family (unmaintained; Tauri 2.x Linux dep) ──────────────
    # gtk-rs maintainers archived the GTK3 bindings after GTK4 release. Tauri
    # 2.x still pins these on Linux. Cannot be fixed downstream of Tauri.
    "RUSTSEC-2024-0411",  # gdkwayland-sys
    "RUSTSEC-2024-0412",  # gdk
    "RUSTSEC-2024-0413",  # atk
    "RUSTSEC-2024-0414",  # gdkx11-sys
    "RUSTSEC-2024-0415",  # gtk
    "RUSTSEC-2024-0416",  # atk-sys
    "RUSTSEC-2024-0417",  # gdkx11
    "RUSTSEC-2024-0418",  # gdk-sys
    "RUSTSEC-2024-0419",  # gtk3-macros
    "RUSTSEC-2024-0420",  # gtk-sys
    "RUSTSEC-2024-0429",  # glib (unsoundness in VariantStrIter; Tauri transitive)

    # ── unic-* family (unmaintained; Tauri i18n transitive) ───────────────────
    "RUSTSEC-2025-0075",  # unic-char-range
    "RUSTSEC-2025-0080",  # unic-common
    "RUSTSEC-2025-0081",  # unic-char-property
    "RUSTSEC-2025-0098",  # unic-ucd-version
    "RUSTSEC-2025-0100",  # unic-ucd-ident

    # ── Other Tauri transitives (unmaintained) ────────────────────────────────
    "RUSTSEC-2024-0370",  # proc-macro-error (Tauri macro dep)
    "RUSTSEC-2025-0057",  # fxhash (Tauri transitive)

    # ── rand 0.8.5 unsound (RUSTSEC-2026-0097) ────────────────────────────────
    # Advisory: "Rand is unsound with a custom logger using `rand::rng()`".
    # Porta installs a tracing_subscriber logger (src/main.rs) but does NOT
    # call `rand::rng()` from inside any custom log layer or panic handler,
    # so the unsound code path is not reachable. Direct usage of `rand` in
    # porta is bounded; transitive copies live in Tauri / phf_generator /
    # markup5ever / cssparser, none of which install loggers either.
    "RUSTSEC-2026-0097",
]
