    <rect x="1384" y="180" width="120" height="150" rx="12" fill="#252540"/><circle cx="1444" cy="236" r="30" fill="#ef4444" fill-opacity=".3"/><text x="1444" y="246" font-size="28" fill="#e2e8f0">B</text><text x="1444" y="306">Birds</text>
  </g>

  <rect x="812" y="384" width="740" height="476" rx="14" fill="#1a1a2e" stroke="#2d2d4a" stroke-width="2"/>
  <text x="840" y="428" font-size="20" font-weight="600" fill="#e2e8f0">Schedules</text>
  <rect x="948" y="410" width="30" height="24" rx="12" fill="#252540"/><text x="963" y="428" font-size="15" fill="#818cf8" text-anchor="middle">3</text>
