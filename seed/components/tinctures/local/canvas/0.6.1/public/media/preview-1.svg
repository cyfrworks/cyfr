<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <radialGradient id="glow-a" cx="240" cy="90" r="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".22"/><stop offset=".6" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="1440" cy="860" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".12"/><stop offset=".6" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="#0f0f1a"/>
  <rect width="1600" height="900" fill="url(#glow-a)"/>
  <rect width="1600" height="900" fill="url(#glow-b)"/>

  <!-- the day in one sentence -->
  <text x="48" y="74" font-size="32" font-weight="600" fill="#e2e8f0">Friday 14 November</text>
  <text x="390" y="74" font-size="21" fill="#94a3b8">2 of your last 12 runs failed. One grant fixes all of them.</text>

  <!-- left column: what needs your attention, then recent runs -->
