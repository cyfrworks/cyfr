    <circle cx="968" cy="512" r="4"/><circle cx="982" cy="512" r="4"/><circle cx="1064" cy="512" r="4"/><circle cx="1078" cy="512" r="4"/><circle cx="1160" cy="512" r="4"/><circle cx="1174" cy="512" r="4"/>
    <circle cx="1256" cy="512" r="4"/><circle cx="1270" cy="512" r="4"/><circle cx="1352" cy="512" r="4"/><circle cx="1366" cy="512" r="4"/><circle cx="1448" cy="512" r="4"/><circle cx="1462" cy="512" r="4"/>
  </g>
  <g font-size="17">
    <circle cx="848" cy="590" r="6" fill="#22c55e"/><text x="868" y="590" font-weight="600" fill="#e2e8f0">Weather every 10 min</text><text x="868" y="614" font-size="15" fill="#64748b">next 14:30 · every 10 minutes</text>
    <rect x="1422" y="574" width="102" height="38" rx="8" fill="#252540" stroke="#2d2d4a" stroke-width="2"/><text x="1473" y="599" font-size="16" fill="#e2e8f0" text-anchor="middle">Pause</text>
    <line x1="840" y1="638" x2="1524" y2="638" stroke="#2d2d4a" stroke-width="2"/>
    <circle cx="848" cy="676" r="6" fill="#22c55e"/><text x="868" y="676" font-weight="600" fill="#e2e8f0">Morning digest</text><text x="868" y="700" font-size="15" fill="#64748b">next tomorrow 07:00 · daily</text>
    <rect x="1422" y="660" width="102" height="38" rx="8" fill="#252540" stroke="#2d2d4a" stroke-width="2"/><text x="1473" y="685" font-size="16" fill="#e2e8f0" text-anchor="middle">Pause</text>
    <line x1="840" y1="724" x2="1524" y2="724" stroke="#2d2d4a" stroke-width="2"/>
    <circle cx="848" cy="762" r="6" fill="#f59e0b"/><text x="868" y="762" font-weight="600" fill="#e2e8f0">Weekly review</text><text x="868" y="786" font-size="15" fill="#64748b">paused · Mondays at 09:00</text>
    <rect x="1422" y="746" width="102" height="38" rx="8" fill="#6366f1"/><text x="1473" y="771" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Resume</text>
