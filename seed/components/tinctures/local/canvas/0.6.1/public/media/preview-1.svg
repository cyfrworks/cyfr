  <text x="76" y="152" font-size="20" font-weight="600" fill="#e2e8f0">Needs attention</text>
  <rect x="244" y="134" width="30" height="24" rx="12" fill="#252540"/><text x="259" y="152" font-size="15" fill="#818cf8" text-anchor="middle">2</text>
  <g>
    <circle cx="92" cy="200" r="13" fill="#ef4444" fill-opacity=".18"/><rect x="90" y="191" width="4" height="11" rx="2" fill="#ef4444"/><circle cx="92" cy="207" r="2.2" fill="#ef4444"/>
    <text x="120" y="207" font-size="18" font-weight="600" fill="#e2e8f0">Failed <tspan font-weight="400" fill="#64748b">· not granted</tspan></text>
    <text x="120" y="236" font-size="16" fill="#94a3b8">digest asked for gmail.com, which its grant does not cover.</text>
    <rect x="120" y="254" width="138" height="30" rx="15" fill="#252540"/><text x="136" y="275" font-size="15" fill="#e2e8f0">digest <tspan fill="#64748b">×2</tspan></text>
    <rect x="620" y="186" width="140" height="40" rx="9" fill="#6366f1"/><text x="690" y="212" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle">Grant</text>
    <line x1="76" y1="312" x2="760" y2="312" stroke="#2d2d4a" stroke-width="2"/>
    <circle cx="92" cy="352" r="13" fill="#f59e0b" fill-opacity=".18"/><rect x="90" y="343" width="4" height="11" rx="2" fill="#f59e0b"/><circle cx="92" cy="359" r="2.2" fill="#f59e0b"/>
    <text x="120" y="358" font-size="18" font-weight="600" fill="#e2e8f0">Paused <tspan font-weight="400" fill="#64748b">· weekly review</tspan></text>
    <text x="120" y="384" font-size="16" fill="#94a3b8">It has not run since Monday.</text>
  </g>

  <rect x="48" y="428" width="740" height="432" rx="14" fill="#1a1a2e" stroke="#2d2d4a" stroke-width="2"/>
