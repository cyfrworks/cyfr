    <rect x="976" y="180" width="120" height="150" rx="12" fill="#252540"/><circle cx="1036" cy="236" r="30" fill="#22c55e" fill-opacity=".3"/><text x="1036" y="246" font-size="28" fill="#e2e8f0">F</text><text x="1036" y="306">Flights</text>
