  <rect x="210" y="454" width="38" height="24" rx="12" fill="#252540"/><text x="229" y="472" font-size="15" fill="#818cf8" text-anchor="middle">12</text>
  <g>
    <rect x="76" y="498" width="44" height="34" rx="5" fill="#22c55e"/><rect x="128" y="498" width="44" height="34" rx="5" fill="#22c55e"/><rect x="180" y="498" width="44" height="34" rx="5" fill="#ef4444"/><rect x="232" y="498" width="44" height="34" rx="5" fill="#22c55e"/>
    <rect x="284" y="498" width="44" height="34" rx="5" fill="#22c55e"/><rect x="336" y="498" width="44" height="34" rx="5" fill="#22c55e"/><rect x="388" y="498" width="44" height="34" rx="5" fill="#ef4444"/><rect x="440" y="498" width="44" height="34" rx="5" fill="#22c55e"/>
    <rect x="492" y="498" width="44" height="34" rx="5" fill="#22c55e"/><rect x="544" y="498" width="44" height="34" rx="5" fill="#22c55e"/><rect x="596" y="498" width="44" height="34" rx="5" fill="#22c55e"/><rect x="648" y="498" width="44" height="34" rx="5" fill="#3b82f6"/>
  </g>
  <text x="76" y="556" font-size="14" fill="#64748b">newest</text><text x="692" y="556" font-size="14" fill="#64748b" text-anchor="end">12 runs ago</text>
  <g font-size="17">
    <circle cx="84" cy="596" r="6" fill="#3b82f6"/><text x="104" y="602" font-weight="600" fill="#e2e8f0">sync notes</text><text x="210" y="602" fill="#64748b">running · 14:18</text>
    <line x1="76" y1="624" x2="760" y2="624" stroke="#2d2d4a" stroke-width="2"/>
    <circle cx="84" cy="656" r="6" fill="#22c55e"/><text x="104" y="662" font-weight="600" fill="#e2e8f0">weather</text><text x="186" y="662" fill="#64748b">1.2 s · 14:10</text>
    <line x1="76" y1="684" x2="760" y2="684" stroke="#2d2d4a" stroke-width="2"/>
    <circle cx="84" cy="716" r="6" fill="#ef4444"/><text x="104" y="722" font-weight="600" fill="#e2e8f0">digest</text><text x="172" y="722" fill="#64748b">not granted · 10:40</text>
    <rect x="660" y="698" width="100" height="36" rx="8" fill="#252540" stroke="#2d2d4a" stroke-width="2"/><text x="710" y="722" font-size="16" fill="#e2e8f0" text-anchor="middle">Retry</text>
    <line x1="76" y1="746" x2="760" y2="746" stroke="#2d2d4a" stroke-width="2"/>
    <circle cx="84" cy="778" r="6" fill="#22c55e"/><text x="104" y="784" font-weight="600" fill="#e2e8f0">morning digest</text><text x="246" y="784" fill="#64748b">2.4 s · 07:00</text>
    <text x="76" y="836" font-size="15" fill="#64748b">8 more</text>
  </g>

