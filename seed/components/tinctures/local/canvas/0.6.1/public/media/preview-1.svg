    <text x="880" y="470">Fri</text><text x="976" y="470">Sat</text><text x="1072" y="470">Sun</text><text x="1168" y="470">Mon</text><text x="1264" y="470">Tue</text><text x="1360" y="470">Wed</text><text x="1456" y="470">Thu</text>
    <rect x="840" y="482" width="80" height="62" rx="8" fill="#252540" stroke="#6366f1" stroke-width="2"/><rect x="936" y="482" width="80" height="62" rx="8" fill="#252540"/><rect x="1032" y="482" width="80" height="62" rx="8" fill="#252540"/><rect x="1128" y="482" width="80" height="62" rx="8" fill="#252540"/><rect x="1224" y="482" width="80" height="62" rx="8" fill="#252540"/><rect x="1320" y="482" width="80" height="62" rx="8" fill="#252540"/><rect x="1416" y="482" width="80" height="62" rx="8" fill="#252540"/>
  </g>
