    <g fill="#f7f7f2"><rect x="200" y="50" width="2" height="1"/><rect x="203" y="50" width="2" height="1"/><rect x="202" y="51" width="1" height="1"/><rect x="230" y="60" width="2" height="1"/><rect x="233" y="60" width="2" height="1"/><rect x="232" y="61" width="1" height="1"/></g>

