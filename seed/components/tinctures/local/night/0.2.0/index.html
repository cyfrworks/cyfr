<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Night</title>
<meta name="description" content="Your CYFR as a street at night: only what waits on you burns.">
<meta name="color-scheme" content="dark">
<link rel="preload" href="fonts/tilt-neon-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="street" class="street" data-posture="desk">
  <canvas id="sky" aria-hidden="true"></canvas>
  <svg id="wires" aria-hidden="true" focusable="false"></svg>
  <header id="header" class="plate-row"><div class="streetplate"><h1>your street</h1><p><span class="count">The street is dark.</span></p></div></header>
  <main id="wall" class="wall" aria-label="The wall"></main>
  <div id="level" class="level" aria-label="Street level"></div>
  <footer id="puddle" class="puddle"><canvas id="puddle-c" aria-hidden="true"></canvas><div id="puddle-index"><noscript><p>This street lights up with scripts on: open it in CYFR.</p></noscript></div></footer>
  <aside id="plate" class="plate" hidden role="dialog" aria-labelledby="plate-title"></aside>
  <aside id="fusebox" class="fusebox" hidden role="dialog" aria-labelledby="h-fuse"></aside>
</div>
<script src="model.js"></script>
<script src="scene.js"></script>
<script src="street.js"></script>
</body>
</html>
