[package]
name = "claude-code-catalyst"
version = "0.1.3"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[package.metadata.component]
package = "cyfr:catalyst"

[package.metadata.component.target]
world = "catalyst"
path = "wit"

[package.metadata.component.target.dependencies]
"cyfr:emit" = { path = "wit/deps/cyfr-emit" }
"cyfr:process" = { path = "wit/deps/cyfr-process" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
