# CYFR self-hosted stack:
#   cyfr        — control plane / API (Emissary :4000) + Prism dashboard (:4001)
#   porta       — the A.Q.U.A. PWA, served by `vite preview` on :8080
#                 (also proxies /mcp /api /auth /t to cyfr:4000 so direct-mode
#                 access on :8080 is same-origin without Caddy)
#   mcp-bridge  — HTTP MCP gateway that wraps stdio/npx MCP servers. Register
#                 it from the PWA's "MCP Servers" page (one-click preset);
#                 admin and child tools all surface under cyfr's `bridge:`
#                 namespace. State persists to ./data/mcp-bridge/backends.json.
#   caddy       — TLS + reverse proxy. Opt-in via the `tls` profile.
#                 PWA at /, API under /mcp /api /auth /t.   [profile: tls]
#
# `cyfr init` writes this file (and Caddyfile + .env) into a fresh project dir;
# from a source checkout, `cp .env.example .env` instead. Then:
#   docker compose up -d                        # direct mode: cyfr + porta + mcp-bridge
#   docker compose --profile tls up -d          # also start Caddy for TLS
# `cyfr init` writes CYFR_BEHIND_PROXY=true into .env when you answer "yes" to
# the TLS prompt, and `cyfr up` adds `--profile tls` automatically when that
# flag is set. See the "Deploy to a Server" section of README.md.

services:
  cyfr:
    container_name: cyfr
    image: ghcr.io/cyfrworks/cyfr:latest
    expose:
      - "4000"
      - "4001"
    ports:
      # Loopback-only: the Codex CLI talks to http://127.0.0.1:4000 and the
      # Prism dashboard is at http://localhost:4001. The PWA reaches cyfr
      # over the compose network (via Caddy in tls mode, via porta's vite
      # preview proxy in direct mode).
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:4001:4001"
    volumes:
      - ./data:/app/data
      - ./components:/app/components
      - ./aqua:/app/aqua
    env_file:
      - .env
    environment:
      - CYFR_HOST=${CYFR_HOST:-localhost}
      # In tls mode (Caddy in front, ACME TLS, X-Forwarded-* on) set this to
      # `true` in .env. `cyfr init`'s TLS prompt writes the right value.
      - CYFR_BEHIND_PROXY=${CYFR_BEHIND_PROXY:-false}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

  porta:
    image: ghcr.io/cyfrworks/cyfr-porta:latest
    ports:
      # Direct mode: published on 0.0.0.0:8080 so the browser can reach it.
      # TLS mode: bound to 127.0.0.1 (debug only — Caddy fronts it from :443).
      # `cyfr init` writes the right value into .env.
      - "${CYFR_PORTA_BIND:-127.0.0.1:8080}:8080"
    restart: unless-stopped
    depends_on:
      - cyfr

  mcp-bridge:
    # Built locally from Dockerfile.node (not a published image), so `docker
    # compose pull` won't fetch it — `up` builds it on first run.
    build:
      context: .
      dockerfile: Dockerfile.node
      target: mcp-bridge
    expose:
      - "8001"
    environment:
      # Defense-in-depth: when set, /mcp requires `Authorization: Bearer <token>`.
      # Register the bridge in the PWA with header `Authorization: secret:mcp_bridge_token`
      # (store the same value as the `mcp_bridge_token` secret). Unset = open on
      # the trusted container network only. The port is `expose`d, never published.
      - MCP_BRIDGE_TOKEN=${MCP_BRIDGE_TOKEN:-}
    volumes:
      # Host-visible persistence: backends.json lives here, easy to inspect
      # or back up. The container creates the file on first add_backend.
      - ./data/mcp-bridge:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CYFR_HOST=${CYFR_HOST:-localhost}
      - CADDY_ACME_EMAIL=${CADDY_ACME_EMAIL:-}
    depends_on:
      - cyfr
      - porta
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
