# CYFR self-hosted stack:
#   cyfr        — the one endpoint (:4000): Prism (chat + console), API, MCP,
#                 tinctures; its host API (:4300) takes the runtime's host
#                 calls, signed with a runtime worker's key, on cyfr's own
#                 address of the locus network alone
#   locus       — the one Locus: cyfr-locus, its keeper, starts a role
#                 process for each role whose key it holds, each under a
#                 uid of its own, in a space of its own, with its own run
#                 folder, its own bounds and a channel to the keeper that
#                 reaches its own spawns alone:
#                   runtime  (:4200, LOCUS_RUNTIME_KEY) runs WASM components
#                            as CYFR assigns them; every request is signed
#                            under the worker key CYFR derives for
#                            LOCUS_RUNTIME_SERVICE_ID;
#                   builds   (:4100, CYFR_LOCUS_BUILDS_KEY) compiles
#                            components and tinctures; on once `cyfr init`
#                            mints its key, off with the key empty;
#                   backends (:4101, CYFR_LOCUS_BACKENDS_KEY) runs the
#                            programs CYFR registers (`mcp_servers` rows
#                            with transport `stdio` or `pipe`), one owner
#                            a row; its one state is the kept homes on its
#                            `homes` volume, which no backup holds.
#                 No role holds tenant state, and none sees another's key,
#                 processes, files, port or spawns.
#   locus-guard — Locus's egress guard: the same image running
#                 `cyfr-locus guard-control` with NET_ADMIN alone, whose network namespace `locus`
#                 shares. It makes each role process's, each build's and
#                 each program session's one route out of its space, so a
#                 build or a backend reaches public hosts and the private
#                 hosts CYFR_PRIVATE_EGRESS_TARGETS names, the runtime
#                 reaches cyfr's host API, and none reaches a link-local or
#                 metadata address, the control plane, another private
#                 address or another space. Locus starts only once its guard
#                 is healthy, which it is only with every rule installed.
# Locus runs under keeper.seccomp.json, shipped beside this file, and on a
# host with AppArmor under the profile .env names (CYFR_LOCUS_APPARMOR),
# which cyfr carries and `cyfr init` and `cyfr update` load, on a host that
# allows unprivileged user namespaces (the locus service says each). Every
# other service runs under container.seccomp.json, shipped beside it:
# Docker's default seccomp profile with socket's and socketpair's domain and
# personality's persona compared by their low 32 bits, as the kernel reads
# them, socketcall denied and every 32-bit and x32 call killed. Docker's
# own compares those arguments whole, so a domain whose low 32 bits are
# AF_VSOCK's passes it and makes an AF_VSOCK socket. keeper.seccomp.json is
# this profile and the keeper's three differences.
#   caddy      — TLS and the reverse proxy in front of a public home, on
#                 :80 and :443, forwarding to cyfr's proxy listener on the
#                 edge network.                           [profile: public]
#   tailscale  — Tailscale Serve in front of a tailnet home, forwarding to
#                 cyfr's proxy listener on the edge network; SOCKS5 on
#                 host loopback for this device's browser. [profile: tailnet]
#
# How the home is reached is CYFR_ACCESS in .env (local, tailnet or public),
# which `cyfr init` and `cyfr access` write with every setting it implies.
# `cyfr up`, `cyfr access`, `cyfr update` and `cyfr restore` start the stack
# with the access mode's proxy profile (`public` or `tailnet`; none for
# `local`). They run Docker Compose with every COMPOSE_* variable cleared,
# refuse a .env that sets one, and check the home's settings and its
# tailnet machine before anything is served. Running `docker compose`
# directly skips those checks. To build nothing, set CYFR_LOCUS_BUILDS_KEY
# empty. See the "Deploy to a Server" section of README.md.

services:
  cyfr:
    container_name: cyfr
    image: ghcr.io/cyfrworks/cyfr:latest
    expose:
      - "${CYFR_PORT:-4000}"
      # The proxy listener, reached by caddy and tailscale over the edge
      # network; never published.
      - "${CYFR_PROXY_PORT:-4001}"
      # The host API, reached by Locus's runtime over the locus network;
      # never published.
      - "${CYFR_HOST_API_PORT:-4300}"
    ports:
      # The loopback listener, published on the host's loopback alone: the
      # Codex CLI and an SSH tunnel reach
      # http://127.0.0.1:${CYFR_PORT:-4000}, and nothing off this machine
      # does.
      - "127.0.0.1:${CYFR_PORT:-4000}:${CYFR_PORT:-4000}"
    volumes:
      - ./data:/app/data
      - ./aqua:/app/seed/aqua
      # The seed bundle is baked into the image. To serve a custom bundle,
      # mount one over the image's copy:
      #   - ./my-bundle:/app/seed/components:ro
    env_file:
      - .env
    # Every access setting (CYFR_ACCESS, CYFR_HOST, CYFR_PUBLIC_URL,
    # CYFR_TAILNET_NODE_ID, CYFR_PORT) reaches cyfr from .env through
    # env_file alone: `cyfr` refuses to start a stack whose configuration
    # assigns one here.
    environment:
      # The private hosts outbound calls may reach; Locus is one.
      - CYFR_PRIVATE_EGRESS_TARGETS=${CYFR_PRIVATE_EGRESS_TARGETS:-locus}
      # Where cyfr reaches Locus's backends role. Stdio MCP servers need
      # this and CYFR_LOCUS_BACKENDS_KEY, which cyfr reads from .env
      # (env_file above). The builds role answers beside it, at the same
      # host on its own port, whenever .env sets CYFR_LOCUS_BUILDS_KEY.
      - CYFR_LOCUS_BACKENDS_URL=${CYFR_LOCUS_BACKENDS_URL:-http://locus:4101}
      # The runtime cyfr dispatches runs to, and where it listens for the
      # runtime's host calls: cyfr's own address on the locus network
      # (below), so the host API is reachable from that network alone, and
      # serves there only calls signed with a runtime worker's key.
      # CYFR_LOCUS_RUNTIME_ROOT, the root the runtime's key derives from,
      # comes from .env.
      - CYFR_LOCUS_RUNTIME_WORKERS=${CYFR_LOCUS_RUNTIME_WORKERS:-wrk_locus=http://locus:4200}
      - CYFR_HOST_API_BIND=172.16.231.2
      - CYFR_HOST_API_PORT=${CYFR_HOST_API_PORT:-4300}
      # The loopback listener binds cyfr's own fixed address on the default
      # network (below), which Docker publishes on the host's loopback port
      # and no other container joins, so only this machine reaches it. A
      # release refuses a bind that is not a loopback address unless the
      # process environment asserts this; the assertion comes from this
      # file alone, and a .env that sets it is refused.
      - CYFR_BIND_ADDRESS=172.16.230.2
      - CYFR_LOCAL_INGRESS_ASSERTED=true
      # The proxy listener, served in tailnet and public alone, binds cyfr's
      # fixed address on the edge network, where caddy and tailscale reach
      # it; it trusts forwarded headers from those two addresses alone.
      - CYFR_PROXY_BIND_ADDRESS=172.16.234.2
      - CYFR_TRUSTED_PROXY_CIDRS=${CYFR_TRUSTED_PROXY_CIDRS:-172.16.234.3,172.16.234.4}
    networks:
      # A fixed address, the one CYFR_BIND_ADDRESS names: outside the
      # network's ip_range, so no container started first can take it. The
      # network is cyfr's gateway (gw_priority), so Docker maps the
      # published loopback port to this address whatever other networks
      # cyfr joins and in whatever order they came up (the network is
      # dual-stack for the same reason, see `networks`); without that, an
      # IPv6-enabled island network takes the mapping, and the port
      # answers nothing (tests/compose-proof/run.sh --case bind holds it).
      default:
        ipv4_address: 172.16.230.2
        gw_priority: 1
      # A fixed address, the one CYFR_PROXY_BIND_ADDRESS names, outside the
      # network's ip_range. No gw_priority: the default network keeps the
      # published port.
      edge:
        ipv4_address: 172.16.234.2
      # A fixed address, the one CYFR_HOST_API_BIND names: outside the
      # network's ip_range, so no container started first can take it.
      locus:
        ipv4_address: 172.16.231.2
    restart: unless-stopped
    # The endpoints drain connections for up to 30s on shutdown; compose's
    # default 10s grace would SIGKILL mid-drain.
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
          # The control plane's own share of the host: components run in
          # Locus, under the runtime's bounds.
          cpus: "${CYFR_CPU_LIMIT:-4}"
    # Healthcheck: inherited from the image (Dockerfile HEALTHCHECK) so the
    # port and the probed path have one author.
    # The stack's container profile (the header says it).
    security_opt:
      - seccomp=./container.seccomp.json

  # The one Locus: the image's entrypoint, cyfr-locus serving every role
  # whose key this environment holds (Dockerfile.locus). Pulled as
  # published; a source checkout builds it with `docker compose build
  # locus`.
  locus:
    container_name: cyfr-locus
    image: ghcr.io/cyfrworks/cyfr-locus:latest
    build:
      context: .
      dockerfile: Dockerfile.locus
    # docker-init is PID 1 and forwards stop signals to cyfr-locus, the
    # child subreaper of every role process and every build, runner and
    # backend: an orphaned process is reparented to it, not to docker-init,
    # and retired with its uid.
    init: true
    # cyfr-locus refuses to start with any capability other than these: it
    # starts each role process and each build, runner or backend under
    # their own uids and signals their processes. Every process it starts
    # runs with none.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
    # no-new-privileges:true: no process in the container gains a privilege
    # by executing a setuid or file-capability binary.
    # writable-cgroups=true (Docker Engine 28 or later, on a cgroup v2 host)
    # mounts the container's own cgroup writable, which adds no capability:
    # cyfr-locus makes the pool's groups there: every build, runner and
    # backend in one memory bound for all of Locus's work, each role's at
    # its processors (below), and each a group of its own inside it,
    # bounded by its kind: a build at 1 GiB, a runner and a session at half
    # of that one bound, never under 420 MiB and 384 MiB (Prima.LocusPool).
    # Without the option nothing runs unbounded and nothing runs:
    # cyfr-locus refuses to start, since no role's group can be made, and
    # the container restart-loops.
    # seccomp=./keeper.seccomp.json: cyfr-locus clones each role process
    # and every build, runner and backend into a space of its own, a user,
    # network, IPC, pid, mount and cgroup namespace with files of its own,
    # which the space's first process mounts in its own mount namespace.
    # Docker's default seccomp profile denies a clone that makes a
    # namespace and every mount, so Locus runs under keeper.seccomp.json,
    # shipped beside this file (the image's /etc/cyfr/keeper.json):
    # Docker's default with those clones and the space's mounts allowed,
    # unshare, setns and socketcall denied, socket's and socketpair's domain
    # and personality's persona compared by their low 32 bits, so a domain
    # whose low 32 bits are AF_VSOCK's is AF_VSOCK to the profile, as it is
    # to the kernel, and every 32-bit and x32 call killed: no 32-bit program
    # runs in Locus.
    # apparmor: on a host with AppArmor, the container runs under the
    # profile .env's CYFR_LOCUS_APPARMOR names, cyfr-locus- and 12 hex
    # digits of its content's hash, which cyfr carries and `cyfr init` and
    # `update` write there and load (`cyfr apparmor-profile` prints it);
    # unset, it names no profile, which Docker refuses: Docker's default
    # with the user namespace allowed, the space's mounts under its new root
    # allowed and no other mount. A host without AppArmor, Docker Desktop
    # among them, ignores the option. systempaths=unconfined: a /proc that
    # Docker has masked lets no space mount its own, so the container's
    # system paths are unmasked; on a host with AppArmor the profile denies
    # them again, and on one without, the keeper alone, never a space, may
    # write /proc/sys. The keeper proves at its boot that it runs under its
    # image's profile name, enforced, or that the host has no AppArmor. The
    # host must allow unprivileged user namespaces:
    # user.max_user_namespaces above 0. Without any of these cyfr-locus
    # refuses to start, naming what to check, and the container
    # restart-loops.
    security_opt:
      - no-new-privileges:true
      - writable-cgroups=true
      - seccomp=./keeper.seccomp.json
      - apparmor=${CYFR_LOCUS_APPARMOR:-cyfr-locus-unset}
      - systempaths=unconfined
    # Locus holds no tenant state: the root is read-only, the tmpfs mounts
    # and the kept homes below are its only writable surfaces, and
    # cyfr-locus refuses to start if any other location is writable by a
    # role's or a pool's uid. `ipc: none` leaves /dev/shm unmounted.
    read_only: true
    ipc: none
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # The release's settings from .env.locus, one file for every role. Locus
    # never sees the rest of .env: not the keyring, not the database, not
    # the runtime's root, and each role process sees its own variables
    # alone (LOCUS_<ROLE>_*), which the keeper hands it; a role refuses to
    # start with any control-plane variable in its environment.
    env_file:
      - path: .env.locus
        required: false
    environment:
      # The three keys, each a role's: a role starts when its key is set
      # and is off when it is empty. Each is 32 random bytes as 64
      # hexadecimal digits. The runtime's is the worker key CYFR derives
      # for LOCUS_RUNTIME_SERVICE_ID from CYFR_LOCUS_RUNTIME_ROOT; the
      # builds and backends keys are the values cyfr reads as
      # CYFR_LOCUS_BUILDS_KEY and CYFR_LOCUS_BACKENDS_KEY, which `cyfr init`
      # mints. A key of another form refuses that role's start, and its
      # process restart-loops alone.
      - LOCUS_RUNTIME_KEY=${LOCUS_RUNTIME_KEY:-}
      - LOCUS_BUILDS_KEY=${CYFR_LOCUS_BUILDS_KEY:-}
      - LOCUS_BACKENDS_KEY=${CYFR_LOCUS_BACKENDS_KEY:-}
      # The runtime's id, cyfr's host API it reaches over its route, and
      # its listener, which the guard forwards its port to.
      - LOCUS_RUNTIME_SERVICE_ID=${LOCUS_RUNTIME_SERVICE_ID:-wrk_locus}
      - LOCUS_RUNTIME_HOST_API_URL=${LOCUS_RUNTIME_HOST_API_URL:-http://cyfr:${CYFR_HOST_API_PORT:-4300}}
      - LOCUS_RUNTIME_BIND=0.0.0.0
      - LOCUS_RUNTIME_PORT=4200
      # The pool, the one definition of its defaults: all of Locus's work
      # shares one memory bound, the machine's memory less the reserve kept
      # for CYFR itself beside it (2304 MiB, which holds about 1.7 GiB at its
      # peak, the screen's app included), less the services' share
      # (800 MiB); the services sit outside it (Prima.LocusPool,
      # configuration-guide.md). Each role's processors are split between
      # its service and its work, neither lending to the other; the
      # backends' have no bound.
      - LOCUS_CORE_RESERVE_BYTES=${LOCUS_CORE_RESERVE_BYTES:-2415919104}
      - LOCUS_SERVICE_BYTES=${LOCUS_SERVICE_BYTES:-838860800}
      - LOCUS_RUNTIME_CPU_LIMIT=${LOCUS_RUNTIME_CPU_LIMIT:-4}
      - LOCUS_BUILDS_CPU_LIMIT=${LOCUS_BUILDS_CPU_LIMIT:-2}
    # Only cyfr reaches Locus: it shares the network namespace of its
    # guard, which sits on the locus network, which cyfr also joins; caddy
    # and tailscale never see a role's port. Each role process listens in
    # a space of its own, which the guard forwards the role's port to from
    # the network alone. The network is not `internal`: cargo and npm need
    # crates.io and the registry, and a program its upstream API. What a
    # role process, a build or a session reaches out to is its route's
    # rules (the guard's): public hosts, or the hosts a program's row named
    # at its start, and the private hosts CYFR_PRIVATE_EGRESS_TARGETS
    # names; the runtime's role process cyfr's host API and every private
    # address besides, and its runners nothing but their relays; nothing
    # link-local, no metadata address, not the control plane and no other
    # space. Locus starts only once the guard is healthy, which it is only
    # with every rule installed; a guard that restarts takes a fresh
    # namespace, and the keeper, which loses its control, ends every role
    # and is recreated to join it (`docker compose up -d`).
    network_mode: service:locus-guard
    depends_on:
      locus-guard:
        condition: service_healthy
    # These tmpfs mounts are the only writable surfaces under the
    # read-only root but the kept homes, so no role or spawn has a shared
    # /tmp, /var/tmp or /dev/shm. Each role's spawns' homes, a mount of the
    # role's own: each spawn's uid creates its own 0700 home there holding
    # its temporary files (a build's sources, Cargo home, npm cache and
    # target, a runner's VM's files, a program's npx cache); mode 1733 lets
    # it create one without listing the others, and spawns run from there,
    # so it allows exec. What a spawn writes to its home counts against its
    # memory bound, and the mount's size bounds what all of a role's spawns
    # write. /run/locus is root's, 0711, holding each role's run folder, a
    # tmpfs of the role's own uid, 0700, which the keeper takes as the
    # role's: its release's temporary files and the socket its spawns'
    # relays attach to, bounded apart so no role fills another's, and no
    # role reaches another's.
    tmpfs:
      - /var/lib/locus/homes/runtime:mode=1733,exec,size=256m
      - /var/lib/locus/homes/builds:mode=1733,exec,size=2g
      - /var/lib/locus/homes/backends:mode=1733,exec,size=2g
      - /run/locus:mode=0711,size=1m
      - /run/locus/runtime:uid=10011,gid=10011,mode=0700,size=16m
      - /run/locus/builds:uid=10012,gid=10012,mode=0700,size=16m
      - /run/locus/backends:uid=10013,gid=10013,mode=0700,size=16m
    # Kept homes: a program's home that outlives its process, one 0700
    # folder per login entry under a uid of its own, which the keeper alone
    # finds, lists and draws. The volume is the homes' whole disk and their
    # only bound beside a row's own home_max_bytes; it is never under data/
    # and no backup carries it. The image makes its root root's and the
    # locus group's, 1773, which a new volume takes; no role mounts it or
    # is of that group. The guard's control, read-only here: its folder is
    # root's own, 0700, so in this container the keeper alone reaches it.
    # The machines' device and each machine's sockets, the `guest` volume
    # below, the keeper's alone: no role mounts it.
    volumes:
      - homes:/var/lib/locus/kept
      - guard-control:/run/cyfr-guard-control:ro
      - guest:/var/lib/locus/guest
    # Shutdown ends every role: running attempts close or are reported and
    # every backend is retired; compose's default 10s grace would SIGKILL
    # mid-report.
    stop_grace_period: 40s
    # Healthcheck: the image's (Dockerfile.locus HEALTHCHECK,
    # apps/locus/health.sh), which probes each role whose key is set at its
    # port, each at its wire's version.

  # Locus's egress guard: the Locus image running `cyfr-locus
  # guard-control` (apps/locus/keeper/guard) in the network namespace locus
  # shares, holding NET_ADMIN and no other capability. It carries Locus's
  # service name as an alias, so cyfr's URLs for each role resolve to the
  # namespace the roles listen in. Its health is the ready file the guard
  # writes only once every rule is installed and its control listens, re-checked against the rules
  # in place; a guard whose rules failed never turns healthy, so Locus
  # never starts. It runs no release and holds no key.
  locus-guard:
    container_name: cyfr-locus-guard
    image: ghcr.io/cyfrworks/cyfr-locus:latest
    build:
      context: .
      dockerfile: Dockerfile.locus
    # The roles' ports, which they are reached at in this namespace: Docker
    # takes a port's exposure from the namespace's owner alone.
    expose:
      - "4100"
      - "4101"
      - "4200"
    entrypoint: ["cyfr-locus", "guard-control"]
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
      - seccomp=./container.seccomp.json
    read_only: true
    ipc: none
    # A route forwards a space's packets, and every refusal is answered at
    # once: the guard refuses to start in a namespace without these.
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.icmp_ratelimit: "0"
    # The ready file's tmpfs, the guard's only writable surface beside its
    # control's volume.
    tmpfs:
      - /run/cyfr-guard:mode=0755,size=1m
    environment:
      # cyfr's fixed address on the default network; the private hosts the
      # deployment names, the one exception to the private ranges; the
      # control's socket, on the `guard-control` volume, the one other place
      # the guard writes: each route, made before its space starts; and
      # cyfr's host API, its fixed address on the locus network and its
      # port, which the runtime's role process alone reaches.
      - CYFR_GUARD_CONTROL_PLANE=172.16.230.2
      - CYFR_PRIVATE_EGRESS_TARGETS=${CYFR_PRIVATE_EGRESS_TARGETS:-locus}
      - CYFR_GUARD_CONTROL=/run/cyfr-guard-control/guard.sock
      - CYFR_GUARD_HOST_API=172.16.231.2:${CYFR_HOST_API_PORT:-4300}
    volumes:
      - guard-control:/run/cyfr-guard-control
    networks:
      locus:
        aliases:
          - locus
    healthcheck:
      test: ["CMD", "cyfr-locus", "guard-check"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 32M

  caddy:
    profiles: ["public"]
    # Pinned by digest, the tag kept for the reader: the release's manifest
    # carries this digest, and `cyfr update` rewrites the line to it.
    image: caddy:2.11-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CYFR_HOST=${CYFR_HOST:-localhost}
      # The port the Caddyfile proxies to: cyfr's proxy listener, with its
      # default.
      - CYFR_PROXY_PORT=${CYFR_PROXY_PORT:-4001}
      - CADDY_ACME_EMAIL=${CADDY_ACME_EMAIL:-}
    # The edge network alone, at the address cyfr trusts forwarded headers
    # from; caddy never joins the default network, so it never reaches the
    # loopback listener.
    networks:
      edge:
        ipv4_address: 172.16.234.3
    # No capability but binding ports 80 and 443, which the caddy binary
    # carries as a file capability and cannot exec without; no process
    # gains a privilege by executing a setuid or file-capability binary
    # beyond it.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
      - seccomp=./container.seccomp.json
    depends_on:
      cyfr:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # The running server's answer: caddy has no health endpoint, so this
      # asks its admin API, on the container's own loopback, for the config
      # it has loaded, which only a live caddy holding a config answers.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

  tailscale:
    profiles: ["tailnet"]
    # Pinned by digest, the tag kept for the reader. A passing real-tailnet
    # run (tests/tailnet-real/run.sh) records the reference it verified in
    # tests/tailnet-real/verified-image, and CI fails while no run has
    # verified this line's reference or the record names another, a new
    # digest under the same tag included.
    image: tailscale/tailscale:v1.104.1@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
    environment:
      # No TUN device and no capability: tailscaled's own netstack.
      - TS_USERSPACE=true
      # The machine's tailnet identity, kept in a volume of its own, which no
      # snapshot holds. `cyfr access tailnet` joins it once.
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_AUTH_ONCE=true
      - TS_ACCEPT_DNS=false
      - TS_SOCKS5_SERVER=:1055
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      # Serve's configuration, which `cyfr` alone writes: `{}`, serving
      # nothing, until it has checked that this machine is the one .env
      # names, and then the forward to cyfr's proxy listener.
      - TS_SERVE_CONFIG=/serve/serve.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      # A directory, so containerboot sees the file change; cyfr's own
      # mounts never reach it.
      - ./.cyfr/tailscale-serve:/serve:ro
    # The device's own browser reaches the home's address through this
    # sidecar, on the host's loopback only. The connection arrives through
    # Serve's proxy ingress and carries no loopback-ingress authority.
    # This is a general proxy on this machine's loopback for the device's
    # own browser; a program on this machine can reach through it whatever
    # the sidecar can reach.
    ports:
      - "127.0.0.1:1055:1055"
    # The edge network alone, at the address cyfr trusts forwarded headers
    # from.
    networks:
      edge:
        ipv4_address: 172.16.234.4
    # No capability: userspace networking needs no TUN device, and Serve
    # listens inside tailscaled's own network stack.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./container.seccomp.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  # cyfr's loopback listener and the host's published loopback port, and
  # nothing else: no other service joins it, by name or by naming no
  # network. Its subnet is fixed so cyfr can hold the fixed address its
  # loopback listener binds (CYFR_BIND_ADDRESS), outside the pools Docker
  # draws the other networks' subnets from by default, as the
  # locus network's is (below); a container on it would take an
  # address from its ip_range alone. Docker publishes 127.0.0.1:${CYFR_PORT:-4000} to that address
  # (tests/compose-proof/run.sh --case bind holds it to that). The network
  # is dual-stack, with the unique-local IPv6 subnet Docker assigns: Docker
  # maps a published port to the container's address on an IPv6-enabled
  # network ahead of an IPv4-only one, so a network cyfr joins that has
  # IPv6 on (an island network an operator enables it on, or every network
  # under a daemon that enables it by default) would otherwise take the
  # mapping from this one; with IPv6 on here, cyfr's gw_priority decides.
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.16.230.0/24
          ip_range: 172.16.230.128/25
  # cyfr's proxy listener and the two proxies that forward to it, caddy and
  # tailscale, each at a fixed address outside the ip_range, the addresses
  # cyfr trusts forwarded headers from. IPv4 alone, and no gw_priority, so
  # the default network keeps the published loopback port.
  edge:
    ipam:
      config:
        - subnet: 172.16.234.0/24
          ip_range: 172.16.234.128/25
  # cyfr <-> locus-guard only, whose namespace locus shares (see the locus
  # service): caddy and tailscale never see a role's port. The network is
  # not `internal` (see the locus service), so the isolation is who is
  # attached. Its subnet is fixed so cyfr can hold the fixed address its
  # host API binds, the address the guard lets the runtime reach. It lies
  # outside the pools Docker draws the other networks' subnets from by
  # default (172.17.0.0/16 to 172.31.0.0/16, and 192.168.0.0/16), and the
  # other containers on it take addresses from its ip_range alone.
  locus:
    ipam:
      config:
        - subnet: 172.16.231.0/24
          ip_range: 172.16.231.128/25

volumes:
  homes:
  # The machines' device: the image's programs as one read-only squashfs,
  # which the keeper makes from its own root the first time it starts a
  # person's machine under an image, named by the image's digest. A new
  # release makes its own and removes the old; it holds nothing of a
  # person's.
  guest:
  # The guard's control socket, which the guard alone writes; locus mounts
  # it read-only. Nothing in it outlives the guard: a guard that starts
  # removes a socket an earlier one left.
  guard-control:
  caddy_data:
  caddy_config:
  tailscale_state:
