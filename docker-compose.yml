services:
  cyfr:
    image: ghcr.io/cyfrworks/cyfr:latest
    ports:
      - "4000:4000"
      - "4001:4001"
    volumes:
      - cyfr_data:/app/data
      - cyfr_components:/app/components
    environment:
      - SECRET_KEY_BASE
      - PHX_HOST=localhost
      - CYFR_EDITION=core
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

volumes:
  cyfr_data:
  cyfr_components:
