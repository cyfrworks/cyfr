# CYFR self-hosted stack:
#   cyfr        — the one endpoint (:4000): Prism (chat + console), API, MCP,
#                 tinctures; its host API (:4300, the worker network only)
#                 takes the execution worker's host calls
#   mcp-bridge  — runs the stdio/npx MCP servers CYFR registers with
#                 transport `stdio`, one owner per server row, each backend
#                 under a uid of its own. Every request between cyfr and the
#                 bridge is signed under CYFR_MCP_BRIDGE_KEY; the bridge
#                 keeps no state.
#   opus        — the execution worker: runs WASM components as CYFR
#                 assigns them, on the internal `worker` network. Every
#                 request between cyfr and opus is signed under the worker
#                 key CYFR derives for OPUS_SERVICE_ID; opus holds no
#                 tenant state.
#   caddy       — TLS + reverse proxy in front of cyfr. Opt-in via the `tls`
#                 profile.                                   [profile: tls]
#
# `cyfr init` writes this file (and Caddyfile + .env) into a fresh project dir;
# from a source checkout, `cp .env.example .env` instead. Then:
#   docker compose up -d                        # direct mode: cyfr + mcp-bridge + opus
#   docker compose --profile tls up -d          # also start Caddy for TLS
# `cyfr init` writes CYFR_BEHIND_PROXY=true into .env when you answer "yes" to
# the TLS prompt, and `cyfr up` adds `--profile tls` automatically when that
# flag is set. See the "Deploy to a Server" section of README.md.

services:
  cyfr:
    container_name: cyfr
    image: ghcr.io/cyfrworks/cyfr:latest
    expose:
      - "${CYFR_PORT:-4000}"
      # The host API, reached by opus over the worker network; never
      # published.
      - "${CYFR_HOST_API_PORT:-4300}"
    ports:
      # Loopback-only: the Codex CLI and the browser talk to
      # http://127.0.0.1:${CYFR_PORT:-4000}; a hostname deploy fronts it
      # with Caddy.
      - "127.0.0.1:${CYFR_PORT:-4000}:${CYFR_PORT:-4000}"
    volumes:
      - ./data:/app/data
      - ./aqua:/app/seed/aqua
      # The seed bundle is baked into the image. To serve a custom bundle,
      # mount one over the image's copy:
      #   - ./my-bundle:/app/seed/components:ro
    env_file:
      - .env
    environment:
      - CYFR_HOST=${CYFR_HOST:-localhost}
      # In tls mode (Caddy in front, ACME TLS, X-Forwarded-* on) set this to
      # `true` in .env. `cyfr init`'s TLS prompt writes the right value.
      - CYFR_BEHIND_PROXY=${CYFR_BEHIND_PROXY:-false}
      # Extra reverse-proxy layers in front of Caddy need this raised to match
      # (see README "Production configuration").
      - CYFR_TRUSTED_PROXY_HOPS=${CYFR_TRUSTED_PROXY_HOPS:-1}
      # The private hosts outbound calls may reach; the bridge is one.
      - CYFR_PRIVATE_EGRESS_TARGETS=${CYFR_PRIVATE_EGRESS_TARGETS:-mcp-bridge}
      # Where cyfr reaches the mcp-bridge service. Stdio MCP servers need this
      # and CYFR_MCP_BRIDGE_KEY, which cyfr reads from .env (env_file above).
      - CYFR_MCP_BRIDGE_URL=${CYFR_MCP_BRIDGE_URL:-http://mcp-bridge:8001}
      # The execution worker cyfr dispatches runs to, and where it listens
      # for the worker's host calls: every interface, since the container is
      # reached over the worker network alone. CYFR_WORKER_KEY, the root
      # the worker's key derives from, comes from .env.
      - CYFR_WORKERS=${CYFR_WORKERS:-wrk_opus=http://opus:4200}
      - CYFR_HOST_API_BIND=0.0.0.0
      - CYFR_HOST_API_PORT=${CYFR_HOST_API_PORT:-4300}
    networks:
      - default
      - builder
      - worker
    restart: unless-stopped
    # The endpoints drain connections for up to 30s on shutdown; compose's
    # default 10s grace would SIGKILL mid-drain.
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
          # Caps aggregate damage from WASM components that never yield
          # (a killed tight-loop leaks a spinning native thread).
          cpus: "${CYFR_CPU_LIMIT:-4}"
    # Healthcheck: inherited from the image (Dockerfile HEALTHCHECK) so the
    # port and the probed path have one author.

  # Optional builder: `docker compose --profile builder up -d`, or `cyfr up`
  # once .env sets CYFR_BUILDER_URL=http://builder:4100 and CYFR_BUILDER_TOKEN.
  # Compose forwards the token; put builder-only overrides in .env.builder.
  builder:
    container_name: cyfr-builder
    # Pulled as published; a source checkout builds it with
    # `docker compose --profile builder build builder`.
    image: ghcr.io/cyfrworks/cyfr-builder:latest
    build:
      context: .
      dockerfile: Dockerfile.builder
    profiles: ["builder"]
    expose:
      - "4100"
    env_file:
      - path: .env.builder
        required: false
    environment:
      - CYFR_BUILDER_LISTEN=true
      - CYFR_BUILDER_TOKEN=${CYFR_BUILDER_TOKEN:-}
    # Only cyfr can reach the builder: it sits on its own network, which
    # cyfr also joins; the bridge and caddy never see port 4100. The
    # network is not `internal` — cargo and npm need crates.io and the
    # registry — so the isolation is who is attached, not egress. This is
    # the container's only network, so listening on every interface is
    # listening on it (CYFR_BUILDER_BIND is for a builder outside compose).
    networks:
      - builder
    # docker-init is PID 1 and forwards stop signals to cyfr-spawn, the
    # child subreaper of every build process.
    init: true
    # cyfr-spawn refuses to start with any capability other than these: it
    # starts the builder release and each build under their own uids and
    # signals their processes. The release and every build run with none.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    # No /data mount, read-only root: the builder holds no tenant state —
    # sources arrive in the request, artifacts leave in the response. The
    # tmpfs mounts below are the only writable surfaces, and cyfr-spawn
    # refuses to start if any other location is writable by a build's uid
    # (`ipc: none` leaves /dev/shm unmounted). Build homes: each build's
    # uid creates its own 0700 home holding its sources, Cargo home, npm
    # cache, temporary files and target directory; mode 1733 lets it create
    # one without listing the others, and build scripts and bundler
    # binaries run from there, so it allows exec. Its size bounds what all
    # concurrent builds write, and counts against the memory limit below.
    # /run/cyfr-builder holds the release's temporary files and the socket
    # builds' relays attach to.
    read_only: true
    ipc: none
    tmpfs:
      - /var/lib/cyfr-builder/homes:mode=1733,exec,size=2g
      - /run/cyfr-builder:uid=10001,gid=10001,mode=0700,size=16m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          # The one container that runs multi-minute cargo/npm compiles —
          # without a ceiling a runaway build starves the host. No build has
          # a memory bound of its own: this limit bounds every concurrent
          # build, their homes' tmpfs pages and the release together.
          memory: ${CYFR_BUILDER_MEMORY_LIMIT:-3G}
          cpus: "${CYFR_BUILDER_CPU_LIMIT:-2}"

  # The execution worker. cyfr reaches it at http://opus:4200 (CYFR_WORKERS)
  # and it reaches cyfr's host API at OPUS_HOST_URL; both sit on the worker
  # network, which nothing else joins.
  opus:
    container_name: cyfr-opus
    image: ghcr.io/cyfrworks/cyfr-opus:latest
    build:
      context: .
      dockerfile: Dockerfile.opus
    expose:
      - "4200"
    # Worker-only settings from .env.opus; OPUS_SERVICE_KEY comes from .env
    # below. The worker never sees the rest of .env: not the worker root,
    # not the keyring, not the database, and refuses to start with any of
    # them in its environment.
    env_file:
      - path: .env.opus
        required: false
    environment:
      - OPUS_SERVICE_ID=${OPUS_SERVICE_ID:-wrk_opus}
      - OPUS_SERVICE_KEY=${OPUS_SERVICE_KEY:-}
      - OPUS_HOST_URL=${OPUS_HOST_URL:-http://cyfr:${CYFR_HOST_API_PORT:-4300}}
      - OPUS_BIND=0.0.0.0
      - OPUS_PORT=4200
    networks:
      - worker
    # docker-init is PID 1 and forwards stop signals to cyfr-spawn, the
    # child subreaper of every runner process.
    init: true
    # cyfr-spawn refuses to start with any capability other than these: it
    # starts the opus release and each runner under their own uids and
    # signals their processes. The release and every runner run with none.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    # The engine holds no tenant state: read-only root, and the tmpfs
    # mounts below are the only writable surfaces; cyfr-spawn refuses to
    # start if any other location is writable by a runner's uid
    # (`ipc: none` leaves /dev/shm unmounted). Runner homes: each runner's
    # uid creates its own 0700 home, where its VM keeps the release's
    # temporary files; mode 1733 lets it create one without listing the
    # others, and the runner runs the release from there, so it allows
    # exec. Its size counts against the memory limit below. /run/opus holds
    # the service's temporary files and the socket runners' relays attach
    # to.
    read_only: true
    ipc: none
    tmpfs:
      - /var/lib/opus/homes:mode=1733,exec,size=256m
      - /run/opus:uid=10002,gid=10002,mode=0700,size=16m
    restart: unless-stopped
    # Running attempts close or are reported on shutdown; compose's default
    # 10s grace would SIGKILL mid-report.
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
          # Caps aggregate damage from WASM components that never yield
          # (a killed tight-loop leaks a spinning native thread).
          cpus: "${OPUS_CPU_LIMIT:-4}"

  mcp-bridge:
    # Built locally from Dockerfile.node (not a published image), so `docker
    # compose pull` won't fetch it — `up` builds it on first run.
    build:
      context: .
      dockerfile: Dockerfile.node
      target: mcp-bridge
    expose:
      - "8001"
    # docker-init is PID 1 and forwards stop signals to cyfr-spawn. cyfr-spawn
    # is the child subreaper of everything it starts, so an orphaned backend
    # process is reparented to it, not to docker-init, and retired with its uid.
    init: true
    # cyfr-spawn refuses to start with any capability other than these: it
    # starts the bridge and each backend under their own uids and signals
    # their processes. The bridge and every backend run with none.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    # The root is read-only and the tmpfs mounts below are the only writable
    # surfaces; cyfr-spawn refuses to start if any other location is
    # writable by a backend's uid, so a backend has no shared /tmp, /var/tmp,
    # /run or /dev/shm (`ipc: none` leaves /dev/shm unmounted) and writes
    # temporary files under its home. Backend homes: each backend's uid
    # creates its own 0700 home; mode 1733 lets it create one without
    # listing the others. Homes hold npx caches, so they allow exec.
    # /run/cyfr-bridge holds the bridge's private attach socket.
    read_only: true
    ipc: none
    tmpfs:
      - /var/lib/cyfr-bridge/homes:mode=1733,exec
      - /run/cyfr-bridge:uid=10001,gid=10001,mode=0700
    # Read bridge-only settings from .env.bridge; CYFR_MCP_BRIDGE_KEY comes
    # from .env below.
    env_file:
      - path: .env.bridge
        required: false
    environment:
      # The root every signing and sealing key between cyfr and the bridge is
      # derived from: 32 random bytes as 64 hexadecimal digits. `cyfr init`
      # generates it into .env, and cyfr reads the same value from there.
      # Without a valid key the bridge refuses to start (and restart-loops
      # here). The port is `expose`d, never published.
      - CYFR_MCP_BRIDGE_KEY=${CYFR_MCP_BRIDGE_KEY:-}
    restart: unless-stopped
    # Shutdown retires every backend (SIGTERM, 2s, then SIGKILL for all of
    # its processes) and drains in-flight requests; compose's default 10s is
    # tight when several backends are up.
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # node:24-alpine ships busybox wget, not curl. /health is unauthenticated
      # and carries no data (server.mjs).
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  caddy:
    profiles: ["tls"]
    # Minor-pinned like the other images; `2-alpine` floated across majors
    # of the one container that terminates TLS.
    image: caddy:2.11-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CYFR_HOST=${CYFR_HOST:-localhost}
      - CADDY_ACME_EMAIL=${CADDY_ACME_EMAIL:-}
    depends_on:
      cyfr:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Config-load liveness: caddy exposes no HTTP health endpoint by
      # default, so validate the loaded config instead.
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  default: {}
  # cyfr <-> builder only (see the builder service).
  builder: {}
  # cyfr <-> opus only: the bridge, the builder and caddy never see port
  # 4200. The network is not `internal` — a guest's consented HTTP egress
  # leaves from the worker — so the isolation is who is attached.
  worker: {}

volumes:
  caddy_data:
  caddy_config:
