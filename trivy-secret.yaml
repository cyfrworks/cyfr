# Repo-local secret rules for the enforced Trivy scan (security.yml,
# `scanners: secret`). The built-in rules missed a Google OAuth client secret
# that sat in .env.example for months; this names the shape so a planted one
# fails the job. `Cyfr.EnvExampleSecretsTest` is the same rule, run by the
# suite, so it holds without Trivy too.
rules:
  - id: google-oauth-client-secret
    category: Google
    title: Google OAuth client secret
    severity: CRITICAL
    regex: 'GOCSPX-[A-Za-z0-9_\-]{28}'
    keywords:
      - GOCSPX-
