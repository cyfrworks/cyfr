name: Docker
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io/cyfrworks
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Require tests on the tagged commit before publishing images.
  verify:
    if: github.repository == 'cyfrworks/cyfr'
    uses: ./.github/workflows/test.yml

  # The app image, and the builder image a `builder`-profile deploy pulls:
  # a project `cyfr init` writes carries no sources to build it from.
  build:
    needs: verify
    if: github.repository == 'cyfrworks/cyfr'
    strategy:
      matrix:
        image: [cyfr, cyfr-builder]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: cyfr
            file: Dockerfile
          - image: cyfr-builder
            file: Dockerfile.builder
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          platform="${{ matrix.platform }}"
          arch="${platform#linux/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.meta.outputs.arch }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.meta.outputs.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ steps.meta.outputs.arch }},mode=max

      # The builder image is scanned before it is pushed: a fixable HIGH or
      # CRITICAL finding fails the release. The findings .trivyignore.yaml
      # lists are npm's bundled dependencies, which the builder runs for
      # tincture builds as the bridge runs them for its backends.
      - name: Scan the builder image
        if: matrix.image == 'cyfr-builder'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.meta.outputs.arch }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

      - name: Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.meta.outputs.arch }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.meta.outputs.arch }}

  merge:
    if: github.repository == 'cyfrworks/cyfr'
    needs: build
    strategy:
      matrix:
        image: [cyfr, cyfr-builder]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ matrix.image }}:latest \
            --tag ${{ env.REGISTRY }}/${{ matrix.image }}:${{ steps.version.outputs.version }} \
            ${{ env.REGISTRY }}/${{ matrix.image }}:amd64 \
            ${{ env.REGISTRY }}/${{ matrix.image }}:arm64

      - name: Get manifest digest
        id: manifest
        run: |
          digest=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ matrix.image }}:latest --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
