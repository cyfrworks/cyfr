name: Keeper CI (cyfr-locus)

# Test cyfr-locus, the process helper the Locus image starts every
# runner, build and backend under. The image's own proofs — that its roles
# isolate their spawns from each other and from the service, refuse
# every request they cannot attribute, and leave no residue across a uid's
# reuse — run in test.yml beside the other image suites, which release.yml
# calls before it publishes.

on:
  push:
    branches: [main]
    paths:
      - 'apps/locus/keeper/**'
      # The keeper-protocol, pool, browser-framing and brain-wire vectors
      # the suite reproduces, and the residue canary, which the gofmt step
      # checks with them.
      - 'tests/fixtures/keeper_protocol.json'
      - 'tests/fixtures/locus_pool.json'
      - 'tests/fixtures/browser_frames.json'
      - 'tests/fixtures/brain_wire.json'
      - 'tests/fixtures/residue-canary.go'
      - '.github/workflows/keeper-ci.yml'
  pull_request:
    paths:
      - 'apps/locus/keeper/**'
      - 'tests/fixtures/keeper_protocol.json'
      - 'tests/fixtures/locus_pool.json'
      - 'tests/fixtures/browser_frames.json'
      - 'tests/fixtures/brain_wire.json'
      - 'tests/fixtures/residue-canary.go'
      - '.github/workflows/keeper-ci.yml'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: keeper-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  keeper:
    name: vet + test (cyfr-locus)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/locus/keeper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/locus/keeper/go.mod
          cache-dependency-path: apps/locus/keeper/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l . ../../../tests/fixtures)"

      - name: go vet
        run: go vet ./...

      # The image's maker of the machines' device and its lister, which the
      # vm package's bound mounts test runs for real, and bubblewrap, which
      # makes its binds where the runner's AppArmor gives a plain process's
      # user namespace no capability.
      - name: squashfs-tools and bubblewrap, which the machines' device's tests run
        run: |
          ../../../scripts/ci/retry.sh sudo apt-get update
          ../../../scripts/ci/retry.sh sudo apt-get install -y --no-install-recommends squashfs-tools bubblewrap

      # The total coverage goes to the job summary: it is reported, never a
      # floor, so only a failing test fails the step.
      - name: go test
        run: |
          go test ./... -race -coverprofile="$RUNNER_TEMP/cover.out"
          echo "apps/locus/keeper coverage: $(go tool cover -func "$RUNNER_TEMP/cover.out" | tail -1)" >> "$GITHUB_STEP_SUMMARY"

      # TestRunnerFilterInstalls holds the runner's filter against what the
      # kernel answers with no filter at all, so it skips under one, as in
      # the real-kernel step below, where seccomp/keeper.json already refuses
      # unshare and clone3. Here, as the runner's user, no filter covers the
      # tests: the control is the kernel's own, and the test must pass.
      - name: go test (the runner filter against an unfiltered control)
        run: |
          set -euo pipefail
          go test ./internal/stage/ -race -count=1 -v -run '^TestRunnerFilterInstalls$' 2>&1 | tee "$RUNNER_TEMP/runner-filter.log"
          grep -q -- '--- PASS: TestRunnerFilterInstalls ' "$RUNNER_TEMP/runner-filter.log" || { echo "::error::TestRunnerFilterInstalls did not run and pass against an unfiltered control"; exit 1; }

      # The device leaves out a bind of the root's own filesystem: the test
      # binds a folder and a file in a user and mount namespace of its own,
      # or through bubblewrap where the runner refuses one, and it must run
      # and pass here, never skip.
      - name: go test (the machines' device leaves out a bind of its own filesystem)
        run: |
          set -euo pipefail
          go test ./internal/vm/ -count=1 -v -run '^TestABindOfTheRootsOwnFilesystemStaysOutOfTheDevice$' 2>&1 | tee "$RUNNER_TEMP/device-binds.log"
          grep -q -- '--- PASS: TestABindOfTheRootsOwnFilesystemStaysOutOfTheDevice ' "$RUNNER_TEMP/device-binds.log" || { echo "::error::TestABindOfTheRootsOwnFilesystemStaysOutOfTheDevice did not run and pass"; exit 1; }
          if grep -q 'bubblewrap made the binds' "$RUNNER_TEMP/device-binds.log"; then how="through bubblewrap: the runner refused the test's own user namespace"; else how="in the test's own user and mount namespace"; fi
          echo "The device's bind test ran $how." >> "$GITHUB_STEP_SUMMARY"

      # Every space builds its files under the AppArmor profile cyfr-locus,
      # which the real-kernel tests' container runs under, as every Locus
      # container does.
      - name: Load the Locus containers' AppArmor profile
        run: ../../../scripts/ci/apparmor-profile.sh

      # The keeper's real-kernel tests start processes under pooled uids and
      # hold each spawn to a memory bound in a cgroup v2 group of its own, so
      # they need root and a cgroup namespace whose root is mounted writable:
      # what the shipped services get from `writable-cgroups=true` (Docker
      # Engine 28 or later on a cgroup v2 host). Each space mounts its own
      # files, so the container runs as the services do, under the keeper's
      # seccomp profile and this release's AppArmor profile, by the name
      # apps/codex/internal/apparmor/name holds, with its system
      # paths unmasked, and given /dev/net/tun, where a machine's route makes
      # its tap. As the runner's user above they skip; here they run
      # as root in a Go container started with those options, and a skip
      # for want of root or of a bound fails the step.
      - name: go test as root with writable-cgroups=true (the real kernel)
        run: |
          set -euo pipefail
          version="$(docker version --format '{{.Server.Version}}')"
          cgroup="$(docker info --format '{{.CgroupVersion}}')"
          if [ "${version%%.*}" -lt 28 ] || [ "$cgroup" != "2" ]; then
            echo "::error::Docker Engine $version on cgroup v$cgroup: writable-cgroups=true needs Docker Engine 28 or later on a cgroup v2 host"
            exit 1
          fi
          go_version="$(sed -n 's/^go //p' go.mod)"
          # The container first installs the tools the tests drive on the
          # real kernel: mke2fs, which makes a person's disk image, and
          # iptables, which holds a machine's route to its rules.
          docker run --rm --security-opt writable-cgroups=true --security-opt seccomp="$GITHUB_WORKSPACE/apps/locus/keeper/seccomp/keeper.json" \
            --security-opt "apparmor=$(cat "$GITHUB_WORKSPACE/apps/codex/internal/apparmor/name")" --security-opt systempaths=unconfined \
            --device /dev/net/tun \
            -v "$GITHUB_WORKSPACE:/src:ro" -w /src/apps/locus/keeper \
            -e GOFLAGS=-buildvcs=false -e DEBIAN_FRONTEND=noninteractive \
            "golang:$go_version" \
            sh -c '/src/scripts/ci/retry.sh apt-get update -qq && /src/scripts/ci/retry.sh apt-get install -y -qq --no-install-recommends e2fsprogs iptables >/dev/null && exec go test ./... -race -count=1 -v' \
            2>&1 | tee "$RUNNER_TEMP/keeper-kernel.log"
          if grep -E 'needs root|no memory bound can be enforced here' "$RUNNER_TEMP/keeper-kernel.log"; then
            echo "::error::a real-kernel test skipped for want of root or of a memory bound"
            exit 1
          fi
          for t in TestTheProbeProvesTheSpaceWhereTheHostAllowsIt TestARelaySpaceHasItsOwnNamespacesAndNoCapability TestARelaySpacesRelayIsCarriedOnceOpened TestARelaySpacesRelayIsSilentUnopened TestASpaceRunsInItsBoundedGroup TestTwoSessionsOfOneFolderSeeAndSignalOnlyTheirOwn TestASpacesProcessesEndWithItsCommand TestASignalReachesTheCommandInsideItsSpace TestNoThreadOfASpaceHoldsACapability TestTheProbeRefusesAHostThatCannotBuildASpacesFiles TestTheProfileDeniesWhatDockerMasks TestTheWaiterNeverSignalsAPidItReaped TestARoleRunsInItsOwnSpace TestARoleNamesOnlyItsOwn TestEachRolesGroupReadsItsLimits TestAPoolOfNoWorkStartsItsRolesAndRefusesEachSpawn TestARoleThatEndsStartsAgainAloneWhileTheOtherRunsOn TestARoleKilledStartsAgain TestTheGuardsLossUnderARoleEndsTheKeeper TestEachRolesRunFolderIsItsOwn TestAMachinesRouteJoinsItsTapToTheGuardsEnd TestAGuestsForgedSourcesCarryNothingOut TestAGuestsCardIsSetAsItsMachineRouteExpects TestADisksImageIsASparseExt4FileMadeOnce TestAFailedMakingLeavesNoImage TestAnImageDiskIsRecordedAndMadeWithNoFolder TestAPersonsMachineSpaceHasTheTunDeviceAtItsOwnPath TestAPersonsMachineSpaceHoldsNoIPv6; do grep -q -- "--- PASS: $t " "$RUNNER_TEMP/keeper-kernel.log" || { echo "::error::the isolation test $t did not run and pass"; exit 1; }; done

      - name: Static build
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/cyfr-locus" .
