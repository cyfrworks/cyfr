name: Node CI (mcp-bridge)

# Syntax-check and test the MCP bridge; report npm dependency advisories.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mcp-bridge/**'
      - 'Dockerfile.node'
      - '.github/workflows/node-ci.yml'
  pull_request:
    paths:
      - 'apps/mcp-bridge/**'
      - 'Dockerfile.node'
      - '.github/workflows/node-ci.yml'

permissions:
  contents: read

jobs:
  mcp-bridge:
    name: Check + smoke (mcp-bridge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-bridge
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mcp-bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.mjs

      # Test framing, request correlation and child lifecycle with a fake stdio server.
      - name: Unit tests
        run: npm test

      # Boot the bridge with a token and assert the two security-load-bearing
      # behaviours: /health answers open, and /mcp refuses a missing/wrong
      # bearer. Also assert the fail-closed boot: no token => exit 1.
      - name: Smoke test
        run: |
          set -euo pipefail
          # CYFR_CRYPTO_KEYRING stands in for the app secrets the bridge's
          # own environment must never forward to a child.
          export MCP_BRIDGE_TOKEN=ci-smoke-token MCP_BRIDGE_DATA="$RUNNER_TEMP/backends.json" \
            CYFR_CRYPTO_KEYRING=planted-keyring
          node server.mjs &
          BRIDGE_PID=$!
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8001/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8001/health
          body='{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8001/mcp \
            -H 'content-type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/list' \
            -d "$body")
          [ "$code" = "401" ] || { echo "expected 401 without bearer, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8001/mcp \
            -H 'content-type: application/json' -H 'authorization: Bearer ci-smoke-token' \
            -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/list' \
            -d "$body")
          [ "$code" = "200" ] || { echo "expected 200 with bearer, got $code"; exit 1; }
          # The bridge's own admin bearer must never reach a spawned child:
          # add a backend that echoes its environment and assert the token
          # is absent from what the child saw.
          add_body='{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"add_backend","arguments":{"name":"envprobe","command":"env > \"$RUNNER_TEMP/child-env.txt\"; sleep 2"},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
          curl -s -o /dev/null -X POST http://127.0.0.1:8001/mcp \
            -H 'content-type: application/json' -H 'authorization: Bearer ci-smoke-token' \
            -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/call' \
            -H 'Mcp-Name: add_backend' \
            -d "$add_body" || true
          sleep 1
          if [ -f "$RUNNER_TEMP/child-env.txt" ] && grep -q "ci-smoke-token" "$RUNNER_TEMP/child-env.txt"; then
            echo "MCP_BRIDGE_TOKEN leaked into a child environment"
            exit 1
          fi
          if [ -f "$RUNNER_TEMP/child-env.txt" ] && grep -q "planted-keyring" "$RUNNER_TEMP/child-env.txt"; then
            echo "the bridge's own environment leaked into a child environment"
            exit 1
          fi
          kill "$BRIDGE_PID"
          if MCP_BRIDGE_TOKEN= MCP_BRIDGE_DATA="$RUNNER_TEMP/backends2.json" node server.mjs; then
            echo "bridge booted without a token — fail-closed boot is broken"
            exit 1
          fi

      - name: Audit dependencies (report-only)
        continue-on-error: true
        run: npm audit --audit-level=high

  # Build and scan the MCP bridge image shipped by Compose.
  image:
    name: Build + scan image (mcp-bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build the image compose would build
        run: docker build -f Dockerfile.node --target mcp-bridge -t cyfr-mcp-bridge:ci .

      - name: Boot smoke as non-root
        run: |
          set -euo pipefail
          docker run -d --name bridge-ci -e MCP_BRIDGE_TOKEN=ci -p 127.0.0.1:8001:8001 cyfr-mcp-bridge:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8001/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8001/health
          # The privilege drop is load-bearing: the bridge spawns shell
          # commands by design and must not do so as root.
          #
          # Assert the uid of the server process itself. `docker exec ... id -u`
          # answers for a NEW process, which starts as the image's default user
          # — root, because the entrypoint takes ownership of the /data bind
          # mount before dropping to node, so the image declares no USER. And
          # PID 1 is the server only under a plain `docker run`: compose puts
          # docker-init there (`init: true`).
          uid=$(docker exec bridge-ci sh -c 'for d in /proc/[0-9]*; do [ "$d" = "/proc/$$" ] && continue; { tr "\0" " " < "$d/cmdline" | grep -q server.mjs; } 2>/dev/null || continue; grep -m1 "^Uid:" "$d/status" | cut -f2; exit 0; done; exit 1' || true)
          [ -n "$uid" ] || { echo "no server.mjs process in the bridge container"; exit 1; }
          [ "$uid" != "0" ] || { echo "the bridge server is running as root"; exit 1; }
          echo "bridge server runs as uid $uid"
          docker rm -f bridge-ci

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cyfr-mcp-bridge:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Findings with no fix in any distribution, each with its reason
          # and what would lift it. Everything else fixable still fails.
          trivyignores: .trivyignore.bridge
