name: Node CI (mcp-bridge)

# Test the MCP bridge and its process helper (cyfr-spawn), and report npm
# dependency advisories. The image's own proofs — that it isolates backends
# from each other and from the bridge, refuses every request it cannot
# attribute, and leaves no residue across a uid's reuse — are a D15 row, so
# they run in test.yml beside the worker and builder image suites, which the
# tag's `verify` calls; here they gated nothing at the tag.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mcp-bridge/**'
      - 'apps/spawn/**'
      # The authentication and spawner-protocol vectors the suites reproduce.
      - 'tests/fixtures/bridge_auth.json'
      - 'tests/fixtures/spawn_protocol.json'
      - 'tests/fixtures/residue-canary.go'
      # The image suites' sources, which the syntax check below reads.
      - 'tests/bridge-image/**'
      - '.github/workflows/node-ci.yml'
  pull_request:
    paths:
      - 'apps/mcp-bridge/**'
      - 'apps/spawn/**'
      - 'tests/fixtures/bridge_auth.json'
      - 'tests/fixtures/spawn_protocol.json'
      - 'tests/fixtures/residue-canary.go'
      - 'tests/bridge-image/**'
      - '.github/workflows/node-ci.yml'

permissions:
  contents: read

jobs:
  mcp-bridge:
    name: Check + test (mcp-bridge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-bridge
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mcp-bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          for module in server.mjs owners.mjs auth.mjs spawn-client.mjs ../../tests/bridge-image/*.mjs; do
            node --check "$module"
          done

      # The signed control and MCP protocol (authentication, ordering,
      # versions, leases, nonces, capacity), masking, stdio framing and the
      # backend lifecycle (spawn, crash, restart, failure, release) through
      # an in-process fake spawner; the authentication and spawner client
      # against the shared vectors.
      - name: Unit tests
        run: npm test

      # The bridge starts backends only through cyfr-spawn, which hands it
      # its channel as fd 3; started any other way it must refuse to run.
      - name: Refuses to start without the spawner
        run: |
          set -euo pipefail
          key="$(openssl rand -hex 32)"
          if CYFR_MCP_BRIDGE_KEY="$key" node server.mjs 3<&- 2>"$RUNNER_TEMP/refusal.txt"; then
            echo "the bridge started without its spawner channel"
            exit 1
          fi
          grep -q "fd 3 is not the spawner channel" "$RUNNER_TEMP/refusal.txt"

      - name: Audit dependencies (report-only)
        continue-on-error: true
        run: npm audit --audit-level=high

  spawn:
    name: vet + test (cyfr-spawn)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/spawn
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/spawn/go.mod
          cache-dependency-path: apps/spawn/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l . ../../tests/fixtures)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race

      # The keeper's real-kernel tests start processes under pooled uids and
      # hold each spawn to a memory bound in a cgroup v2 group of its own, so
      # they need root and a cgroup namespace whose root is mounted writable:
      # what the shipped services get from `writable-cgroups=true` (Docker
      # Engine 28 or later on a cgroup v2 host). As the runner's user above
      # they skip; here they run as root in a Go container started with the
      # option, and a skip for want of root or of a bound fails the step.
      - name: go test as root with writable-cgroups=true (the real kernel)
        run: |
          set -euo pipefail
          version="$(docker version --format '{{.Server.Version}}')"
          cgroup="$(docker info --format '{{.CgroupVersion}}')"
          if [ "${version%%.*}" -lt 28 ] || [ "$cgroup" != "2" ]; then
            echo "::error::Docker Engine $version on cgroup v$cgroup: writable-cgroups=true needs Docker Engine 28 or later on a cgroup v2 host"
            exit 1
          fi
          go_version="$(sed -n 's/^go //p' go.mod)"
          docker run --rm --security-opt writable-cgroups=true \
            -v "$GITHUB_WORKSPACE:/src:ro" -w /src/apps/spawn \
            -e GOFLAGS=-buildvcs=false \
            "golang:$go_version" \
            go test ./... -race -count=1 -v 2>&1 | tee "$RUNNER_TEMP/spawn-kernel.log"
          if grep -E 'needs root|no memory bound can be enforced here' "$RUNNER_TEMP/spawn-kernel.log"; then
            echo "::error::a real-kernel test skipped for want of root or of a memory bound"
            exit 1
          fi

      - name: Static build
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/cyfr-spawn" .
