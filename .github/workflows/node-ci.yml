name: Node CI (mcp-bridge)

# Test the MCP bridge and its process helper (cyfr-spawn), prove the image
# isolates backends from each other and from the bridge and refuses every
# request it cannot attribute, and report npm dependency advisories.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mcp-bridge/**'
      - 'apps/spawn/**'
      # The authentication and spawner-protocol vectors the suites reproduce.
      - 'tests/fixtures/bridge_auth.json'
      - 'tests/fixtures/spawn_protocol.json'
      - 'tests/bridge-image/**'
      - 'Dockerfile.node'
      # The isolation test runs the image with the mcp-bridge service's settings.
      - 'docker-compose.yml'
      - '.github/workflows/node-ci.yml'
  pull_request:
    paths:
      - 'apps/mcp-bridge/**'
      - 'apps/spawn/**'
      - 'tests/fixtures/bridge_auth.json'
      - 'tests/fixtures/spawn_protocol.json'
      - 'tests/bridge-image/**'
      - 'Dockerfile.node'
      - 'docker-compose.yml'
      - '.github/workflows/node-ci.yml'

permissions:
  contents: read

jobs:
  mcp-bridge:
    name: Check + test (mcp-bridge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-bridge
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mcp-bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          for module in server.mjs owners.mjs auth.mjs spawn-client.mjs ../../tests/bridge-image/*.mjs; do
            node --check "$module"
          done

      # The signed control and MCP protocol (authentication, ordering,
      # versions, leases, nonces, capacity), masking, stdio framing and the
      # backend lifecycle (spawn, crash, restart, failure, release) through
      # an in-process fake spawner; the authentication and spawner client
      # against the shared vectors.
      - name: Unit tests
        run: npm test

      # The bridge starts backends only through cyfr-spawn, which hands it
      # its channel as fd 3; started any other way it must refuse to run.
      - name: Refuses to start without the spawner
        run: |
          set -euo pipefail
          key="$(openssl rand -hex 32)"
          if CYFR_MCP_BRIDGE_KEY="$key" node server.mjs 3<&- 2>"$RUNNER_TEMP/refusal.txt"; then
            echo "the bridge started without its spawner channel"
            exit 1
          fi
          grep -q "fd 3 is not the spawner channel" "$RUNNER_TEMP/refusal.txt"

      - name: Audit dependencies (report-only)
        continue-on-error: true
        run: npm audit --audit-level=high

  spawn:
    name: vet + test (cyfr-spawn)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/spawn
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/spawn/go.mod
          cache-dependency-path: apps/spawn/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race

      - name: Static build
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/cyfr-spawn" .

  # Build the MCP bridge image shipped by Compose, run it as Compose does to
  # prove backend isolation and its refusals, and scan it.
  image:
    name: Build, isolate + scan image (mcp-bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Build the image compose would build
        run: docker build -f Dockerfile.node --target mcp-bridge -t cyfr-mcp-bridge:ci .

      # Two owners' probe backends under the mcp-bridge service's own
      # settings, driven by requests signed as CYFR signs them
      # (tests/bridge-image/controller.mjs): each runs under its own pooled
      # uid (never 0 or the bridge's), neither can read the other's home or
      # /proc environ or signal it, the spawner holds exactly
      # SETUID|SETGID|KILL (CapEff 0xe0) and no inet socket, the bridge holds
      # no capability, the root is read-only, and releasing an owner leaves no
      # process of its uid, a setsid daemon ignoring SIGTERM included, and no
      # home. Also: the refused boot without a valid key, the spawner's
      # refusal of Docker's default capabilities, and retirement on loss and
      # on stop.
      - name: Backend isolation
        env:
          BRIDGE_IMAGE: cyfr-mcp-bridge:ci
        run: node --test tests/bridge-image/isolation.test.mjs

      # A forged MAC, a timestamp outside the window, a control message below
      # the high-water mark, a stale or future epoch, a replayed nonce and a
      # captured invoke sent again after `docker restart` are refused, and a
      # sync the uid pool cannot hold spawns nothing.
      - name: Refusals
        env:
          BRIDGE_IMAGE: cyfr-mcp-bridge:ci
        run: node --test tests/bridge-image/refusals.test.mjs

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cyfr-mcp-bridge:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Findings with no fix in any distribution, each scoped to the
          # path it was observed at, with its reason and what would lift it.
          # Everything else fixable still fails, including the same id in
          # the bridge's own dependency tree.
          trivyignores: .trivyignore.yaml
