name: Node CI (mcp-bridge)

# Test the MCP bridge and its process helper (cyfr-spawn), prove the image
# isolates backends from each other and from the bridge, and report npm
# dependency advisories.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mcp-bridge/**'
      - 'apps/spawn/**'
      # The authentication and spawner-protocol vectors the suites reproduce.
      - 'tests/fixtures/bridge_auth.json'
      - 'tests/fixtures/spawn_protocol.json'
      - 'tests/bridge-image/**'
      - 'Dockerfile.node'
      # The isolation test runs the image with the mcp-bridge service's settings.
      - 'docker-compose.yml'
      - '.github/workflows/node-ci.yml'
  pull_request:
    paths:
      - 'apps/mcp-bridge/**'
      - 'apps/spawn/**'
      - 'tests/fixtures/bridge_auth.json'
      - 'tests/fixtures/spawn_protocol.json'
      - 'tests/bridge-image/**'
      - 'Dockerfile.node'
      - 'docker-compose.yml'
      - '.github/workflows/node-ci.yml'

permissions:
  contents: read

jobs:
  mcp-bridge:
    name: Check + test (mcp-bridge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-bridge
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mcp-bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          node --check server.mjs
          node --check spawn-client.mjs

      # Framing, request correlation, auth, persistence and the backend
      # lifecycle (spawn, exit, restart, release) through an in-process fake
      # spawner; the spawner client against the shared protocol vectors.
      - name: Unit tests
        run: npm test

      # The bridge starts backends only through cyfr-spawn, which hands it
      # its channel as fd 3; started any other way it must refuse to run.
      - name: Refuses to start without the spawner
        run: |
          set -euo pipefail
          if MCP_BRIDGE_TOKEN=ci node server.mjs 3<&- 2>"$RUNNER_TEMP/refusal.txt"; then
            echo "the bridge started without its spawner channel"
            exit 1
          fi
          grep -q "fd 3 is not the spawner channel" "$RUNNER_TEMP/refusal.txt"

      - name: Audit dependencies (report-only)
        continue-on-error: true
        run: npm audit --audit-level=high

  spawn:
    name: vet + test (cyfr-spawn)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/spawn
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/spawn/go.mod
          cache-dependency-path: apps/spawn/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race

      - name: Static build
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/cyfr-spawn" .

  # Build the MCP bridge image shipped by Compose, run it as Compose does to
  # prove backend isolation, and scan it.
  image:
    name: Build, isolate + scan image (mcp-bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Build the image compose would build
        run: docker build -f Dockerfile.node --target mcp-bridge -t cyfr-mcp-bridge:ci .

      # Two probe backends under the mcp-bridge service's own settings: each
      # runs under its own pooled uid (never 0 or the bridge's), neither can
      # read the other's home or /proc environ or signal it, the spawner holds
      # exactly SETUID|SETGID|KILL (CapEff 0xe0) and no inet socket, the
      # bridge holds no capability, and removing a backend leaves no process
      # of its uid, a setsid daemon ignoring SIGTERM included, and no home.
      # Also: the fail-closed boot without a token, the spawner's refusal of
      # Docker's default capabilities, and retirement on loss and on stop.
      - name: Backend isolation
        env:
          BRIDGE_IMAGE: cyfr-mcp-bridge:ci
        run: node --test tests/bridge-image/isolation.test.mjs

      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cyfr-mcp-bridge:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Findings with no fix in any distribution, each scoped to the
          # path it was observed at, with its reason and what would lift it.
          # Everything else fixable still fails, including the same id in
          # the bridge's own dependency tree.
          trivyignores: .trivyignore.yaml
