name: Mac distribution

# The CYFR app's Mac package as a person downloads it, built with the
# repository's Apple inputs: signed with the Developer ID identity, the
# provisioning profile that authorises its WebAuthn group embedded,
# notarised under the team's account and stapled, then checked
# (apps/codex/desktop/scripts/mac-sign.mjs), installed on the runner and
# smoked (tests/desktop-proof/native/smoke.sh), so a profile that does not
# authorise the app's entitlements is seen at its launch. It runs when
# dispatched by hand or called by another workflow, never on a push; it
# publishes nothing, and keeps the DMG for a day only when a dispatch asks.
# A pull request's run rehearses the same signing with no Apple input
# (codex-ci.yml's desktop-native).

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Keep the signed DMG as this run's artifact for one day
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: The package's version
        type: string
        required: true
    secrets:
      APPLE_CERTIFICATE: {required: true}
      APPLE_CERTIFICATE_PASSWORD: {required: true}
      APPLE_SIGNING_IDENTITY: {required: true}
      APPLE_TEAM_ID: {required: true}
      APPLE_API_KEY: {required: true}
      APPLE_API_KEY_ID: {required: true}
      APPLE_API_ISSUER: {required: true}
      APPLE_PROVISIONING_PROFILE: {required: true}

permissions:
  contents: read

jobs:
  mac:
    name: CYFR app (macOS arm64, signed)
    runs-on: macos-latest
    # Electron's download, the build and Apple's notary, which answers in
    # minutes and sometimes in more: the build bounds the app's packing,
    # signing and notarising at 50 minutes and the DMG's notarising at 27,
    # each ending with a sentence.
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/codex/desktop/package-lock.json

      - name: Build cyfr for this runner
        working-directory: apps/codex
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/cyfr/cyfr" .

      - name: The app's build tools
        working-directory: apps/codex/desktop
        run: npm ci --ignore-scripts --no-audit --no-fund

      # The Apple inputs reach this step alone.
      - name: Build, sign, notarise and check the package
        working-directory: apps/codex/desktop
        env:
          VERSION: ${{ inputs.version || '0.0.0-candidate' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          node scripts/build.mjs --cyfr "$RUNNER_TEMP/cyfr/cyfr" --version "$VERSION" --arch arm64 --distribution
          echo "DMG=apps/codex/desktop/dist/cyfr-desktop_${VERSION}_darwin_arm64.dmg" >> "$GITHUB_ENV"

      - name: Install the app
        run: |
          set -euo pipefail
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/cyfr-dmg" "$DMG"
          cp -R "$RUNNER_TEMP/cyfr-dmg/CYFR.app" /Applications/
          hdiutil detach "$RUNNER_TEMP/cyfr-dmg"

      - name: Smoke the installed app
        run: bash tests/desktop-proof/native/smoke.sh /Applications/CYFR.app/Contents/MacOS/CYFR

      # inputs.upload is a dispatch's alone: a call never uploads.
      - name: Keep the DMG for a day
        if: inputs.upload == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cyfr-desktop-darwin-arm64
          path: ${{ env.DMG }}
          retention-days: 1
          if-no-files-found: error
