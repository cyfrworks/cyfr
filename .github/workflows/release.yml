# Copyright 2026 CYFR Works Inc.

# The one workflow a release tag starts. It verifies the tagged commit once,
# with every check a change to main runs, and publishes nothing unless all
# six pass: the CLI release and its provenance, the CYFR app's six
# installers beside it (a DEB for Linux, a signed and notarised DMG for
# macOS and an MSI for Windows, each for amd64 and arm64, each built,
# installed and smoked on a runner of its own system and architecture),
# the Homebrew cask written from the DMGs, and the cyfr and cyfr-locus
# images. The installers job checks the six and the cask together, and
# every job that publishes needs it: the images' tags, the release and
# the tap move only after it.
name: Release
# A release tag is MAJOR.MINOR.PATCH, or the same with a SemVer
# pre-release (0.6.0-alpha.1). GitHub's filter patterns admit more than
# that; the version job is the exact check. A pre-release publishes as a
# GitHub pre-release (.goreleaser.yml), leaves the images' :latest where
# it was (scripts/ci/merge-image.sh) and the Homebrew tap on the release it
# names.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

# A second run of one tag waits for the first instead of cancelling it, so
# a publication is never cut off between its pushes and its manifest.
# GitHub keeps one pending run per group: a pending run is cancelled when a
# newer one queues behind it.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/cyfrworks

jobs:
  # The verification: each called workflow bounds its own jobs.
  test:
    if: github.repository == 'cyfrworks/cyfr'
    uses: ./.github/workflows/test.yml

  dialyzer:
    if: github.repository == 'cyfrworks/cyfr'
    uses: ./.github/workflows/dialyzer.yml

  codex-ci:
    if: github.repository == 'cyfrworks/cyfr'
    uses: ./.github/workflows/codex-ci.yml

  keeper-ci:
    if: github.repository == 'cyfrworks/cyfr'
    uses: ./.github/workflows/keeper-ci.yml

  license-lint:
    if: github.repository == 'cyfrworks/cyfr'
    uses: ./.github/workflows/license-lint.yml

  security:
    if: github.repository == 'cyfrworks/cyfr'
    uses: ./.github/workflows/security.yml

  # The tag names the release the tree declares: Prima.Version.current/0
  # reads apps/prima/mix.exs, and every mix.exs moves with it
  # (Cyfr.VersionDriftTest). The declared version is a release version by
  # the one rule tests/fixtures/release_manifest.json's versions hold, and
  # the tag is exactly it, pre-release included. The image build and the
  # CLI release need this job, so a tag that names another version builds
  # and publishes nothing. It publishes nothing itself and runs beside the
  # six checks.
  version:
    if: github.repository == 'cyfrworks/cyfr'
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag is the version mix.exs declares
        run: |
          set -euo pipefail
          # Byte by byte: under another locale [A-Za-z] can admit letters
          # outside ASCII.
          export LC_ALL=C
          release='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          declared=()
          while IFS= read -r line; do
            if [[ "$line" =~ ^[[:space:]]*version:[[:space:]]*\"([^\"]*)\" ]]; then
              declared+=("${BASH_REMATCH[1]}")
            fi
          done < apps/prima/mix.exs
          if [ "${#declared[@]}" -ne 1 ] || ! [[ "${declared[0]}" =~ $release ]]; then
            echo "::error::apps/prima/mix.exs declares ${#declared[@]} versions [${declared[*]}], not one release version (MAJOR.MINOR.PATCH, or with a pre-release)"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "${declared[0]}" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not the version ${declared[0]} that apps/prima/mix.exs declares"
            exit 1
          fi
          echo "The tag $GITHUB_REF_NAME is the version apps/prima/mix.exs declares."

      # The release's written note, which GoReleaser publishes as its notes:
      # a tag that carries none publishes nothing.
      - name: The tag carries its release note
        run: scripts/ci/release-note.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" "$RUNNER_TEMP/release-note.md"

  # The app image and the Locus image, which serves the runtime, the builds
  # and the backends service: every deploy pulls both, and a project
  # `cyfr init` writes carries no sources to build them from.
  #
  # One build per image and platform. It loads the image for the scan and
  # the boot and pushes the same result by digest alone: no tag names it,
  # so a digest whose scan or boot fails stays where no version or `latest`
  # reaches it, and a concurrent run cannot move what this run merges.
  images:
    needs: [version, test, dialyzer, codex-ci, keeper-ci, license-lint, security]
    if: github.repository == 'cyfrworks/cyfr'
    # The slowest of these jobs, cyfr-locus on amd64, runs about ten minutes
    # (cyfr about three): the bound is three times that.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [cyfr, cyfr-locus]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: cyfr
            file: Dockerfile
          - image: cyfr-locus
            file: Dockerfile.locus
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every Locus container runs under the AppArmor profile cyfr-locus,
      # which a host loads at install (cyfr init) and this runner here.
      - name: Load the Locus containers' AppArmor profile
        run: scripts/ci/apparmor-profile.sh

      # The loaded image carries its attestation, which the runner's classic
      # image store cannot hold. The switch restarts the daemon, so it comes
      # before buildx creates its builder.
      - name: Use the containerd image store
        run: sudo scripts/ci/containerd-image-store.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # APT_REFRESH is the archive's key (scripts/apt-key.sh), as every
      # image build's is: each image's upgrade layer is built on what
      # Debian's archive holds, and the layer's guard holds apt's lists to
      # it. An archive that cannot be read fails this step.
      - name: Extract metadata
        id: meta
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "arch=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
          apt_key=$(scripts/apt-key.sh)
          echo "apt-refresh=$apt_key" >> "$GITHUB_OUTPUT"

      # No layer cache, read or written: a published image is built from its
      # sources alone.
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          build-args: APT_REFRESH=${{ steps.meta.outputs.apt-refresh }}
          # The action drops its max-mode default when an output loads the
          # image; the published attestation keeps the build's config,
          # builder id and sources.
          provenance: mode=max
          outputs: |
            type=docker,name=cyfr-scan/${{ matrix.image }}:${{ steps.meta.outputs.arch }}
            type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      # A fixable HIGH or CRITICAL finding fails the release. The findings
      # .trivyignore.yaml lists are npm's bundled dependencies, which the
      # Locus image runs for tincture builds and for the stdio backends it
      # serves. The scan reads the loaded image alone: a name missing from
      # the daemon fails instead of being fetched from a registry.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.75.0
          image-ref: cyfr-scan/${{ matrix.image }}:${{ steps.meta.outputs.arch }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

      - name: The scanned image is the pushed one
        env:
          SCANNED: cyfr-scan/${{ matrix.image }}:${{ steps.meta.outputs.arch }}
          PUSHED: ${{ env.REGISTRY }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ steps.meta.outputs.arch }}
        run: |
          scripts/ci/scanned-is-pushed.sh "$SCANNED" "$PUSHED" "$DIGEST"
          mkdir -p digest
          echo "$DIGEST" > "digest/$ARCH"

      # On the platform's own runner, so the arm64 image is started on
      # arm64: a digest whose image does not start and answer its health
      # probe is never uploaded, so no merge reaches it.
      - name: The image boots
        env:
          IMAGE: ${{ matrix.image }}
          LOADED: cyfr-scan/${{ matrix.image }}:${{ steps.meta.outputs.arch }}
        run: scripts/ci/image-boots.sh "$IMAGE" "$LOADED"

      # Aqua's browser on arm64: the image's Chromium headless shell is built
      # for arm64 and starts with no public host, a person's tools never run
      # in CYFR's place, and a public page loads in the browser at its first
      # start. The pull request's image suite proves the rest on amd64.
      - name: Aqua's browser is in the image and loads a page
        if: matrix.image == 'cyfr-locus' && matrix.platform == 'linux/arm64'
        env:
          LOADED: cyfr-scan/${{ matrix.image }}:${{ steps.meta.outputs.arch }}
        run: python3 tests/locus-backends-image/browser.py --first-start "$LOADED"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ steps.meta.outputs.arch }}
          path: digest/${{ steps.meta.outputs.arch }}
          if-no-files-found: error
          retention-days: 1

  # The CYFR app's Linux package, built on each architecture's own runner
  # around a cyfr that GoReleaser builds as it builds the archives' (the
  # same ldflags and binary check), installed there as a person installs
  # it, smoked and read as built for its architecture. The installers'
  # check needs it, and the merge and the CLI release need that check, so
  # no version and no :latest moves without both packages. No cache, read or
  # written: a published package is built from its sources and their pins.
  linux-package:
    needs: [version, test, dialyzer, codex-ci, keeper-ci, license-lint, security]
    if: github.repository == 'cyfrworks/cyfr'
    # Codex CI's job for the same package is bounded at 30.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    env:
      ARCH: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    steps:
      # GoReleaser reads the version from the tag, which needs the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/codex/go.mod
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # GoReleaser copies the binary only into a folder that exists.
      - name: Make the folder cyfr is built into
        run: mkdir -p "$RUNNER_TEMP/cyfr"

      - name: Build cyfr as the release builds it
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: 'v2.18.3'
          args: build --single-target --clean --output ${{ runner.temp }}/cyfr/cyfr
          workdir: apps/codex

      # The package guard (scripts/check-package.mjs) runs inside the build.
      - name: Build the package
        run: |
          set -euo pipefail
          cd apps/codex/desktop
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/build.mjs --cyfr "$RUNNER_TEMP/cyfr/cyfr" --version "$GITHUB_REF_NAME" --arch "$ARCH" --out "$RUNNER_TEMP/package"

      - name: Install and smoke the package
        run: bash tests/desktop-proof/native/linux.sh "$RUNNER_TEMP/package/cyfr-desktop_${GITHUB_REF_NAME}_linux_${ARCH}.deb"

      - name: The installed cyfr is the tag's
        run: bash tests/desktop-proof/native/installed-version.sh /usr/bin/cyfr "$GITHUB_REF_NAME"

      # Read from each file's header: an amd64 app passes a smoke on arm64
      # under emulation.
      - name: The installed app is built for its architecture
        run: bash tests/desktop-proof/native/installed-machine.sh "$ARCH" /opt/cyfr/CYFR /usr/bin/cyfr

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyfr-desktop-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/package/cyfr-desktop_${{ github.ref_name }}_linux_${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 1

  # The CYFR app's Mac packages, Apple silicon's and Intel's, signed,
  # notarised, stapled, checked, installed and smoked on each
  # architecture's runner, with the installed cyfr the tag's
  # (desktop-mac.yml). The repository's Apple inputs reach this job alone,
  # each by its name, and in it the one step that signs.
  mac-package:
    needs: [version, test, dialyzer, codex-ci, keeper-ci, license-lint, security]
    if: github.repository == 'cyfrworks/cyfr'
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-mac.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}

  # cyfr for the Windows packages, built by GoReleaser as the release
  # builds the archives', on Linux: GoReleaser runs each build's post hook,
  # the bash binary check, which Windows cannot start ("not a valid Win32
  # application", measured on windows-11-arm), and the check reads a
  # binary of any target without running it.
  windows-cyfr:
    needs: [version, test, dialyzer, codex-ci, keeper-ci, license-lint, security]
    if: github.repository == 'cyfrworks/cyfr'
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        arch: [amd64, arm64]
    env:
      GOOS: windows
      GOARCH: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    steps:
      # GoReleaser reads the version from the tag, which needs the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/codex/go.mod
          cache: false

      # GoReleaser copies the binary only into a folder that exists.
      - name: Make the folder cyfr is built into
        run: mkdir -p "$RUNNER_TEMP/cyfr"

      # --single-target builds for GOOS and GOARCH.
      - name: Build cyfr as the release builds it
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: 'v2.18.3'
          args: build --single-target --clean --output ${{ runner.temp }}/cyfr/cyfr.exe
          workdir: apps/codex

      - name: Upload cyfr
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyfr-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/cyfr/cyfr.exe
          if-no-files-found: error
          retention-days: 1

  # The CYFR app's Windows package, an MSI for the person alone, unsigned
  # until there is a Windows identity (build.mjs names where it would sign),
  # built on each architecture's own runner around that cyfr, installed
  # there as a person installs it with its cyfr on PATH, smoked, the
  # installed cyfr the tag's, removed with its cyfr off PATH again
  # (tests/desktop-proof/native/windows.ps1), and uploaded. No cache, read
  # or written.
  windows-package:
    needs: [windows-cyfr, version, test, dialyzer, codex-ci, keeper-ci, license-lint, security]
    if: github.repository == 'cyfrworks/cyfr'
    # Codex CI's job for the same package is bounded at 30.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: windows-latest}
          - {arch: arm64, runner: windows-11-arm}
    env:
      ARCH: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # The smoke runs under Git Bash, which reads a script with rewritten
      # line ends as other commands.
      - name: Keep line ends as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download cyfr
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cyfr-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/cyfr

      # The package guard (scripts/check-package.mjs) runs inside the build.
      - name: Build the package
        run: |
          set -euo pipefail
          cd apps/codex/desktop
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/build.mjs --cyfr "$RUNNER_TEMP/cyfr/cyfr.exe" --version "$GITHUB_REF_NAME" --arch "$ARCH" --out "$RUNNER_TEMP/package"

      - name: Install the package
        shell: pwsh
        run: pwsh -NoProfile -File tests/desktop-proof/native/windows.ps1 install "$env:RUNNER_TEMP/package/cyfr-desktop_$($env:GITHUB_REF_NAME)_windows_$($env:ARCH).msi"

      - name: Smoke the installed app
        run: bash tests/desktop-proof/native/smoke.sh "$APP"

      - name: The installed cyfr is the tag's
        run: bash tests/desktop-proof/native/installed-version.sh "$CYFR" "$GITHUB_REF_NAME"

      - name: The installed app is built for its architecture
        run: bash tests/desktop-proof/native/installed-machine.sh "$ARCH" "$APP" "$CYFR"

      - name: Remove the package
        shell: pwsh
        run: pwsh -NoProfile -File tests/desktop-proof/native/windows.ps1 remove "$env:RUNNER_TEMP/package/cyfr-desktop_$($env:GITHUB_REF_NAME)_windows_$($env:ARCH).msi"

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cyfr-desktop-windows-${{ matrix.arch }}
          path: ${{ runner.temp }}/package/cyfr-desktop_${{ github.ref_name }}_windows_${{ matrix.arch }}.msi
          if-no-files-found: error
          retention-days: 1

  # The one check before anything is published: the six installers, each
  # by exact name from its package job, in one folder, the Homebrew cask
  # written from the DMGs' own bytes, and the folder holding exactly the
  # six at the tag's version, each its own bytes, and the cask exactly the
  # text this release must publish for those DMGs (tests/ci-release-graph.py
  # --installers). The merge of the images and the CLI release both need
  # it, and what they publish is the folder it checked, handed on as one
  # artifact, never fetched from the package jobs again.
  installers:
    needs: [version, linux-package, mac-package, windows-package, test, dialyzer, codex-ci, keeper-ci, license-lint, security]
    if: github.repository == 'cyfrworks/cyfr'
    timeout-minutes: 10
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the amd64 Linux package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cyfr-desktop-linux-amd64
          path: ${{ runner.temp }}/checked/packages

      - name: Download the arm64 Linux package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cyfr-desktop-linux-arm64
          path: ${{ runner.temp }}/checked/packages

      - name: Download the amd64 Mac package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cyfr-desktop-darwin-amd64
          path: ${{ runner.temp }}/checked/packages

      - name: Download the arm64 Mac package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cyfr-desktop-darwin-arm64
          path: ${{ runner.temp }}/checked/packages

      - name: Download the amd64 Windows package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cyfr-desktop-windows-amd64
          path: ${{ runner.temp }}/checked/packages

      - name: Download the arm64 Windows package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cyfr-desktop-windows-arm64
          path: ${{ runner.temp }}/checked/packages

      # The cask installs CYFR.app from the DMG for the Mac's architecture
      # and links its cyfr, each DMG named by the sha256 of its own bytes.
      - name: Write the Homebrew cask
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/checked/cask"
          bash scripts/ci/homebrew-cask.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/checked/packages" 'https://github.com/cyfrworks/cyfr/releases/download/#{version}' > "$RUNNER_TEMP/checked/cask/cyfr.rb"

      - name: The installers are the six and the cask names the DMGs
        run: python3 -I tests/ci-release-graph.py --installers "$RUNNER_TEMP/checked/packages" --version "$GITHUB_REF_NAME" --cask "$RUNNER_TEMP/checked/cask/cyfr.rb"

      - name: Hand on what was checked
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checked-installers
          path: ${{ runner.temp }}/checked
          if-no-files-found: error
          retention-days: 1

  # Each image's multi-arch manifest, made from this run's scanned digests
  # alone, and attested by the digest of the manifest the version tag names.
  # A release that is not a pre-release also moves :latest to it.
  merge:
    needs: [images, installers]
    if: github.repository == 'cyfrworks/cyfr'
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [cyfr, cyfr-locus]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By exact name: cyfr is a prefix of cyfr-locus.
      - name: Download the amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}-amd64
          path: digests

      - name: Download the arm64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}-arm64
          path: digests

      - name: Create and push the multi-arch manifest
        id: manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
        run: |
          digest=$(scripts/ci/merge-image.sh "$IMAGE" "$GITHUB_REF_NAME" "$(cat digests/amd64)" "$(cat digests/arm64)")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      # The digest merge-image.sh verified and printed, for release.json and
      # the scaffold's compose: the release job reads it from this artifact
      # alone, never from a tag another run can move.
      - name: Record the merged digest
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          mkdir -p merged
          echo "$DIGEST" > merged/digest

      - name: Upload the merged digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merged-${{ matrix.image }}
          path: merged/digest
          if-no-files-found: error
          retention-days: 1

  # The CLI's release and its provenance, and the release's signed manifest:
  # release.json names the two merged images, the Caddy and Tailscale images
  # the compose pins (third-party images this workflow does not build) and
  # the scaffold, each by digest, and is signed keyless under this
  # workflow's identity at the tag. The order avoids a digest cycle: the
  # images' digests go into the scaffold's compose, the scaffold is built
  # and hashed, and only then is the manifest written, checked and signed.
  release:
    needs: [version, merge, installers, test, dialyzer, codex-ci, keeper-ci, license-lint, security]
    if: github.repository == 'cyfrworks/cyfr'
    # It downloads the six installers, near a gigabyte, and GoReleaser
    # uploads them with the archives.
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum

      # Its default, cosign v3.1.4, reads the log entry back when Rekor
      # answers 409 to the retry of a write whose answer was lost.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # By exact name: cyfr is a prefix of cyfr-locus. Outside the
      # checkout, so GoReleaser finds the tree as the tag left it.
      - name: Download the merged cyfr digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merged-cyfr
          path: ${{ runner.temp }}/merged/cyfr

      - name: Download the merged cyfr-locus digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merged-cyfr-locus
          path: ${{ runner.temp }}/merged/cyfr-locus

      # The installers and the cask the installers job checked, as it
      # handed them on: GoReleaser sums and attaches that folder's six, and
      # the tap's step pushes that cask.
      - name: Download what was checked
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checked-installers
          path: ${{ runner.temp }}/checked

      # The scaffold's compose names each image as <version>@<digest>; the
      # script refuses a malformed digest and an image line left unpinned.
      - name: Create scaffold tarball
        run: |
          set -euo pipefail
          cyfr=$(cat "$RUNNER_TEMP/merged/cyfr/digest")
          locus=$(cat "$RUNNER_TEMP/merged/cyfr-locus/digest")
          bash scripts/scaffold-tarball.sh apps/codex/cyfr-scaffold.tar.gz "$GITHUB_REF_NAME" "$cyfr" "$locus"

      # Written once, outside the checkout: the bytes signed below are the
      # bytes released, and GoReleaser finds the tree as the tag left it.
      # The schema fingerprint is the release's own cyfr image's answer, by
      # the merged digest, so Arca's one definition of it is the one read.
      - name: Write the release manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          cyfr=$(cat "$RUNNER_TEMP/merged/cyfr/digest")
          locus=$(cat "$RUNNER_TEMP/merged/cyfr-locus/digest")
          schema=$(docker run --rm -e CYFR_ACCESS=local -e "CYFR_SECRET_KEY_BASE=$(openssl rand -hex 48)" "ghcr.io/cyfrworks/cyfr@$cyfr" bin/cyfr eval 'IO.puts("CYFR_SCHEMA=" <> Arca.SchemaFingerprint.current())' | sed -n 's/^CYFR_SCHEMA=//p')
          caddy=$(sed -nE 's/^[[:space:]]*image:[[:space:]]*caddy:[^@[:space:]]*@(sha256:[0-9a-f]{64})[[:space:]]*$/\1/p' docker-compose.yml)
          tailscale=$(sed -nE 's/^[[:space:]]*image:[[:space:]]*tailscale\/tailscale:[^@[:space:]]*@(sha256:[0-9a-f]{64})[[:space:]]*$/\1/p' docker-compose.yml)
          scaffold=$(sha256sum apps/codex/cyfr-scaffold.tar.gz | cut -d' ' -f1)
          jq -n \
            --arg version "$GITHUB_REF_NAME" \
            --arg cyfr "$cyfr" \
            --arg locus "$locus" \
            --arg caddy "$caddy" \
            --arg tailscale "$tailscale" \
            --arg scaffold "sha256:$scaffold" \
            --arg schema "$schema" \
            '{version: $version, images: {cyfr: $cyfr, cyfr_locus: $locus, caddy: $caddy, tailscale: $tailscale}, scaffold: $scaffold, schema_fingerprint: $schema}' \
            > "$RUNNER_TEMP/release/release.json"

      # The manifest's shape (tests/fixtures/release_manifest.json's rules),
      # its version against the tag, its scaffold digest against the file,
      # its Caddy and Tailscale digests against the compose, and the
      # scaffold's compose against its image digests.
      - name: Validate the release manifest
        run: python3 -I tests/ci-release-graph.py --manifest "$RUNNER_TEMP/release/release.json" --version "$GITHUB_REF_NAME" --scaffold apps/codex/cyfr-scaffold.tar.gz

      # A keyless signing is safe to repeat: each run signs with a new key
      # and certificate, so it writes a new log entry and a bundle that
      # verifies without the others. A transparency log too slow to answer
      # then fails one run, not the release.
      - name: Sign the release manifest
        run: scripts/ci/retry.sh cosign sign-blob --yes --new-bundle-format --bundle "$RUNNER_TEMP/release/release.json.sigstore.json" "$RUNNER_TEMP/release/release.json"

      # The tag's written note, published as the release's notes in place of
      # a list of commits: GoReleaser's changelog step reads --release-notes.
      - name: Write the release note
        run: scripts/ci/release-note.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" "$RUNNER_TEMP/release/notes.md"

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: 'v2.18.3'
          args: release --clean --release-notes ${{ runner.temp }}/release/notes.md
          workdir: apps/codex
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Where .goreleaser.yml's release finds release.json and its bundle.
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release
          # Where it finds the CYFR app's six installers, to sum and attach.
          RELEASE_PACKAGES_DIR: ${{ runner.temp }}/checked/packages

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/codex/dist/checksums.txt

      - name: Generate hashes for SLSA
        id: hash
        env:
          ARTIFACTS: "${{ steps.goreleaser.outputs.artifacts }}"
        run: |
          set -euo pipefail
          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select(.type=="Checksum") | .path')
          echo "hashes=$(cat "apps/codex/$checksum_file" | base64 -w0)" >> "$GITHUB_OUTPUT"

      # Push the checked cask to the tap as a separate, non-fatal step,
      # after the release it names is published, so a flaky tap push (e.g. a
      # transient GitHub 500) can never fail the release or skip the
      # attestation/SLSA steps above. Plain git is used instead of the
      # contents REST API, and continue-on-error keeps the job green. A
      # pre-release never reaches the tap: brew installs the release it
      # names. The tap only moves forward: a cask of a newer release, read
      # at the clone and again after each retry's fetch, is never replaced,
      # and that is no failure of this release. The token reaches git only
      # through a credential helper that reads it from this step's
      # environment, so no URL, command line or file in the clone holds it.
      - name: Publish Homebrew cask to tap
        continue-on-error: true
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The version job admitted the tag, so a hyphen is its pre-release.
          case "$TAG" in
            *-*)
              echo "::notice::${TAG} is a pre-release; the Homebrew tap keeps the release it names."
              exit 0
              ;;
          esac
          # The cask the release checked before it published.
          CASK_SRC="$RUNNER_TEMP/checked/cask/cyfr.rb"
          if [ ! -s "$CASK_SRC" ]; then
            echo "::error::No cask at $CASK_SRC; the tap is not updated."
            exit 1
          fi

          # x-access-token works for classic + fine-grained PATs over https.
          tap_git() {
            git -c credential.helper= \
              -c 'credential.helper=!f() { test "$1" = get || exit 0; echo username=x-access-token; echo "password=$HOMEBREW_TAP_TOKEN"; }; f' \
              "$@"
          }
          workdir="$(mktemp -d)"
          tap_git clone --depth 1 https://github.com/cyfrworks/homebrew-cyfr.git "$workdir"
          git -C "$workdir" config user.name  "github-actions[bot]"
          git -C "$workdir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 0 when the tap's cask names a release newer than this one; the
          # tap holds releases alone, which sort -V orders. Only an absent
          # cask allows the first write: one that is there and whose version
          # cannot be read ends the step, and the tap is left as it is.
          newer_in_tap() {
            tap_cask="$workdir/Casks/cyfr.rb"
            [ -e "$tap_cask" ] || return 1
            held=$(sed -nE 's/^[[:space:]]*version "([^"]+)"[[:space:]]*$/\1/p' "$tap_cask" | head -n 1) || held=""
            if [ -z "$held" ]; then
              echo "::error::The Homebrew tap's ${tap_cask#"$workdir"/} is there and names no version this step can read; the tap is left as it is."
              exit 1
            fi
            [ "$held" != "$TAG" ] && [ "$(printf '%s\n%s\n' "$held" "$TAG" | sort -V | tail -n 1)" = "$held" ]
          }
          keep_newer() {
            echo "::notice::The Homebrew tap names ${held}, newer than ${TAG}; it is left as it is."
            exit 0
          }

          # Install the cask, staged before the check for changes so a new
          # file is included.
          stage() {
            mkdir -p "$workdir/Casks"
            cp "$CASK_SRC" "$workdir/Casks/cyfr.rb"
            git -C "$workdir" add -A
          }

          if newer_in_tap; then keep_newer; fi
          stage
          if git -C "$workdir" diff --cached --quiet; then
            echo "Tap already up to date for ${TAG}; nothing to commit."
            exit 0
          fi
          git -C "$workdir" commit -m "Cask update for cyfr version ${TAG}"

          n=0
          until [ "$n" -ge 3 ]; do
            if tap_git -C "$workdir" push origin HEAD:main; then
              echo "Pushed cask ${TAG} to tap."
              exit 0
            fi
            n=$((n+1))   # assignment form — safe under `set -e` (unlike bare ((n++)))
            echo "::warning::tap push attempt $n failed; re-syncing and retrying..."
            tap_git -C "$workdir" fetch origin main
            git -C "$workdir" reset --hard origin/main
            if newer_in_tap; then keep_newer; fi
            stage
            if git -C "$workdir" diff --cached --quiet; then
              echo "Tap up to date after sync; done."
              exit 0
            fi
            git -C "$workdir" commit -m "Cask update for cyfr version ${TAG}"
            sleep $((5 * n))
          done

          echo "::error::Failed to push Homebrew cask after retries — fix-forward the tap manually."
          {
            echo "### ⚠️ Homebrew tap NOT updated for ${TAG}"
            echo "The release published fine, but \`Casks/cyfr.rb\` in cyfrworks/homebrew-cyfr was not updated."
            echo "Fix-forward manually: clone the tap, copy the generated cask to Casks/cyfr.rb, commit and push."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1   # red (visible) but continue-on-error keeps the job green so provenance runs

  provenance:
    if: github.repository == 'cyfrworks/cyfr'
    needs: [release]
    permissions:
      actions: read
      id-token: write
      contents: write
    # Tag-pinned on purpose: the SLSA verifier resolves the reusable builder
    # by its release tag, so a commit-SHA pin would break provenance
    # verification for consumers.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true
