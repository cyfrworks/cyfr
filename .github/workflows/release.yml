# The one workflow a release tag starts. It verifies the tagged commit once,
# with every check a change to main runs, and publishes nothing unless all
# six pass: the CLI release and its provenance, and the cyfr and cyfr-locus
# images.
name: Release
# A release tag is MAJOR.MINOR.PATCH, or the same with a SemVer
# pre-release (0.6.0-alpha.1). GitHub's filter patterns admit more than
# that; the version job is the exact check. A pre-release publishes as a
# GitHub pre-release (.goreleaser.yml), leaves the images' :latest where
# it was (scripts/ci/merge-image.sh) and the Homebrew tap on the release it
# names.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: read

# A second run of one tag waits for the first instead of cancelling it, so
# a publication is never cut off between its pushes and its manifest.
# GitHub keeps one pending run per group: a pending run is cancelled when a
# newer one queues behind it.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/cyfrworks

jobs:
  # The verification: each called workflow bounds its own jobs.
  test:
    if: github.repository == 'cyfrworks/cyfr'
    uses: ./.github/workflows/test.yml

  dialyzer:
    if: github.repository == 'cyfrworks/cyfr'
    uses: ./.github/workflows/dialyzer.yml

  codex-ci:
    if: github.repository == 'cyfrworks/cyfr'
    uses: ./.github/workflows/codex-ci.yml

  keeper-ci:
    if: github.repository == 'cyfrworks/cyfr'
    uses: ./.github/workflows/keeper-ci.yml

  license-lint:
    if: github.repository == 'cyfrworks/cyfr'
    uses: ./.github/workflows/license-lint.yml

  security:
    if: github.repository == 'cyfrworks/cyfr'
    uses: ./.github/workflows/security.yml

  # The tag names the release the tree declares: Prima.Version.current/0
  # reads apps/prima/mix.exs, and every mix.exs moves with it
  # (Cyfr.VersionDriftTest). The declared version is a release version by
  # the one rule tests/fixtures/release_manifest.json's versions hold, and
  # the tag is exactly it, pre-release included. The image build and the
  # CLI release need this job, so a tag that names another version builds
  # and publishes nothing. It publishes nothing itself and runs beside the
  # six checks.
  version:
    if: github.repository == 'cyfrworks/cyfr'
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag is the version mix.exs declares
        run: |
          set -euo pipefail
          # Byte by byte: under another locale [A-Za-z] can admit letters
          # outside ASCII.
          export LC_ALL=C
          release='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'
          declared=()
          while IFS= read -r line; do
            if [[ "$line" =~ ^[[:space:]]*version:[[:space:]]*\"([^\"]*)\" ]]; then
              declared+=("${BASH_REMATCH[1]}")
            fi
          done < apps/prima/mix.exs
          if [ "${#declared[@]}" -ne 1 ] || ! [[ "${declared[0]}" =~ $release ]]; then
            echo "::error::apps/prima/mix.exs declares ${#declared[@]} versions [${declared[*]}], not one release version (MAJOR.MINOR.PATCH, or with a pre-release)"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "${declared[0]}" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not the version ${declared[0]} that apps/prima/mix.exs declares"
            exit 1
          fi
          echo "The tag $GITHUB_REF_NAME is the version apps/prima/mix.exs declares."

  # The app image and the Locus image, which serves the runtime, the builds
  # and the backends service: every deploy pulls both, and a project
  # `cyfr init` writes carries no sources to build them from.
  #
  # One build per image and platform. It loads the image for the scan and
  # pushes the same result by digest alone: no tag names it, so a digest
  # whose scan fails stays where no version or `latest` reaches it, and a
  # concurrent run cannot move what this run merges.
  images:
    needs: [version, test, dialyzer, codex-ci, keeper-ci, license-lint, security]
    if: github.repository == 'cyfrworks/cyfr'
    # The slowest of these jobs, cyfr-locus on amd64, runs about ten minutes
    # (cyfr about three): the bound is three times that.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [cyfr, cyfr-locus]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: cyfr
            file: Dockerfile
          - image: cyfr-locus
            file: Dockerfile.locus
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The loaded image carries its attestation, which the runner's classic
      # image store cannot hold. The switch restarts the daemon, so it comes
      # before buildx creates its builder.
      - name: Use the containerd image store
        run: sudo scripts/ci/containerd-image-store.sh

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # APT_REFRESH is the UTC date, so each image's upgrade layer refreshes
      # daily and is shared by every build of one day.
      - name: Extract metadata
        id: meta
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "arch=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
          echo "apt-refresh=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          build-args: APT_REFRESH=${{ steps.meta.outputs.apt-refresh }}
          # The action drops its max-mode default when an output loads the
          # image; the published attestation keeps the build's config,
          # builder id and sources.
          provenance: mode=max
          outputs: |
            type=docker,name=cyfr-scan/${{ matrix.image }}:${{ steps.meta.outputs.arch }}
            type=image,name=${{ env.REGISTRY }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ steps.meta.outputs.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ steps.meta.outputs.arch }},mode=max

      # A fixable HIGH or CRITICAL finding fails the release. The findings
      # .trivyignore.yaml lists are npm's bundled dependencies, which the
      # Locus image runs for tincture builds and for the stdio backends it
      # serves. The scan reads the loaded image alone: a name missing from
      # the daemon fails instead of being fetched from a registry.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
        with:
          version: v0.75.0
          image-ref: cyfr-scan/${{ matrix.image }}:${{ steps.meta.outputs.arch }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

      - name: The scanned image is the pushed one
        env:
          SCANNED: cyfr-scan/${{ matrix.image }}:${{ steps.meta.outputs.arch }}
          PUSHED: ${{ env.REGISTRY }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ steps.meta.outputs.arch }}
        run: |
          scripts/ci/scanned-is-pushed.sh "$SCANNED" "$PUSHED" "$DIGEST"
          mkdir -p digest
          echo "$DIGEST" > "digest/$ARCH"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ steps.meta.outputs.arch }}
          path: digest/${{ steps.meta.outputs.arch }}
          if-no-files-found: error
          retention-days: 1

  # Each image's multi-arch manifest, made from this run's scanned digests
  # alone, and attested by the digest of the manifest the version tag names.
  # A release that is not a pre-release also moves :latest to it.
  merge:
    needs: images
    if: github.repository == 'cyfrworks/cyfr'
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: [cyfr, cyfr-locus]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By exact name: cyfr is a prefix of cyfr-locus.
      - name: Download the amd64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}-amd64
          path: digests

      - name: Download the arm64 digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.image }}-arm64
          path: digests

      - name: Create and push the multi-arch manifest
        id: manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
        run: |
          digest=$(scripts/ci/merge-image.sh "$IMAGE" "$GITHUB_REF_NAME" "$(cat digests/amd64)" "$(cat digests/arm64)")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      # The digest merge-image.sh verified and printed, for release.json and
      # the scaffold's compose: the release job reads it from this artifact
      # alone, never from a tag another run can move.
      - name: Record the merged digest
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          mkdir -p merged
          echo "$DIGEST" > merged/digest

      - name: Upload the merged digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merged-${{ matrix.image }}
          path: merged/digest
          if-no-files-found: error
          retention-days: 1

  # The CLI's release and its provenance, and the release's signed manifest:
  # release.json names the two merged images, the Caddy and Tailscale images
  # the compose pins (third-party images this workflow does not build) and
  # the scaffold, each by digest, and is signed keyless under this
  # workflow's identity at the tag. The order avoids a digest cycle: the
  # images' digests go into the scaffold's compose, the scaffold is built
  # and hashed, and only then is the manifest written, checked and signed.
  release:
    needs: [version, merge, test, dialyzer, codex-ci, keeper-ci, license-lint, security]
    if: github.repository == 'cyfrworks/cyfr'
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # By exact name: cyfr is a prefix of cyfr-locus. Outside the
      # checkout, so GoReleaser finds the tree as the tag left it.
      - name: Download the merged cyfr digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merged-cyfr
          path: ${{ runner.temp }}/merged/cyfr

      - name: Download the merged cyfr-locus digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: merged-cyfr-locus
          path: ${{ runner.temp }}/merged/cyfr-locus

      # The scaffold's compose names each image as <version>@<digest>; the
      # script refuses a malformed digest and an image line left unpinned.
      - name: Create scaffold tarball
        run: |
          set -euo pipefail
          cyfr=$(cat "$RUNNER_TEMP/merged/cyfr/digest")
          locus=$(cat "$RUNNER_TEMP/merged/cyfr-locus/digest")
          bash scripts/scaffold-tarball.sh apps/codex/cyfr-scaffold.tar.gz "$GITHUB_REF_NAME" "$cyfr" "$locus"

      # Written once, outside the checkout: the bytes signed below are the
      # bytes released, and GoReleaser finds the tree as the tag left it.
      - name: Write the release manifest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          cyfr=$(cat "$RUNNER_TEMP/merged/cyfr/digest")
          locus=$(cat "$RUNNER_TEMP/merged/cyfr-locus/digest")
          caddy=$(sed -nE 's/^[[:space:]]*image:[[:space:]]*caddy:[^@[:space:]]*@(sha256:[0-9a-f]{64})[[:space:]]*$/\1/p' docker-compose.yml)
          tailscale=$(sed -nE 's/^[[:space:]]*image:[[:space:]]*tailscale\/tailscale:[^@[:space:]]*@(sha256:[0-9a-f]{64})[[:space:]]*$/\1/p' docker-compose.yml)
          scaffold=$(sha256sum apps/codex/cyfr-scaffold.tar.gz | cut -d' ' -f1)
          jq -n \
            --arg version "$GITHUB_REF_NAME" \
            --arg cyfr "$cyfr" \
            --arg locus "$locus" \
            --arg caddy "$caddy" \
            --arg tailscale "$tailscale" \
            --arg scaffold "sha256:$scaffold" \
            '{version: $version, images: {cyfr: $cyfr, cyfr_locus: $locus, caddy: $caddy, tailscale: $tailscale}, scaffold: $scaffold}' \
            > "$RUNNER_TEMP/release/release.json"

      # The manifest's shape (tests/fixtures/release_manifest.json's rules),
      # its version against the tag, its scaffold digest against the file,
      # its Caddy and Tailscale digests against the compose, and the
      # scaffold's compose against its image digests.
      - name: Validate the release manifest
        run: python3 -I tests/ci-release-graph.py --manifest "$RUNNER_TEMP/release/release.json" --version "$GITHUB_REF_NAME" --scaffold apps/codex/cyfr-scaffold.tar.gz

      - name: Sign the release manifest
        run: cosign sign-blob --yes --new-bundle-format --bundle "$RUNNER_TEMP/release/release.json.sigstore.json" "$RUNNER_TEMP/release/release.json"

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: 'v2.18.3'
          args: release --clean
          workdir: apps/codex
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Where .goreleaser.yml's release finds release.json and its bundle.
          RELEASE_MANIFEST_DIR: ${{ runner.temp }}/release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: apps/codex/dist/checksums.txt

      - name: Generate hashes for SLSA
        id: hash
        env:
          ARTIFACTS: "${{ steps.goreleaser.outputs.artifacts }}"
        run: |
          set -euo pipefail
          checksum_file=$(echo "$ARTIFACTS" | jq -r '.[] | select(.type=="Checksum") | .path')
          echo "hashes=$(cat "apps/codex/$checksum_file" | base64 -w0)" >> "$GITHUB_OUTPUT"

      # Push the generated Homebrew cask to the tap as a separate, non-fatal step.
      # GoReleaser generates the cask (skip_upload) but does not push it, so a
      # flaky tap push (e.g. a transient GitHub 500) can never fail the release or
      # skip the attestation/SLSA steps above. Plain git is used instead of the
      # contents REST API, and continue-on-error keeps the job green. A
      # pre-release never reaches the tap: brew installs the release it names.
      - name: Publish Homebrew cask to tap
        continue-on-error: true
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The version job admitted the tag, so a hyphen is its pre-release.
          case "$TAG" in
            *-*)
              echo "::notice::${TAG} is a pre-release; the Homebrew tap keeps the release it names."
              exit 0
              ;;
          esac
          # GoReleaser (skip_upload) writes the cask under dist/. -print -quit
          # stops at the first match; `|| true` lets a missing dist fall through
          # to the skip branch instead of aborting under `set -e`.
          CASK_SRC="$(find apps/codex/dist -type f -name 'cyfr.rb' -print -quit 2>/dev/null || true)"
          if [ -z "$CASK_SRC" ]; then
            echo "::warning::No generated cask found under apps/codex/dist; skipping tap update."
            exit 0
          fi

          workdir="$(mktemp -d)"
          # x-access-token works for classic + fine-grained PATs over https.
          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/cyfrworks/homebrew-cyfr.git" \
            "$workdir"
          git -C "$workdir" config user.name  "github-actions[bot]"
          git -C "$workdir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Install the cask, staged before the check for changes so a new
          # file is included.
          stage() {
            mkdir -p "$workdir/Casks"
            cp "$CASK_SRC" "$workdir/Casks/cyfr.rb"
            git -C "$workdir" add -A
          }

          stage
          if git -C "$workdir" diff --cached --quiet; then
            echo "Tap already up to date for ${TAG}; nothing to commit."
            exit 0
          fi
          git -C "$workdir" commit -m "Cask update for cyfr version ${TAG}"

          n=0
          until [ "$n" -ge 3 ]; do
            if git -C "$workdir" push origin HEAD:main; then
              echo "Pushed cask ${TAG} to tap."
              exit 0
            fi
            n=$((n+1))   # assignment form — safe under `set -e` (unlike bare ((n++)))
            echo "::warning::tap push attempt $n failed; re-syncing and retrying..."
            git -C "$workdir" fetch origin main
            git -C "$workdir" reset --hard origin/main
            stage
            if git -C "$workdir" diff --cached --quiet; then
              echo "Tap up to date after sync; done."
              exit 0
            fi
            git -C "$workdir" commit -m "Cask update for cyfr version ${TAG}"
            sleep $((5 * n))
          done

          echo "::error::Failed to push Homebrew cask after retries — fix-forward the tap manually."
          {
            echo "### ⚠️ Homebrew tap NOT updated for ${TAG}"
            echo "The release published fine, but \`Casks/cyfr.rb\` in cyfrworks/homebrew-cyfr was not updated."
            echo "Fix-forward manually: clone the tap, copy the generated cask to Casks/cyfr.rb, commit and push."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1   # red (visible) but continue-on-error keeps the job green so provenance runs

  provenance:
    if: github.repository == 'cyfrworks/cyfr'
    needs: [release]
    permissions:
      actions: read
      id-token: write
      contents: write
    # Tag-pinned on purpose: the SLSA verifier resolves the reusable builder
    # by its release tag, so a commit-SHA pin would break provenance
    # verification for consumers.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: true
