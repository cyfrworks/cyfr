name: Security

on:
  pull_request:
    paths:
      - 'apps/cyfr/**'
      - 'apps/opus/**'
      - 'apps/locus/**'
      - 'apps/codex/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.github/workflows/security.yml'
  push:
    branches: [main]
    paths:
      - 'apps/cyfr/**'
      - 'apps/opus/**'
      - 'apps/locus/**'
      - 'apps/codex/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.github/workflows/security.yml'
  schedule:
    # Weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  elixir-audit:
    name: Elixir Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: '28'
          elixir-version: '1.19.5'

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Check retired packages
        # Newer Hex also checks security advisories in hex.audit (an id here
        # matches the advisory's primary ID or any alias). Same accepted
        # no-fix advisories as the deps.audit step below — see its comment.
        env:
          HEX_IGNORE_ADVISORIES: "CVE-2026-32686,CVE-2026-43969,CVE-2026-43966"
        run: mix hex.audit

      - name: Check vulnerable dependencies
        # Three advisories have no actionable fix and are explicitly accepted
        # (each listed under BOTH its GHSA and EEF-CVE ids — the advisory DB
        # re-keyed existing entries under EEF ids in 2026-07, which un-ignored
        # them):
        #   GHSA-rhv4-8758-jx7v / EEF-CVE-2026-32686 (decimal, moderate DoS) —
        #     fixed only in decimal 3.x, which ecto's `decimal ~> 2.0`
        #     requirement disallows; revisit when ecto supports decimal 3.
        #   GHSA-g2wm-735q-3f56 / EEF-CVE-2026-43969 (cowlib, low cookie
        #     injection) — no patched cowlib release exists yet.
        #   EEF-CVE-2026-43966 (cowlib, medium response splitting via non-VCHAR
        #     bytes) — no patched cowlib release exists yet (2.18.0 is latest);
        #     cowlib is transitive and Bandit serves HTTP in production.
        run: mix deps.audit --ignore-advisory-ids "GHSA-rhv4-8758-jx7v,GHSA-g2wm-735q-3f56,EEF-CVE-2026-32686,EEF-CVE-2026-43969,EEF-CVE-2026-43966"

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

      - name: Phoenix security scan
        run: mix sobelow --config
        working-directory: apps/cyfr

  go-audit:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/codex
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # govulncheck v1.4.0 panics (exit 2) while analyzing generics under
        # Go 1.26 ("ForEachElement called on type containing *types.TypeParam")
        # — a known upstream tool bug, NOT a code finding. A real finding exits
        # 3 and still fails CI; only the tool crash is tolerated so it doesn't
        # block the pipeline. Revisit when a govulncheck release supports the
        # toolchain pinned in apps/codex/go.mod.
        run: |
          set +e
          govulncheck ./...
          code=$?
          set -e
          case "$code" in
            0) echo "govulncheck: no known vulnerabilities" ;;
            3) echo "::error::govulncheck found vulnerabilities"; exit 1 ;;
            *) echo "::warning::govulncheck exited $code (known v1.4.0 panic on Go 1.26 generics — not a finding)" ;;
          esac

  installer-verify:
    name: Installer Verification Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run install.sh verification tests
        run: sh tests/install-verify-test.sh
