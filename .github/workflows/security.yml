name: Security

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.env.example'
      - '.env.*.example'
      - 'trivy-secret.yaml'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.github/actions/**'
      - '.github/workflows/security.yml'
      - '.trivyignore.yaml'
      - 'seed/components/**'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.env.example'
      - '.env.*.example'
      - 'trivy-secret.yaml'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.github/actions/**'
      - '.github/workflows/security.yml'
      - '.trivyignore.yaml'
      - 'seed/components/**'
  schedule:
    # Weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Mix through 1.20 can wait forever on its own build lock the second
  # time a fresh lock directory is taken, and a runner starts every one
  # fresh. One Mix process at a time builds here, so the lock is off.
  MIX_OS_CONCURRENCY_LOCK: 0

jobs:
  elixir-audit:
    name: Elixir Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup-elixir
        with:
          cache-key-prefix: security

      - name: Install dependencies
        run: |
          mix deps.get
          scripts/fetch-prebuilt-binaries.sh

      - name: Compile
        run: mix compile

      - name: Whether the advisory checks block this run
        id: world
        run: scripts/ci/world-checks.sh

      - name: Check retired and vulnerable dependencies
        # The audits and their one suppression live in the script, which
        # scripts/release.sh runs again right before it tags.
        continue-on-error: ${{ steps.world.outputs.informational == 'true' }}
        run: scripts/dependency-audit.sh

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

      - name: Phoenix security scan
        run: mix sobelow --config
        working-directory: apps/cyfr

  go-audit:
    name: Go Vulnerability Check (${{ matrix.tree }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Every Go tree in the repository, each scanned under the Go version
        # its own go.mod names.
        tree: [apps/codex, apps/locus/keeper]
    defaults:
      run:
        working-directory: ${{ matrix.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.tree }}/go.mod
          cache-dependency-path: ${{ matrix.tree }}/go.sum

      - name: Install govulncheck
        # Pinned like every other tool in CI.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        # Every nonzero exit fails: a finding (3), a scanner panic and any
        # other tool failure alike, since a scan that did not complete is not
        # clean coverage.
        run: bash "$GITHUB_WORKSPACE/scripts/security-scan.sh" govulncheck ./...

  security-scan-harness:
    name: Security Scan Wrapper Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run security scan regression tests
        run: bash tests/security-scan-test.sh

  installer-verify:
    name: Installer Verification Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The install script's policy block is generated from
      # apps/codex/internal/install/policy.json; a hand edit to either side
      # alone fails here.
      - name: The install script's policy is the generated one
        run: python3 -I scripts/generate-install-policy.py --check

      - name: Run install.sh verification tests
        run: sh tests/install-verify-test.sh

      - name: Run the install proof's cleanup tests
        run: bash tests/install-screen-proof/cleanup-test.sh

      - name: Run the install proof's evidence predicates tests
        run: bash tests/install-screen-proof/predicates-test.sh

  repo-scan:
    name: Trivy (secrets + IaC misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scan committed secrets and container configuration.
      - name: Secret scan (enforced)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scanners: secret
          format: table
          exit-code: '1'

      - name: Misconfiguration scan (enforced)
        # A HIGH or CRITICAL configuration finding fails, apart from the
        # path-scoped, dated exceptions under `misconfigurations:` in
        # .trivyignore.yaml.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scanners: misconfig
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml

  npm-audit:
    name: npm Audit (shipped tincture lockfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit every shipped lockfile
        # The seed's lockfiles ship in the image (Dockerfile's COPY of
        # seed/components) and a tincture build installs from them. A HIGH
        # or CRITICAL advisory in a runtime dependency fails. A shipped
        # version is never edited: a finding is fixed in a new tincture
        # version. Finding no lockfile fails too, so a moved tree is not
        # read as a clean one.
        run: |
          mapfile -t locks < <(find seed/components -name package-lock.json -not -path '*/node_modules/*' | sort)
          if [ "${#locks[@]}" -eq 0 ]; then
            echo "no package-lock.json under seed/components" >&2
            exit 1
          fi
          status=0
          for lock in "${locks[@]}"; do
            dir=$(dirname "$lock")
            echo "::group::$dir"
            (cd "$dir" && bash "$GITHUB_WORKSPACE/scripts/security-scan.sh" npm audit --omit=dev --audit-level=high) || status=1
            echo "::endgroup::"
          done
          exit "$status"
