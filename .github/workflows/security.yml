name: Security

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.env.example'
      - '.env.*.example'
      - 'trivy-secret.yaml'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.github/workflows/security.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.env.example'
      - '.env.*.example'
      - 'trivy-secret.yaml'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.github/workflows/security.yml'
  schedule:
    # Weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Mix through 1.20 can wait forever on its own build lock the second
  # time a fresh lock directory is taken, and a runner starts every one
  # fresh. One Mix process at a time builds here, so the lock is off.
  MIX_OS_CONCURRENCY_LOCK: 0

jobs:
  elixir-audit:
    name: Elixir Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        id: beam
        with:
          otp-version: '29'
          elixir-version: '1.20.4'

      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Check retired packages
        # Suppress the cowlib advisory that has no fixed release: 2.21.0 is
        # the newest and still carries it. cowlib is test-only here — it
        # arrives through `bypass` (`only: :test`) and the server speaks
        # HTTP through Bandit, so no cowboy code ships. Remove the
        # suppression when cowlib publishes a fix, or when `bypass` no
        # longer pulls it.
        env:
          HEX_IGNORE_ADVISORIES: "CVE-2026-43966"
        run: mix hex.audit

      - name: Check vulnerable dependencies
        run: mix deps.audit

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

      - name: Phoenix security scan
        run: mix sobelow --config
        working-directory: apps/cyfr

  go-audit:
    name: Go Vulnerability Check (${{ matrix.tree }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Go tree in the repository, each scanned under the Go version
        # its own go.mod names.
        tree: [apps/codex, apps/locus/keeper]
    defaults:
      run:
        working-directory: ${{ matrix.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.tree }}/go.mod
          cache-dependency-path: ${{ matrix.tree }}/go.sum

      - name: Install govulncheck
        # Pinned like every other tool in CI.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        # Every nonzero exit fails: a finding (3), a scanner panic and any
        # other tool failure alike, since a scan that did not complete is not
        # clean coverage.
        run: bash "$GITHUB_WORKSPACE/scripts/security-scan.sh" govulncheck ./...

  security-scan-harness:
    name: Security Scan Wrapper Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run security scan regression tests
        run: bash tests/security-scan-test.sh

  installer-verify:
    name: Installer Verification Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run install.sh verification tests
        run: sh tests/install-verify-test.sh

  repo-scan:
    name: Trivy (secrets + IaC misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scan committed secrets and container configuration.
      - name: Secret scan (enforced)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scanners: secret
          format: table
          exit-code: '1'

      - name: Misconfiguration scan (report-only)
        # Report configuration findings without failing CI.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scanners: misconfig
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
