name: Security

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.env.example'
      - '.env.*.example'
      - 'trivy-secret.yaml'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.github/actions/**'
      - '.github/workflows/security.yml'
      - '.trivyignore.yaml'
      - 'seed/components/**'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.env.example'
      - '.env.*.example'
      - 'trivy-secret.yaml'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.github/actions/**'
      - '.github/workflows/security.yml'
      - '.trivyignore.yaml'
      - 'seed/components/**'
  schedule:
    # Weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Mix through 1.20 can wait forever on its own build lock the second
  # time a fresh lock directory is taken, and a runner starts every one
  # fresh. One Mix process at a time builds here, so the lock is off.
  MIX_OS_CONCURRENCY_LOCK: 0

jobs:
  elixir-audit:
    name: Elixir Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup-elixir
        with:
          cache-key-prefix: security

      - name: Install dependencies
        run: |
          scripts/ci/retry.sh mix deps.get
          scripts/fetch-prebuilt-binaries.sh

      - name: Compile
        run: mix compile

      - name: Whether the advisory checks block this run
        id: world
        run: scripts/ci/world-checks.sh

      - name: Check retired and vulnerable dependencies
        # The audits live in the script, which
        # scripts/release.sh runs again right before it tags.
        continue-on-error: ${{ steps.world.outputs.informational == 'true' }}
        run: scripts/dependency-audit.sh

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

      - name: Phoenix security scan
        run: mix sobelow --config
        working-directory: apps/cyfr

  go-audit:
    name: Go Vulnerability Check (${{ matrix.tree }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Every Go tree in the repository, each scanned under the Go version
        # its own go.mod names.
        tree: [apps/codex, apps/locus/keeper]
    defaults:
      run:
        working-directory: ${{ matrix.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ matrix.tree }}/go.mod
          cache-dependency-path: ${{ matrix.tree }}/go.sum

      - name: Install govulncheck
        # Pinned like every other tool in CI.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        # Every nonzero exit fails: a finding (3), a scanner panic and any
        # other tool failure alike, since a scan that did not complete is not
        # clean coverage.
        run: bash "$GITHUB_WORKSPACE/scripts/security-scan.sh" govulncheck ./...

  cargo-deny:
    name: Cargo Deny (the runner's crate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/locus/runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust release rust-toolchain.toml names
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/rust-toolchain.toml")"
          [ -n "$channel" ] || { echo "::error::rust-toolchain.toml names no channel" >&2; exit 1; }
          rustup toolchain install "$channel" --profile minimal

      - name: Cache cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-0.22.1

      - name: Install cargo-deny
        # Pinned like every other tool in CI.
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.22.1 --locked

      - name: Run cargo deny
        # Every crate Cargo.lock pins against the advisory database and
        # deny.toml: an advisory, a yanked crate, a license not listed, a
        # source other than crates.io or a crate at two versions fails.
        run: cargo deny --locked check

  security-scan-harness:
    name: Security Scan Wrapper Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run security scan regression tests
        run: bash tests/security-scan-test.sh

  installer-verify:
    name: Installer Verification Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run install.sh verification tests
        run: sh tests/install-verify-test.sh

  repo-scan:
    name: Trivy (secrets + IaC misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scan committed secrets and container configuration.
      - name: Secret scan (enforced)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scanners: secret
          format: table
          exit-code: '1'

      - name: Misconfiguration scan (enforced)
        # A HIGH or CRITICAL configuration finding fails, apart from the
        # path-scoped, dated exceptions under `misconfigurations:` in
        # .trivyignore.yaml.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scanners: misconfig
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore.yaml

  npm-audit:
    name: npm Audit (shipped tincture lockfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit every shipped lockfile
        # The seed's lockfiles ship in the image (Dockerfile's COPY of
        # seed/components) and a tincture build installs from them. A HIGH
        # or CRITICAL advisory in a runtime dependency fails. A shipped
        # version is never edited: a finding is fixed in a new tincture
        # version. Finding no lockfile fails too, so a moved tree is not
        # read as a clean one.
        run: |
          mapfile -t locks < <(find seed/components -name package-lock.json -not -path '*/node_modules/*' | sort)
          if [ "${#locks[@]}" -eq 0 ]; then
            echo "no package-lock.json under seed/components" >&2
            exit 1
          fi
          status=0
          for lock in "${locks[@]}"; do
            dir=$(dirname "$lock")
            echo "::group::$dir"
            (cd "$dir" && bash "$GITHUB_WORKSPACE/scripts/security-scan.sh" npm audit --omit=dev --audit-level=high) || status=1
            echo "::endgroup::"
          done
          exit "$status"
