name: Security

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.env.example'
      - '.env.*.example'
      - 'trivy-secret.yaml'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.github/workflows/security.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.env.example'
      - '.env.*.example'
      - 'trivy-secret.yaml'
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - '.github/workflows/security.yml'
  schedule:
    # Weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  elixir-audit:
    name: Elixir Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        id: beam
        with:
          otp-version: '29'
          elixir-version: '1.20.3'

      - name: Cache deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Check retired packages
        # Suppress the same decimal advisory aliases as deps.audit below, and
        # the two cowlib advisories, which have no fixed release: 2.20.0 is
        # the newest and still carries them. cowlib is test-only here — it
        # arrives through `bypass` (`only: :test`) and the server speaks HTTP
        # through Bandit, so no cowboy code ships. Remove each when cowlib
        # publishes a fix, or when `bypass` no longer pulls it.
        env:
          HEX_IGNORE_ADVISORIES: "CVE-2026-32686,CVE-2026-43966,CVE-2026-43969"
        run: mix hex.audit

      - name: Check vulnerable dependencies
        # Suppress decimal advisory GHSA-rhv4-8758-jx7v / EEF-CVE-2026-32686.
        # The fix requires decimal 3.x; the installed Ecto dependency requires 2.x.
        # Remove the suppression when the dependency constraint permits the fix.
        run: mix deps.audit --ignore-advisory-ids "GHSA-rhv4-8758-jx7v,EEF-CVE-2026-32686"

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

      - name: Phoenix security scan
        run: mix sobelow --config
        working-directory: apps/cyfr

  go-audit:
    name: Go Vulnerability Check (${{ matrix.tree }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Go tree in the repository, each scanned under the Go version
        # its own go.mod names.
        tree: [apps/codex, apps/spawn]
    defaults:
      run:
        working-directory: ${{ matrix.tree }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ matrix.tree }}/go.mod
          cache-dependency-path: ${{ matrix.tree }}/go.sum

      - name: Install govulncheck
        # Pinned like every other tool in CI.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run govulncheck
        # Every nonzero exit fails: a finding (3), a scanner panic and any
        # other tool failure alike, since a scan that did not complete is not
        # clean coverage.
        run: bash ../../scripts/security-scan.sh govulncheck ./...

  security-scan-harness:
    name: Security Scan Wrapper and npm Adapter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The npm adapter cases run scripts/npm-audit-report.mjs under node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Run security scan regression tests
        run: bash tests/security-scan-test.sh

  installer-verify:
    name: Installer Verification Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run install.sh verification tests
        run: sh tests/install-verify-test.sh

  repo-scan:
    name: Trivy (secrets + IaC misconfig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Scan committed secrets and container configuration.
      - name: Secret scan (enforced)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret
          format: table
          exit-code: '1'

      - name: Misconfiguration scan (report-only)
        # Report configuration findings without failing CI.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: misconfig
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
