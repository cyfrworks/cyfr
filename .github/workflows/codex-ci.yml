name: Codex CI (cyfr CLI)

# Vet, test, and build the Go CLI on every change. security.yml only runs
# govulncheck; this gives the CLI a real green-build + test signal at PR time.

on:
  push:
    branches: [main]
    paths:
      - 'apps/codex/**'
      # TestRenderEnvFileShippedTemplate binds `cyfr init` to the shipped
      # template, TestSharedFixtureVerdicts binds internal/ref to the
      # shared component-ref fixture, and TestBundledPromptsMatchSeed binds
      # the scaffold's role and scroll rosters to seed/aqua — an edit
      # to any of them must run the Go tests.
      - '.env.example'
      # TestShippedComposePullsTheLocusImageOnce reads the shipped compose
      # file's Locus services, with the builds URL .env.example offers,
      # TestMissingStackServices its service roster, and
      # TestUpdateLeavesShippedComposeAlone its cyfr service's fields.
      - 'docker-compose.yml'
      - 'tests/fixtures/**'
      - 'seed/aqua/**'
      # TestShippedGuidesAreManaged reads the tarball's ITEMS list.
      - 'scripts/scaffold-tarball.sh'
      # TestReadmeCLITablesAreTheCommandTree reads the README's CLI tables.
      - 'README.md'
      - '.github/workflows/codex-ci.yml'
  pull_request:
    paths:
      - 'apps/codex/**'
      - '.env.example'
      - 'docker-compose.yml'
      - 'tests/fixtures/**'
      - 'seed/aqua/**'
      - 'scripts/scaffold-tarball.sh'
      - 'README.md'
      - '.github/workflows/codex-ci.yml'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: codex-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: vet + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/codex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go test
        # -race matches the Makefile's local invocation — the stricter run
        # was the one CI didn't do. The total coverage goes to the job
        # summary: it is reported, never a floor, so only a failing test
        # fails the step.
        run: |
          go test ./... -race -coverprofile="$RUNNER_TEMP/cover.out"
          echo "apps/codex coverage: $(go tool cover -func "$RUNNER_TEMP/cover.out" | tail -1)" >> "$GITHUB_STEP_SUMMARY"

      - name: go build
        run: go build ./...

  test-macos:
    # The CLI ships for macOS; this runs its checks on the platform's own
    # filesystem, process and trust-store behavior.
    name: vet + test (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/codex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...
