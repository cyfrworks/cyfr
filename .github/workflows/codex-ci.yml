name: Codex CI (cyfr CLI)

# Vet, test, and build the Go CLI on every change. security.yml only runs
# govulncheck; this gives the CLI a real green-build + test signal at PR time.
# desktop-native builds, installs and smokes the CYFR app around it.
# release-rehearsal runs the release's GoReleaser on its five installers.
# screen-idle holds the device screen's idle lock against the app's engine.

on:
  push:
    branches: [main]
    paths:
      - 'apps/codex/**'
      # TestRenderEnvFileShippedTemplate binds `cyfr init` to the shipped
      # template, TestSharedFixtureVerdicts binds internal/ref to the
      # shared component-ref fixture, and TestBundledPromptsMatchSeed binds
      # the scaffold's role and scroll rosters to seed/aqua — an edit
      # to any of them must run the Go tests.
      - '.env.example'
      # TestShippedComposePullsTheLocusImageOnce reads the shipped compose
      # file's Locus services, with the builds URL .env.example offers,
      # TestMissingStackServices its service roster, and
      # TestUpdateLeavesShippedComposeAlone its cyfr service's fields.
      - 'docker-compose.yml'
      # TestEntrypointRefusesWhileTheRestoreIsBarred runs the image's
      # entrypoint against the restore's bar (tests/fixtures/restore_barrier.json).
      - 'docker-entrypoint.sh'
      - 'tests/fixtures/**'
      # desktop-native runs the installed CYFR app's home-free smoke,
      # tests/desktop-proof/native/smoke.sh, and the app as the box's
      # screen, tests/desktop-proof/screen/app.sh; screen-idle the
      # screen's idle check, tests/desktop-proof/screen/idle.sh.
      - 'tests/desktop-proof/**'
      # The macOS legs install the cask the release writes, and
      # release-rehearsal runs GoReleaser on .goreleaser.yml.
      - 'scripts/ci/homebrew-cask.sh'
      - 'tests/ci-release-rehearsal.sh'
      # The app bundles the account pages' sign-in reader
      # (apps/codex/desktop/src/policy.js).
      - 'apps/cyfr/assets/account/**'
      - 'seed/aqua/**'
      # TestShippedGuidesAreManaged reads the tarball's ITEMS list.
      - 'scripts/scaffold-tarball.sh'
      # TestReadmeCLITablesAreTheCommandTree reads the README's CLI tables.
      - 'README.md'
      # TestPostgresClientImagesArePinned holds the PostgreSQL client pins
      # to the service image test.yml runs.
      - '.github/workflows/test.yml'
      - '.github/workflows/codex-ci.yml'
  pull_request:
    paths:
      - 'apps/codex/**'
      - '.env.example'
      - 'docker-compose.yml'
      - 'docker-entrypoint.sh'
      - 'tests/fixtures/**'
      - 'tests/desktop-proof/**'
      - 'scripts/ci/homebrew-cask.sh'
      - 'tests/ci-release-rehearsal.sh'
      - 'apps/cyfr/assets/account/**'
      - 'seed/aqua/**'
      - 'scripts/scaffold-tarball.sh'
      - 'README.md'
      - '.github/workflows/test.yml'
      - '.github/workflows/codex-ci.yml'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: codex-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: vet + test + build
    runs-on: ubuntu-latest
    # The Compose-requiring tests of cmd and the access engine bring real
    # stacks up and down, and on this runner they take past five minutes.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/codex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      # swtpm, the software TPM the chip holder's tests run against, and
      # CYFR_TEST_SWTPM_REQUIRED on the go test step turns the chip tests'
      # skip into a failure, so they run or fail the step.
      - name: swtpm, the software TPM the chip holder's tests run against
        run: |
          if command -v swtpm >/dev/null; then exit 0; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swtpm

      - name: go test
        # -race, as the Makefile's local invocation runs it. The total
        # coverage goes to the job summary: it is reported, never a floor,
        # so only a failing test fails the step.
        env:
          CYFR_TEST_SWTPM_REQUIRED: '1'
        run: |
          go test ./... -race -coverprofile="$RUNNER_TEMP/cover.out"
          echo "apps/codex coverage: $(go tool cover -func "$RUNNER_TEMP/cover.out" | tail -1)" >> "$GITHUB_STEP_SUMMARY"

      # These tests ask real Docker Compose how it resolves the files the
      # CLI writes or stages, and skip where `docker compose version` fails,
      # as on the macOS runner. This runner has Compose, so a skip here, or
      # a test that no longer runs, fails the step. The list is exactly the
      # tests that call requireCompose (TestComposeTestsAreTheOnesCIRequires).
      - name: go test (the Docker Compose tests ran and passed)
        env:
          COMPOSE_TESTS: TestSetupsStartRunsInTheFolderItEnteredThroughTheRealEngine TestANewCYFRSwitchesThroughTheRealEngineAndHostDocker TestRestoreKilledAtItsConfigurationReadLeavesComposeBarred TestRestoreStagedComposeResolvesAsTheDefaultOverrideSet TestRestoreStagedReadSelectsAsTheEngine TestUpRecoversAnInterruptedSwitchThroughTheRealEngine TestAccessTailnetServesAClosedHomeAgainThroughTheRealEngine TestUpStartsOnThisMachineOnlyThroughTheRealEngine TestRestoreBarKeepsAMultilineValueWithAnEscapedQuoteWhole TestUpdateRefusesBeforeTheLockAndAnyRecovery
        run: |
          set -euo pipefail
          docker compose version
          go test ./cmd/ -race -count=1 -v -run "^(${COMPOSE_TESTS// /|})\$" 2>&1 | tee "$RUNNER_TEMP/compose-tests.log"
          for t in $COMPOSE_TESTS; do grep -q -- "--- PASS: $t " "$RUNNER_TEMP/compose-tests.log" || { echo "::error::the Docker Compose test $t did not run and pass"; exit 1; }; done

      # The access engine's tests that need Docker (a container holding the
      # project's lock from another PID namespace) or Docker Compose (the
      # stack's provenance and the materialized configuration, checked by
      # the real compose), which skip without them. The list is exactly the
      # engine's tests that call requireDocker or requireCompose
      # (internal/access's TestDockerTestsAreTheOnesCIRequires).
      - name: go test (the access engine's Docker tests ran and passed)
        env:
          ACCESS_DOCKER_TESTS: TestLockExcludesAHolderInAnotherPIDNamespace TestRealComposeCallHoldsTheLock TestRealComposeCheckStackAcceptsAccessKeysThroughEnvFile TestRealComposeCheckStackRefusesAnOverrideSettingAHeadKey TestRealComposeDiagnosticsCarryNoEnvValue TestRealComposeProvenanceReadsNamesNotValues TestRealComposeRunsTheMaterializedConfiguration TestRealComposeSelectsTheStacksOwnProfiles TestEditEnvWritesALiteralDollarAndQuoteComposeReadsBack TestEditEnvWritesEveryKeyComposeReadsBack TestInterpolationReadsTheKelvinSignAsComposeDoes TestReadEnvValuesReadsAsRealComposeDoes TestRealComposeConversionDiagnosticCarriesNoEnvValue TestRealComposeDiagnosticNamesNoFileAnEnvValueNames TestRealComposeDiagnosticReadsNoTextInsideAQuotedValue TestRealComposeNoEnvSecretLeavesTheEngine
        run: |
          set -euo pipefail
          docker compose version
          go test ./internal/access/ -race -count=1 -v -run "^(${ACCESS_DOCKER_TESTS// /|})\$" 2>&1 | tee "$RUNNER_TEMP/access-docker-tests.log"
          for t in $ACCESS_DOCKER_TESTS; do grep -q -- "--- PASS: $t " "$RUNNER_TEMP/access-docker-tests.log" || { echo "::error::the access engine's Docker test $t did not run and pass"; exit 1; }; done

      - name: go build
        run: go build ./...

  test-windows:
    # The CLI ships for Windows, where the access engine's lock is LockFileEx
    # and its docker children run in a kill-on-close Job Object, the
    # platform's own, and where cyfr update hands over to the program it
    # installed as a child: the whole module vets and builds here, and the
    # access package's tests and the handover run on the real calls.
    name: vet + build + access and handover tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/codex
    steps:
      # The fixtures the tests read byte for byte stay as committed, with
      # no line ends rewritten on checkout.
      - name: Keep line ends as committed
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (the access engine)
        run: go test -race -count=1 ./internal/access/...

      # The tests that run on Windows alone, against the real LockFileEx
      # and Job Object: each must run and pass here, never skip. The list
      # is exactly the Test functions of internal/access's *_windows_test.go
      # (TestWindowsTestsAreTheOnesCIRequires).
      - name: go test (the Windows lock and job tests ran and passed)
        shell: bash
        env:
          WINDOWS_TESTS: TestReplaceFileWaitsOutAReader TestWindowsDeadlineTerminatesTheJob TestWindowsJobKillsDockerChildrenWithTheirHolder TestWindowsLockFileExFailsImmediately
        run: |
          set -euo pipefail
          go test ./internal/access/ -race -count=1 -v -run "^(${WINDOWS_TESTS// /|})\$" 2>&1 | tee "$RUNNER_TEMP/windows-tests.log"
          for t in $WINDOWS_TESTS; do grep -q -- "--- PASS: $t " "$RUNNER_TEMP/windows-tests.log" || { echo "::error::the Windows test $t did not run and pass"; exit 1; }; done

      # cyfr update's handover where a running program cannot be replaced
      # by exec: the installed program runs as a child holding the console,
      # and its status is the update's. It must run and pass here.
      - name: go test (the update's handover ran and passed)
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/ -race -count=1 -v -run '^TestUpdateHandsOverForReal$' 2>&1 | tee "$RUNNER_TEMP/handover-test.log"
          grep -q -- "--- PASS: TestUpdateHandsOverForReal " "$RUNNER_TEMP/handover-test.log" || { echo "::error::the handover test did not run and pass"; exit 1; }

      # The device folder, which keeps the device's key, made private by its
      # access list, the platform's own. It must run and pass here.
      - name: go test (the device folder's access ran and passed)
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/shell/ -race -count=1 -v -run '^TestDeviceDirKeepsAnExistingFolderPrivate$' 2>&1 | tee "$RUNNER_TEMP/device-folder-test.log"
          grep -q -- "--- PASS: TestDeviceDirKeepsAnExistingFolderPrivate " "$RUNNER_TEMP/device-folder-test.log" || { echo "::error::the device folder's access test did not run and pass"; exit 1; }

      # cyfr setup on Windows: the installed app where Windows answers the
      # account's local application folder, never where LOCALAPPDATA says,
      # and the folder forms the app takes, which this system calls
      # absolute. Each must run and pass here.
      - name: go test (cyfr setup's app and folders on Windows ran and passed)
        shell: bash
        env:
          SETUP_TESTS: TestInstalledAppPathIsTheSystems TestSetupFolderFormsAreTheSystems
        run: |
          set -euo pipefail
          go test ./cmd/ -race -count=1 -v -run "^(${SETUP_TESTS// /|})\$" 2>&1 | tee "$RUNNER_TEMP/setup-tests.log"
          for t in $SETUP_TESTS; do grep -q -- "--- PASS: $t " "$RUNNER_TEMP/setup-tests.log" || { echo "::error::the Windows test $t did not run and pass"; exit 1; }; done

      # cyfr update and uninstall of the installed app on Windows: the MSI's
      # road, which waits for the app to end, the bundle's cyfr never
      # rewritten alone, the app removed or named. Each must run and pass here.
      - name: go test (the app's update and uninstall on Windows ran and passed)
        shell: bash
        env:
          APP_TESTS: TestTheMsiRoadRefusesWhatWindowsInstallerRefuses TestTheMsiRoadStepsAsideForTheInstaller TestTheMsiRoadWaitsForTheAppToEnd TestUpdateNeverRewritesTheCyfrInsideAnAppsBundle TestUninstallNeverRemovesTheCyfrInsideAnAppsBundle TestUninstallRemovesOrNamesTheInstalledApp
        run: |
          set -euo pipefail
          go test ./cmd/ -race -count=1 -v -run "^(${APP_TESTS// /|})\$" 2>&1 | tee "$RUNNER_TEMP/app-tests.log"
          for t in $APP_TESTS; do grep -q -- "--- PASS: $t " "$RUNNER_TEMP/app-tests.log" || { echo "::error::the Windows test $t did not run and pass"; exit 1; }; done

      # cyfr restore's durable write, where a directory handle cannot be
      # flushed: the rename is written through and the write answers no
      # error. It must run and pass here.
      - name: go test (the restore's durable write ran and passed)
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/ -race -count=1 -v -run '^TestWriteDurable_ReplacesTheFileOnEveryPlatform$' 2>&1 | tee "$RUNNER_TEMP/durable-test.log"
          grep -q -- "--- PASS: TestWriteDurable_ReplacesTheFileOnEveryPlatform " "$RUNNER_TEMP/durable-test.log" || { echo "::error::the restore's durable write test did not run and pass"; exit 1; }

      # cyfr init and update write the scaffold, and the update's snapshot
      # reads it, through one os.Root of the project, which on Windows is
      # the platform's handle-relative opens: a folder linked outside the
      # project refuses, one linked inside is followed, and update's rollback
      # removes nothing through the first. A test or case skips where no
      # symbolic link can be made, so each must run and pass here and none
      # may skip.
      - name: go test (the scaffold's folder links ran and passed)
        shell: bash
        run: |
          set -euo pipefail
          LINK_TESTS="TestWriteRefusesAFolderLinkedOutside TestWriteFollowsAFolderLinkThatStaysInside TestWriteRefusesALinkTheRootDoesNotFollow TestSnapshotReadsNoScaffoldFileThroughAFolderLinkedOutside TestInitStopsOnAFolderLinkedOutside TestRollbackRemovesNoScaffoldFileThroughAFolderLinkedOutside"
          go test ./internal/scaffold/ ./cmd/ -race -count=1 -v -run "^(${LINK_TESTS// /|})\$" 2>&1 | tee "$RUNNER_TEMP/link-tests.log"
          for t in $LINK_TESTS; do grep -q -- "--- PASS: $t " "$RUNNER_TEMP/link-tests.log" || { echo "::error::the scaffold link test $t did not run and pass"; exit 1; }; done
          if grep -- "--- SKIP: " "$RUNNER_TEMP/link-tests.log"; then echo "::error::a scaffold link test or case skipped"; exit 1; fi

  test-macos:
    # The CLI ships for macOS; this runs its checks on the platform's own
    # filesystem, process and trust-store behavior.
    name: vet + test (macOS)
    runs-on: macos-latest
    # The suite on this runner is long, not stuck: its go test step takes
    # about 8 minutes and up to 9.5 on a slow runner, cmd's tests, which run
    # one after another, about 7 of them. 15 minutes leaves the step half
    # again its slowest passing run.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/codex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

  screen-idle:
    # The device screen's five minutes are of input alone: under Ubuntu
    # 26.04's labwc, a page or a sandboxed frame playing a video a tap started,
    # in the CYFR app's engine (Electron at the version its package pins),
    # does not hold its lock off, where swayidle's ordinary timeout is held
    # off; and the screen takes swayidle for a suspend watch only once it
    # subscribed to sleep and answered (tests/desktop-proof/screen/idle.sh).
    name: The screen's idle lock (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # The packages, Electron's download and five cases of half a minute at most.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux amd64, os: ubuntu-24.04}
          - {name: Linux arm64, os: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum

      - name: A page that plays does not hold the lock off
        run: bash tests/desktop-proof/screen/idle.sh

  release-rehearsal:
    # GoReleaser's release on .goreleaser.yml with stand-ins for the five
    # installers, the scaffold and the manifest, publishing nothing
    # (tests/ci-release-rehearsal.sh): the installers are summed by their
    # digests, and a missing one fails before any upload. The GoReleaser
    # is release.yml's (tests/ci-release-graph.py holds it so).
    name: The release's packaging rehearsed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: 'v2.18.3'
          install-only: true

      - name: Rehearse the release's packaging
        run: bash tests/ci-release-rehearsal.sh

  desktop-native:
    # The CYFR app, Electron around this module's cyfr, on each platform it
    # ships for: its unit tests, then its package built for this runner
    # from the tree's cyfr, installed as a person installs it, and the
    # home-free smoke (tests/desktop-proof/native/smoke.sh) run against the
    # installed app with no CYFR server and no signing credentials; on
    # macOS the distribution's signing rehearsed with a self-made identity
    # (tests/desktop-proof/native/mac-rehearsal.sh) and the cask the
    # release writes installed, upgraded and removed through a local tap
    # (tests/desktop-proof/native/brew-tap.sh), on Windows the MSI's cyfr
    # on the person's PATH and off it again after the uninstall; then the
    # installed app's update from one release to the next
    # (tests/desktop-proof/native/update.sh).
    name: CYFR app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Electron's download and the packages' builds, three of them with the
    # update's two releases, take most of it. The steps that have run to this
    # limit on Windows and left no log (the smoke, the uninstall, the
    # update's two) each have a limit of their own, far above what they take
    # (under half a minute, and seven minutes for the update), so one that
    # stalls ends as a failed step with its log and its name.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 26.04, the box's own, whose AppArmor holds the profile
          # bwrap runs Gtk's image loaders under (the screen step).
          - {name: Linux amd64, os: ubuntu-26.04, arch: amd64, exe: ''}
          - {name: Linux arm64, os: ubuntu-26.04-arm, arch: arm64, exe: ''}
          - {name: macOS arm64, os: macos-latest, arch: arm64, exe: ''}
          - {name: Windows amd64, os: windows-latest, arch: amd64, exe: .exe}
          - {name: Windows arm64, os: windows-11-arm, arch: arm64, exe: .exe}
    defaults:
      run:
        shell: bash
    steps:
      # The smoke runs under Git Bash on Windows, which reads a script with
      # rewritten line ends as other commands.
      - name: Keep line ends as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum

      # Node 24, the runtime every pinned action runs on.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/codex/desktop/package-lock.json

      - name: Build cyfr for this runner
        working-directory: apps/codex
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/cyfr/cyfr${{ matrix.exe }}" .

      # The app's build tools as package-lock.json pins them, with no
      # install script run: electron-builder fetches Electron itself.
      - name: The app's unit tests
        working-directory: apps/codex/desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

      # The package guard (scripts/check-package.mjs) runs inside the build
      # and fails it on a package that is not exactly the staged app.
      - name: Build the app's package
        working-directory: apps/codex/desktop
        run: node scripts/build.mjs --cyfr "$RUNNER_TEMP/cyfr/cyfr${{ matrix.exe }}" --version 0.0.0-ci --arch ${{ matrix.arch }}

      # The script release.yml runs on the package it publishes.
      - name: Install and smoke the app (Linux)
        if: runner.os == 'Linux'
        run: bash tests/desktop-proof/native/linux.sh apps/codex/desktop/dist/cyfr-desktop_0.0.0-ci_linux_${{ matrix.arch }}.deb

      # The app as the box's screen, under Ubuntu 26.04's labwc in a
      # container (tests/desktop-proof/screen/app.sh).
      - name: The app as the box's screen (Linux)
        if: runner.os == 'Linux'
        run: bash tests/desktop-proof/screen/app.sh apps/codex/desktop/dist/cyfr-desktop_0.0.0-ci_linux_${{ matrix.arch }}.deb

      # The cask the release writes, from this package and a second one,
      # installed, upgraded and removed through a local tap.
      - name: Build a second package (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/codex/desktop
        run: node scripts/build.mjs --cyfr "$RUNNER_TEMP/cyfr/cyfr" --version 0.0.1-ci --arch ${{ matrix.arch }}

      - name: The Homebrew cask (macOS)
        if: runner.os == 'macOS'
        run: bash tests/desktop-proof/native/brew-tap.sh 0.0.0-ci apps/codex/desktop/dist/cyfr-desktop_0.0.0-ci_darwin_arm64.dmg 0.0.1-ci apps/codex/desktop/dist/cyfr-desktop_0.0.1-ci_darwin_arm64.dmg

      # The scripts release.yml and desktop-mac.yml run on the packages
      # they publish.
      - name: Install and smoke the app (macOS)
        if: runner.os == 'macOS'
        run: bash tests/desktop-proof/native/mac.sh apps/codex/desktop/dist/cyfr-desktop_0.0.0-ci_darwin_${{ matrix.arch }}.dmg

      - name: Install the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File tests/desktop-proof/native/windows.ps1 install apps/codex/desktop/dist/cyfr-desktop_0.0.0-ci_windows_${{ matrix.arch }}.msi

      - name: Smoke the installed app (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: bash tests/desktop-proof/native/smoke.sh "$APP"

      # Read from each file's header, the way release.yml reads the
      # installers it publishes: an amd64 app passes the smoke on an arm64
      # runner under emulation.
      - name: The installed app is built for this architecture
        run: |
          case "$RUNNER_OS" in
            Linux) set -- /opt/cyfr/CYFR /usr/bin/cyfr ;;
            macOS) set -- /Applications/CYFR.app/Contents/MacOS/CYFR /Applications/CYFR.app/Contents/Resources/cyfr ;;
            Windows) set -- "$APP" "$CYFR" ;;
          esac
          bash tests/desktop-proof/native/installed-machine.sh ${{ matrix.arch }} "$@"

      - name: Uninstall the app (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: pwsh -NoProfile -File tests/desktop-proof/native/windows.ps1 remove apps/codex/desktop/dist/cyfr-desktop_0.0.0-ci_windows_${{ matrix.arch }}.msi

      # A second build, signed for distribution with an identity and
      # profile of the rehearsal's own making: no Apple input is in a pull
      # request's run.
      - name: Rehearse the Mac distribution
        if: runner.os == 'macOS'
        run: bash tests/desktop-proof/native/mac-rehearsal.sh "$RUNNER_TEMP/cyfr/cyfr"

      # The installed app updated from release A to B by its own cyfr, as a
      # person runs cyfr update, then by Update CYFR in its window, which
      # xdotool presses on Linux (tests/desktop-proof/native/update.sh);
      # last, as it leaves B installed (on Linux, removed after the update
      # service's checks). On Linux the releases lie where the service's
      # unit, which sees no /home and a /tmp of its own, reads them as root.
      # In two steps, each with its own limit: the releases built, then the
      # update run, so a stall names which of the two it was in.
      - name: Build the update proof's releases
        timeout-minutes: 15
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y --no-install-recommends xdotool >/dev/null
            sudo install -d -o "$(id -un)" /srv/update-proof
            bash tests/desktop-proof/native/update.sh build /srv/update-proof ${{ matrix.arch }}
          else
            bash tests/desktop-proof/native/update.sh build "$RUNNER_TEMP/update-proof" ${{ matrix.arch }}
          fi

      - name: The app's update from one release to the next
        timeout-minutes: 15
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a bash tests/desktop-proof/native/update.sh run /srv/update-proof
          else
            bash tests/desktop-proof/native/update.sh run "$RUNNER_TEMP/update-proof"
          fi
