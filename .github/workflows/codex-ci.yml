name: Codex CI (cyfr CLI)

# Vet, test, and build the Go CLI on every change. security.yml only runs
# govulncheck; this gives the CLI a real green-build + test signal at PR time.

on:
  push:
    branches: [main]
    paths:
      - 'apps/codex/**'
      # TestRenderEnvFileShippedTemplate binds `cyfr init` to the shipped
      # template, TestSharedFixtureVerdicts binds internal/ref to the
      # shared component-ref fixture, and TestBundledPromptsMatchSeed binds
      # the scaffold's role and scroll rosters to seed/aqua — an edit
      # to any of them must run the Go tests.
      - '.env.example'
      # TestShippedComposePullsTheLocusImageOnce reads the shipped compose
      # file's Locus services, with the builds URL .env.example offers,
      # TestMissingStackServices its service roster, and
      # TestUpdateLeavesShippedComposeAlone its cyfr service's fields.
      - 'docker-compose.yml'
      # TestEntrypointRefusesWhileTheRestoreIsBarred runs the image's
      # entrypoint against the restore's bar (tests/fixtures/restore_barrier.json).
      - 'docker-entrypoint.sh'
      - 'tests/fixtures/**'
      - 'seed/aqua/**'
      # TestShippedGuidesAreManaged reads the tarball's ITEMS list.
      - 'scripts/scaffold-tarball.sh'
      # TestReadmeCLITablesAreTheCommandTree reads the README's CLI tables.
      - 'README.md'
      # TestPostgresClientImagesArePinned holds the PostgreSQL client pins
      # to the service image test.yml runs.
      - '.github/workflows/test.yml'
      - '.github/workflows/codex-ci.yml'
  pull_request:
    paths:
      - 'apps/codex/**'
      - '.env.example'
      - 'docker-compose.yml'
      - 'docker-entrypoint.sh'
      - 'tests/fixtures/**'
      - 'seed/aqua/**'
      - 'scripts/scaffold-tarball.sh'
      - 'README.md'
      - '.github/workflows/test.yml'
      - '.github/workflows/codex-ci.yml'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: codex-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: vet + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/codex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go test
        # -race matches the Makefile's local invocation — the stricter run
        # was the one CI didn't do. The total coverage goes to the job
        # summary: it is reported, never a floor, so only a failing test
        # fails the step.
        run: |
          go test ./... -race -coverprofile="$RUNNER_TEMP/cover.out"
          echo "apps/codex coverage: $(go tool cover -func "$RUNNER_TEMP/cover.out" | tail -1)" >> "$GITHUB_STEP_SUMMARY"

      # These tests ask real Docker Compose how it resolves the files the
      # CLI writes or stages, and skip where `docker compose version` fails,
      # as on the macOS runner. This runner has Compose, so a skip here, or
      # a test that no longer runs, fails the step. The list is exactly the
      # tests that call requireCompose (TestComposeTestsAreTheOnesCIRequires).
      - name: go test (the Docker Compose tests ran and passed)
        env:
          COMPOSE_TESTS: TestEnsureCyfrComposeFieldsAddsNothingWhenAMergeKeyBindsBothTargets TestEnsureComposeFieldsCopiesASharedAnchorBeforeAddingADefault TestInitSwitchesThroughTheRealEngineAndHostDocker TestRestoreKilledAtItsConfigurationReadLeavesComposeBarred TestRestoreStagedComposeResolvesAsTheDefaultOverrideSet TestRestoreStagedReadSelectsAsTheEngine TestUpRecoversAnInterruptedSwitchThroughTheRealEngine TestAccessTailnetServesAClosedHomeAgainThroughTheRealEngine TestUpStartsOnThisMachineOnlyThroughTheRealEngine TestRestoreBarKeepsAMultilineValueWithAnEscapedQuoteWhole
        run: |
          set -euo pipefail
          docker compose version
          go test ./cmd/ -race -count=1 -v -run "^(${COMPOSE_TESTS// /|})\$" 2>&1 | tee "$RUNNER_TEMP/compose-tests.log"
          for t in $COMPOSE_TESTS; do grep -q -- "--- PASS: $t " "$RUNNER_TEMP/compose-tests.log" || { echo "::error::the Docker Compose test $t did not run and pass"; exit 1; }; done

      # The access engine's tests that need Docker (a container holding the
      # project's lock from another PID namespace) or Docker Compose (the
      # stack's provenance and the materialized configuration, checked by
      # the real compose), which skip without them. The list is exactly the
      # engine's tests that call requireDocker or requireCompose
      # (internal/access's TestDockerTestsAreTheOnesCIRequires).
      - name: go test (the access engine's Docker tests ran and passed)
        env:
          ACCESS_DOCKER_TESTS: TestLockExcludesAHolderInAnotherPIDNamespace TestRealComposeCallHoldsTheLock TestRealComposeCheckStackAcceptsAccessKeysThroughEnvFile TestRealComposeCheckStackRefusesAnOverrideSettingAHeadKey TestRealComposeDiagnosticsCarryNoEnvValue TestRealComposeProvenanceReadsNamesNotValues TestRealComposeRunsTheMaterializedConfiguration TestEditEnvWritesALiteralDollarAndQuoteComposeReadsBack TestEditEnvWritesEveryKeyComposeReadsBack TestInterpolationReadsTheKelvinSignAsComposeDoes TestReadEnvValuesReadsAsRealComposeDoes TestRealComposeConversionDiagnosticCarriesNoEnvValue TestRealComposeDiagnosticNamesNoFileAnEnvValueNames TestRealComposeDiagnosticReadsNoTextInsideAQuotedValue TestRealComposeNoEnvSecretLeavesTheEngine
        run: |
          set -euo pipefail
          docker compose version
          go test ./internal/access/ -race -count=1 -v -run "^(${ACCESS_DOCKER_TESTS// /|})\$" 2>&1 | tee "$RUNNER_TEMP/access-docker-tests.log"
          for t in $ACCESS_DOCKER_TESTS; do grep -q -- "--- PASS: $t " "$RUNNER_TEMP/access-docker-tests.log" || { echo "::error::the access engine's Docker test $t did not run and pass"; exit 1; }; done

      - name: go build
        run: go build ./...

  test-windows:
    # The CLI ships for Windows, where the access engine's lock is LockFileEx
    # and its docker children run in a kill-on-close Job Object, the
    # platform's own, and where cyfr update hands over to the program it
    # installed as a child: the whole module vets and builds here, and the
    # access package's tests and the handover run on the real calls.
    name: vet + build + access and handover tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/codex
    steps:
      # The fixtures the tests read byte for byte stay as committed, with
      # no line ends rewritten on checkout.
      - name: Keep line ends as committed
        working-directory: .
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (the access engine)
        run: go test -race -count=1 ./internal/access/...

      # The tests that run on Windows alone, against the real LockFileEx
      # and Job Object: each must run and pass here, never skip. The list
      # is exactly the Test functions of internal/access's *_windows_test.go
      # (TestWindowsTestsAreTheOnesCIRequires).
      - name: go test (the Windows lock and job tests ran and passed)
        shell: bash
        env:
          WINDOWS_TESTS: TestWindowsDeadlineTerminatesTheJob TestWindowsJobKillsDockerChildrenWithTheirHolder TestWindowsLockFileExFailsImmediately
        run: |
          set -euo pipefail
          go test ./internal/access/ -race -count=1 -v -run "^(${WINDOWS_TESTS// /|})\$" 2>&1 | tee "$RUNNER_TEMP/windows-tests.log"
          for t in $WINDOWS_TESTS; do grep -q -- "--- PASS: $t " "$RUNNER_TEMP/windows-tests.log" || { echo "::error::the Windows test $t did not run and pass"; exit 1; }; done

      # cyfr update's handover where a running program cannot be replaced
      # by exec: the installed program runs as a child holding the console,
      # and its status is the update's. It must run and pass here.
      - name: go test (the update's handover ran and passed)
        shell: bash
        run: |
          set -euo pipefail
          go test ./cmd/ -race -count=1 -v -run '^TestUpdateHandsOverForReal$' 2>&1 | tee "$RUNNER_TEMP/handover-test.log"
          grep -q -- "--- PASS: TestUpdateHandsOverForReal " "$RUNNER_TEMP/handover-test.log" || { echo "::error::the handover test did not run and pass"; exit 1; }

  test-macos:
    # The CLI ships for macOS; this runs its checks on the platform's own
    # filesystem, process and trust-store behavior.
    name: vet + test (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/codex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...
