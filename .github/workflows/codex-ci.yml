name: Codex CI (cyfr CLI)

# Vet, test, and build the Go CLI on every change. security.yml only runs
# govulncheck; this gives the CLI a real green-build + test signal at PR time.

on:
  push:
    branches: [main]
    paths:
      - 'apps/codex/**'
      # TestRenderEnvFileShippedTemplate binds `cyfr init` to the shipped
      # template, and TestSharedFixtureVerdicts binds internal/ref to the
      # shared component-ref fixture — an edit to either must run the Go
      # tests.
      - '.env.example'
      - 'tests/fixtures/**'
      - '.github/workflows/codex-ci.yml'
  pull_request:
    paths:
      - 'apps/codex/**'
      - '.env.example'
      - 'tests/fixtures/**'
      - '.github/workflows/codex-ci.yml'

permissions:
  contents: read

jobs:
  test:
    name: vet + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/codex
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go test
        # -race matches the Makefile's local invocation — the stricter run
        # was the one CI didn't do.
        run: go test ./... -race

      - name: go build
        run: go build ./...
