name: Locus image on arm64

# The Locus image built and proved natively on arm64 in a pull request that
# changes what the image carries: Dockerfile.locus and the archive key's
# guard its upgrade layer runs (scripts/apt-key.sh), the keeper and the
# drivers it builds (apps/locus/keeper), the browser suite that proves
# them and this build's own definition. test.yml builds and proves the image on amd64 in every
# run, and release.yml again on both architectures before it publishes;
# this job publishes nothing and writes no cache.

on:
  pull_request:
    paths:
      - 'Dockerfile.locus'
      - 'scripts/apt-key.sh'
      - 'apps/locus/keeper/**'
      - 'tests/locus-backends-image/browser.py'
      - '.github/actions/image-build/**'
      - '.github/workflows/locus-arm64.yml'

permissions:
  contents: read

concurrency:
  group: locus-arm64-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pinned-programs:
    name: Aqua's browser on arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the Locus image
        uses: ./.github/actions/image-build
        with:
          image: locus
          write: 'false'
      # browser.py --first-start: the image holds the headless shell built
      # for arm64, which starts with no public host, a person's node and
      # cyfr-stub never run in CYFR's place, and a public page loads at the
      # browser's first start.
      - name: Aqua's browser is in the image and loads a page
        run: python3 tests/locus-backends-image/browser.py --first-start cyfr-locus:ci
      # What the image holds on arm64, and the last release's image beside
      # it when the registry answers: read only, nothing is pushed.
      - name: What the image holds
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          held() { docker run --rm --entrypoint sh "$1" -c \
            'echo "$(du -sxm / 2>/dev/null | cut -f1) MiB in all; $(du -sm /usr/lib/chromium 2>/dev/null | cut -f1) MiB of /usr/lib/chromium"'; }
          echo "this image: $(held cyfr-locus:ci)"
          release="$(gh api "repos/$REPOSITORY/releases?per_page=1" --jq '.[0].tag_name' 2>/dev/null || true)"
          if [ -n "$release" ] && docker pull -q --platform linux/arm64 "ghcr.io/cyfrworks/cyfr-locus:$release" >/dev/null 2>&1; then
            echo "release $release's image: $(held "ghcr.io/cyfrworks/cyfr-locus:$release")"
          else
            echo "the last release's image could not be pulled (${release:-no release named})"
          fi
