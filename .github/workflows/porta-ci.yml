name: Node CI (A.Q.U.A. PWA + mcp-bridge)

# Typecheck + build the Porta / A.Q.U.A. PWA on every change so breakage is
# caught at PR time, not at release time (porta.yml only builds the image on tags).
# `npm run build` is `tsc -b && vite build`, so it covers the TypeScript check.
# Both Node projects also run `npm audit` (report-only) so dependency advisories
# are surfaced — the Elixir/Go supply-chain gate (security.yml) never saw them.

on:
  push:
    branches: [main]
    paths:
      - 'apps/porta/src-ui/**'
      - 'apps/mcp-bridge/**'
      - '.github/workflows/porta-ci.yml'
  pull_request:
    paths:
      - 'apps/porta/src-ui/**'
      - 'apps/mcp-bridge/**'
      - '.github/workflows/porta-ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: Typecheck + build (PWA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/porta/src-ui
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/porta/src-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build (tsc -b && vite build)
        run: npm run build

      # Report-only for now: surfaces high/critical advisories without blocking
      # unrelated PRs on a transitive issue. Promote to a hard gate once clean.
      - name: Audit dependencies (report-only)
        continue-on-error: true
        run: npm audit --audit-level=high

  mcp-bridge:
    name: Check + smoke (mcp-bridge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mcp-bridge
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/mcp-bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.mjs

      # Boot the bridge with a token and assert the two security-load-bearing
      # behaviours: /health answers open, and /mcp refuses a missing/wrong
      # bearer. Also assert the fail-closed boot: no token => exit 1.
      - name: Smoke test
        run: |
          set -euo pipefail
          export MCP_BRIDGE_TOKEN=ci-smoke-token MCP_BRIDGE_DATA="$RUNNER_TEMP/backends.json"
          node server.mjs &
          BRIDGE_PID=$!
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8001/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8001/health
          body='{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}}}'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8001/mcp \
            -H 'content-type: application/json' \
            -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/list' \
            -d "$body")
          [ "$code" = "401" ] || { echo "expected 401 without bearer, got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8001/mcp \
            -H 'content-type: application/json' -H 'authorization: Bearer ci-smoke-token' \
            -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/list' \
            -d "$body")
          [ "$code" = "200" ] || { echo "expected 200 with bearer, got $code"; exit 1; }
          kill "$BRIDGE_PID"
          if MCP_BRIDGE_TOKEN= MCP_BRIDGE_DATA="$RUNNER_TEMP/backends2.json" node server.mjs; then
            echo "bridge booted without a token — fail-closed boot is broken"
            exit 1
          fi

      - name: Audit dependencies (report-only)
        continue-on-error: true
        run: npm audit --audit-level=high
