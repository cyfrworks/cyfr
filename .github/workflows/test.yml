name: Test
on:
  push:
    branches: [main]
    paths:
      - 'apps/cyfr/**'
      - 'apps/opus/**'
      - 'apps/locus/**'
      - 'config/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.github/workflows/test.yml'
      # Compile-embedded (@external_resource) into compendium/mcp/aqua_tool.ex.
      - 'component-guide.md'
      - 'tincture-guide.md'
      - 'integration-guide.md'
      # Release-critical surfaces with no workflow of their own: run the
      # suite so a change here at least builds against a green tree.
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'docker-entrypoint.sh'
      - '.env.example'
      - 'wit/**'
      - 'aqua/**'
      # Surfaces the vocabulary gate scans: it cannot turn red on a change it
      # never runs on.
      - 'apps/codex/**'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    paths:
      - 'apps/cyfr/**'
      - 'apps/opus/**'
      - 'apps/locus/**'
      - 'config/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.github/workflows/test.yml'
      # Compile-embedded (@external_resource) into compendium/mcp/aqua_tool.ex.
      - 'component-guide.md'
      - 'tincture-guide.md'
      - 'integration-guide.md'
      # Release-critical surfaces with no workflow of their own: run the
      # suite so a change here at least builds against a green tree.
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'docker-entrypoint.sh'
      - '.env.example'
      - 'wit/**'
      - 'aqua/**'
      # Surfaces the vocabulary gate scans: it cannot turn red on a change it
      # never runs on.
      - 'apps/codex/**'
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - '.gitignore'
      - '.dockerignore'
permissions:
  contents: read
env:
  MIX_ENV: test
  ERL_CRASH_DUMP_SECONDS: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    name: Elixir Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    # Both adapters must stay green. SQLite is the shipped default; Postgres is
    # bring-your-own. The data layer is Ecto-schema-backed so column values cast
    # to the same Elixir types on both, and both legs are blocking.
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      # Test-only ephemeral database — these credentials (and CYFR_SECRET_KEY_BASE
      # below) are non-secret CI fixtures for the Postgres container, never used
      # outside CI.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cyfr
          POSTGRES_PASSWORD: cyfr
          POSTGRES_DB: cyfr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CYFR_DATABASE: ${{ matrix.db }}
      CYFR_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://cyfr:cyfr@localhost:5432/cyfr_test' || '' }}
      CYFR_SECRET_KEY_BASE: ${{ matrix.db == 'postgres' && 'JspnK9M8XQE1HFBRZWuzJqK8ZX8ITp5vPQ6MJv2RmFfKpGr2fEhAgSf3UqBT5xTk' || '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        id: beam
        with:
          otp-version: '28'
          elixir-version: '1.19.5'
      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.db }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.db }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - name: Cache cargo-component
        id: cargo-component-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-component
          key: ${{ runner.os }}-cargo-component-0.21.1
      # Locus's compile-path tests are tagged :requires_cargo_component and
      # excluded when the binary is absent — install it so they actually run.
      # The runner ships rustup; only the wasm targets and the tool are added.
      - name: Install cargo-component
        run: |
          rustup target add wasm32-wasip1 wasm32-wasip2
          if [ "${{ steps.cargo-component-cache.outputs.cache-hit }}" != "true" ]; then
            cargo install cargo-component --version 0.21.1 --locked
          fi
          cargo-component --version
      - name: Install dependencies
        run: mix deps.get
      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors
      - name: Static analysis
        run: mix credo --only=warning
      - name: Check formatting
        run: mix format --check-formatted
      - name: Run tests
        run: mix test

  arca-seam:
    name: Arca single-seam (no untagged filesystem I/O)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Arca.Storage's single-seam policy: all file/blob I/O flows through the
      # storage adapter. A direct File.* / Path.wildcard call outside the adapter
      # must be acknowledged with an `# arca:bypass-ok=<A|B|C|D>` tag (see the
      # bypass-group table in Arca.Storage). This asserts every file that makes
      # such a call carries a tag, so a new module cannot silently bypass the
      # object-store seam.
      - name: Assert direct filesystem calls are tagged
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r f; do
            case "$f" in
              */arca/adapters/*) continue ;;
              apps/cyfr/lib/arca/storage.ex) continue ;;
            esac
            calls="$(grep -nE '(^|[^A-Za-z0-9_.])File\.[a-z]|Path\.wildcard' "$f" | grep -v '^[0-9]*: *#' || true)"
            if [ -n "$calls" ] && ! grep -q 'arca:bypass-ok' "$f"; then
              echo "::error file=$f::direct filesystem I/O without an arca:bypass-ok tag (see Arca.Storage single-seam policy)"
              echo "$calls"
              fail=1
            fi
          done < <(git ls-files 'apps/cyfr/lib/*.ex' 'apps/cyfr/lib/**/*.ex' 'apps/opus/lib/*.ex' 'apps/opus/lib/**/*.ex' 'apps/locus/lib/*.ex' 'apps/locus/lib/**/*.ex')
          if [ "$fail" -ne 0 ]; then
            echo "Untagged filesystem I/O found. Route it through Arca, or tag it # arca:bypass-ok=<A|B|C|D>."
            exit 1
          fi

  config-seam:
    name: Config keys (no compile-time/runtime split)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # A key read with `Application.compile_env` is frozen when the module is
      # compiled; the same key read or written at runtime elsewhere silently
      # disagrees with it. That is invisible until something behaves one way in
      # one place and another way somewhere else — the shape that had a test
      # asserting against a registry host the code under test never used.
      #
      # A key that genuinely needs both — Ecto cannot swap adapters at runtime;
      # a test that generates its cases from a roster must read that roster at
      # compile time — says so with `# config:compile-runtime-ok` on every one
      # of its compile_env lines.
      - name: Keys read at compile time must not also be read at runtime
        run: |
          set -uo pipefail
          keys="$(mktemp)"
          failures="$(mktemp)"
          git grep -hoE 'compile_env\(:cyfr, *:[a-z_0-9]+' -- 'apps/**/*.ex' 'apps/**/*.exs' \
            | sed 's/.*:cyfr, *://' | sort -u > "$keys"

          while IFS= read -r key; do
            [ -n "$key" ] || continue
            # Exempt when every file that compile_env's this key carries the
            # tag, the same file-level shape the arca-seam job uses.
            untagged=$(git grep -lE "compile_env\(:cyfr, *:${key}[^a-z_0-9]" -- 'apps/**/*.ex' 'apps/**/*.exs' \
              | while IFS= read -r f; do
                  grep -q 'config:compile-runtime-ok' "$f" || echo "$f"
                done)
            [ -z "$untagged" ] && continue

            runtime=$(git grep -nE "Application\.(get_env|fetch_env!?|put_env)\(:cyfr, *:${key}[^a-z_0-9]" -- 'apps/**/*.ex' 'apps/**/*.exs' || true)
            if [ -n "$runtime" ]; then
              echo "::error::config key :${key} is read with compile_env AND at runtime — one of them will be stale" >> "$failures"
              echo "$runtime" >> "$failures"
            fi
          done < "$keys"

          if [ -s "$failures" ]; then
            cat "$failures"
            echo "Read the key one way, or tag every compile_env line for it # config:compile-runtime-ok with the reason."
            exit 1
          fi

  vocabulary-gate:
    name: No org/project fossils (one tenancy vocabulary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The tenancy unit is the athanor and nothing else. This asserts the old
      # org/project vocabulary — identifiers, modules, scope atoms, env vars,
      # ports — cannot creep back into code, config, or operator-facing docs.
      # Free-word "org"/"project" is deliberately not gated (OCI annotations,
      # Mix.Project, Go module paths, "project directory" prose are legitimate).
      - name: Tier A/B fossil patterns must be absent
        run: |
          set -uo pipefail
          paths='apps config wit scripts tests Caddyfile docker-compose.yml Dockerfile Dockerfile.node Dockerfile.runner-base docker-entrypoint.sh .env.example .gitignore .dockerignore README.md CLAUDE.md CONTRIBUTING.md component-guide.md integration-guide.md tincture-guide.md'
          excl=':(exclude)docs/** :(exclude)**/node_modules/** :(exclude)**/package-lock.json :(exclude)**/priv/static/**'
          fail=0
          for p in \
            '\borg_id\b' \
            '\bproject_id\b' \
            '\bnormalize_(org|project|athanor)_id\b' \
            '\bscope_type\b' \
            '\bno_org\b' \
            '\buser_active_in_org\?' \
            'Arca\.Schemas\.(Org|Project)\b' \
            'Sanctum\.Tenancy\.(Orgs|Projects|Memberships)\b' \
            'Compendium\.ProjectSeeder\b' \
            'Sanctum\.TenantScope\b' \
            'Arca\.Tenant\b' \
            'default_athanor' \
            'cyfr\.consent\.bootstrap' \
            ':org([^a-z_]|$)' \
            ':project([^a-z_]|$)' \
            'PrismWeb\.Endpoint\b' \
            'Prism\.AuthExchange\b' \
            'PrismWeb\.LiveClaimGate\b' \
            'CYFR_PRISM_' \
            'PrismWeb\.AquaLive\b' \
            'Prism\.AquaConversations\b' \
            ':aqua_path\b' \
            ':4001\b|4001:4001' \
            'CYFR_PORTA_' \
            'cyfr-porta' \
            'apps/porta/' \
            ; do
            hits="$(git grep -InE "$p" -- $paths $excl || true)"
            if [ -n "$hits" ]; then
              echo "::error::fossil pattern $p"
              echo "$hits"
              fail=1
            fi
          done
          # Positive assertions on the shape the patterns protect.
          m=apps/cyfr/priv/repo/migrations/20260815000000_baseline.exs
          nullable="$(grep -cE 'add :athanor_id' "$m")"
          notnull="$(grep -cE 'add :athanor_id.*null: false' "$m")"
          if [ "$((nullable - notnull))" -ne 2 ]; then
            echo "::error::exactly two nullable athanor_id columns are allowed (memberships, sessions); found $((nullable - notnull))"; fail=1
          fi
          if grep -nE 'add :athanor_id.*default:' "$m"; then
            echo "::error::athanor_id column with a default — a forgotten athanor must fail, not land in Home"; fail=1
          fi
          if [ "$(grep -c 'COALESCE(athanor_id' "$m")" -ne 1 ]; then
            echo "::error::expected exactly one COALESCE(athanor_id (the membership assignment index)"; fail=1
          fi
          if ! grep -q '^!components/_bundle/$' .gitignore || grep -q 'components/\*/\*/' .gitignore; then
            echo "::error::.gitignore must keep components/_bundle/ and no two-segment components glob"; fail=1
          fi
          # The template `cyfr init` writes must agree with the repo's own.
          if ! grep -q '!components/_bundle/' apps/codex/cmd/lifecycle.go || grep -q 'components/\*/\*/' apps/codex/cmd/lifecycle.go; then
            echo "::error::lifecycle.go .gitignore template must keep components/_bundle/ and no two-segment glob"; fail=1
          fi
          # Operator-facing docs describe the athanor layout, not the old two-segment one.
          docs_hits="$(git grep -InE 'components/local/default|/t/:publisher/|/t/<publisher>/' -- README.md component-guide.md integration-guide.md tincture-guide.md .env.example || true)"
          if [ -n "$docs_hits" ]; then
            echo "::error::guides still describe the pre-athanor layout"; echo "$docs_hits"; fail=1
          fi
          if git ls-files 'components/*' | grep -v '^components/_bundle/'; then
            echo "::error::tracked components outside components/_bundle/"; fail=1
          fi
          exit $fail
