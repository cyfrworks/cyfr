name: Test
on:
  push:
    branches: [main]
    paths:
      # Every app: the Elixir suite also pins the CLI's grammar and the
      # stack's shape (ClientProtocolDriftTest, StackShapeTest).
      - 'apps/**'
      - 'config/**'
      - 'mix.exs'
      - 'mix.lock'
      # The formatting check reads it.
      - '.formatter.exs'
      # The static analysis reads the first two; the Dialyzer filters' reason
      # test reads the third.
      - '.credo.exs'
      - '.credo_baseline.exs'
      - '.dialyzer_ignore.exs'
      # Every workflow: the drift test, the tag pipeline's graph check
      # (tests/ci-release-graph.py) and its publication test
      # (tests/ci-publish-test.sh) read release.yml, and the retired-
      # settings test scans them all; the image scans read .trivyignore.yaml
      # and trivy-secret.yaml.
      - '.github/workflows/*.yml'
      # The setup-elixir action every BEAM job here runs.
      - '.github/actions/**'
      - '.trivyignore.yaml'
      - 'trivy-secret.yaml'
      # Compile-embedded (@external_resource) into compendium/providers/aqua.ex.
      - 'component-guide.md'
      - 'tincture-guide.md'
      - 'integration-guide.md'
      # Rendered from the settings roster; the guide check and the drift test
      # read it.
      - 'configuration-guide.md'
      # Shipped beside the others; the drift and vocabulary tests read them.
      - 'identity-guide.md'
      - 'devices-guide.md'
      # Release-critical surfaces with no workflow of their own: run the
      # suite so a change here at least builds against a green tree.
      - 'Dockerfile*'
      # Dockerfile.locus installs the Rust release it names, so the Locus
      # image jobs rebuild on a change to it.
      - 'rust-toolchain.toml'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'docker-entrypoint.sh'
      - '.env.example'
      # The services' env examples: the stack shape test reads them and the
      # scaffold tarball ships them.
      - '.env.*.example'
      - 'wit/**'
      - 'seed/**'
      # Surfaces the vocabulary gate scans: it cannot turn red on a change it
      # never runs on.
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    paths:
      # Every app: the Elixir suite also pins the CLI's grammar and the
      # stack's shape (ClientProtocolDriftTest, StackShapeTest).
      - 'apps/**'
      - 'config/**'
      - 'mix.exs'
      - 'mix.lock'
      # The formatting check reads it.
      - '.formatter.exs'
      # The static analysis reads the first two; the Dialyzer filters' reason
      # test reads the third.
      - '.credo.exs'
      - '.credo_baseline.exs'
      - '.dialyzer_ignore.exs'
      # Every workflow: the drift test, the tag pipeline's graph check
      # (tests/ci-release-graph.py) and its publication test
      # (tests/ci-publish-test.sh) read release.yml, and the retired-
      # settings test scans them all; the image scans read .trivyignore.yaml
      # and trivy-secret.yaml.
      - '.github/workflows/*.yml'
      # The setup-elixir action every BEAM job here runs.
      - '.github/actions/**'
      - '.trivyignore.yaml'
      - 'trivy-secret.yaml'
      # Compile-embedded (@external_resource) into compendium/providers/aqua.ex.
      - 'component-guide.md'
      - 'tincture-guide.md'
      - 'integration-guide.md'
      # Rendered from the settings roster; the guide check and the drift test
      # read it.
      - 'configuration-guide.md'
      # Shipped beside the others; the drift and vocabulary tests read them.
      - 'identity-guide.md'
      - 'devices-guide.md'
      # Release-critical surfaces with no workflow of their own: run the
      # suite so a change here at least builds against a green tree.
      - 'Dockerfile*'
      # Dockerfile.locus installs the Rust release it names, so the Locus
      # image jobs rebuild on a change to it.
      - 'rust-toolchain.toml'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'docker-entrypoint.sh'
      - '.env.example'
      # The services' env examples: the stack shape test reads them and the
      # scaffold tarball ships them.
      - '.env.*.example'
      - 'wit/**'
      - 'seed/**'
      # Surfaces the vocabulary gate scans: it cannot turn red on a change it
      # never runs on.
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - '.gitignore'
      - '.dockerignore'
  # Expose this workflow for tag-triggered image and release jobs.
  workflow_call:
permissions:
  contents: read
# A newer push to a pull request cancels the run it supersedes. Elsewhere a
# started run is never cancelled; GitHub keeps one waiting run per group,
# so a waiting run on main gives way to a newer push's.
concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  MIX_ENV: test
  ERL_CRASH_DUMP_SECONDS: 0
  # Mix through 1.20 can wait forever on its own build lock the second
  # time a fresh lock directory is taken, and a runner starts every one
  # fresh. One Mix process at a time builds here, so the lock is off.
  MIX_OS_CONCURRENCY_LOCK: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  # The checks whose answer does not depend on the database adapter, once
  # per run. Their step names stay as they were. scripts/commit-gate.sh
  # reads two of them, "The built SDK is its source's" and "The built
  # toolkit is its source's", and runs their scripts.
  static:
    name: Static checks, generated files, fixtures and harness tests
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      CYFR_DATABASE: sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache deps and build
        uses: ./.github/actions/setup-elixir
        with:
          cache-key-prefix: mix-static
      # The Rust test fixtures' build script is the one pin of their
      # toolchain and refuses any other, so the versions installed here are
      # read from it.
      - name: Read the Rust fixtures' toolchain pin
        id: rust-pin
        run: |
          set -euo pipefail
          pins=apps/cyfr/test/support/test_wasm/build-fixture.sh
          pin() {
            local value
            value="$(sed -n "s/^$1=//p" "$pins")"
            if ! [[ "$value" =~ ^$2$ ]]; then
              echo "::error::$pins pins no single $1 of the form $2" >&2
              exit 1
            fi
            printf '%s' "$value"
          }
          rustc="$(pin rustc_version '[0-9]+\.[0-9]+\.[0-9]+')"
          component="$(pin cargo_component_version '[0-9]+\.[0-9]+\.[0-9]+')"
          target="$(pin target 'wasm32-[a-z0-9]+')"
          {
            echo "rustc=$rustc"
            echo "cargo-component=$component"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"
      - name: Cache cargo-component
        id: cargo-component-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-component
          key: ${{ runner.os }}-cargo-component-${{ steps.rust-pin.outputs.cargo-component }}
      # scripts/check-test-wasm.sh builds the Rust fixtures with it. The
      # runner ships rustup; only the wasm targets and the tool are added.
      - name: Install cargo-component
        env:
          CARGO_COMPONENT_VERSION: ${{ steps.rust-pin.outputs.cargo-component }}
          CACHE_HIT: ${{ steps.cargo-component-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          rustup target add wasm32-wasip1 wasm32-wasip2
          if [ "$CACHE_HIT" != "true" ]; then
            cargo install cargo-component --version "$CARGO_COMPONENT_VERSION" --locked
          fi
          cargo-component --version
      # The fixtures build with the pinned rustc and its target, beside
      # wasm32-wasip1, which cargo-component builds through and would
      # otherwise install itself during the check. The runner's default
      # toolchain stays the one the catalysts test on.
      - name: Install the Rust fixtures' toolchain
        env:
          RUSTC_VERSION: ${{ steps.rust-pin.outputs.rustc }}
          TARGET: ${{ steps.rust-pin.outputs.target }}
        run: rustup toolchain install "$RUSTC_VERSION" --profile minimal --target "$TARGET" --target wasm32-wasip1
      # Each model catalyst's `model/chat@1` mapping runs on the host
      # target; the shipped binaries are not rebuilt here.
      - name: Test the model catalysts
        run: |
          shopt -s nullglob
          chats=(seed/components/catalysts/local/*/*/src/src/chat.rs)
          # A glob that matches nothing would test nothing; refuse it.
          if [ "${#chats[@]}" -eq 0 ]; then
            echo "::error::no model catalyst source matched — the step would test nothing"
            exit 1
          fi
          for chat in "${chats[@]}"; do
            src="$(dirname "$(dirname "$chat")")"
            (cd "$src" && cargo test --quiet --target-dir "$RUNNER_TEMP/catalyst-guest-target")
          done
      # Every shipped binary is the build of its source: the stamp the build
      # script writes binds the binary's digest to the source tree's, so a
      # guest edit without a rebuild fails here, toolchain or not.
      - name: Every stamped seed guest is built from its source
        run: |
          shopt -s nullglob
          stamps=(seed/components/*/local/*/*/src/build.stamp)
          if [ "${#stamps[@]}" -eq 0 ]; then
            echo "::error::no seed build stamp matched — the step would check nothing"
            exit 1
          fi
          for stamp in "${stamps[@]}"; do
            scripts/build-seed-guest.sh "$(dirname "$(dirname "$stamp")")" --check
          done
      # The loop above only visits directories that already carry a stamp, so
      # a guest shipped without one was never bound to its source at all —
      # which is how `http` and `files` drifted to a crate version naming a
      # release they are not. Both facts are checked for every guest here.
      - name: Every seed guest carries a stamp, and its crate version is its own
        run: |
          set -uo pipefail
          shopt -s nullglob
          bad=""
          guests=0
          manifests=(seed/components/*/local/*/*/cyfr-manifest.json)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::no seed component manifest matched — the step would check nothing"
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            vdir="$(dirname "$manifest")"
            # A guest is a directory with Rust sources; tinctures have none.
            [ -f "$vdir/src/Cargo.toml" ] || continue
            guests=$((guests + 1))
            version="$(basename "$vdir")"
            if [ ! -f "$vdir/src/build.stamp" ]; then
              bad="$bad"$'\n'"$vdir: no src/build.stamp"
            fi
            crate="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$vdir/src/Cargo.toml" | head -1)"
            if [ "$crate" != "$version" ]; then
              bad="$bad"$'\n'"$vdir: Cargo.toml says $crate"
            fi
          done
          if [ "$guests" -eq 0 ]; then
            echo "::error::no seed guest has Rust sources — the step would check nothing"
            exit 1
          fi
          bad="$(printf '%s\n' "$bad" | sed '/^$/d')"
          if [ -n "$bad" ]; then
            echo "::error::seed guests must carry a build stamp and a crate version equal to their directory"
            echo "$bad"
            exit 1
          fi
      - name: Install dependencies
        run: mix deps.get
      # The pinned validator every component passes (scripts/wasm-tools.sh),
      # at `_tools/wasm-tools`, where the test configuration names it.
      - name: Install the pinned wasm-tools
        run: scripts/wasm-tools.sh install _tools
      # The steps below read the compiled application. The cache keeps
      # _build across commits, and incremental state can keep what the
      # tree no longer has, so this compile is forced as the test job's is.
      - name: Compile with warnings as errors
        run: mix compile --force --warnings-as-errors
      # The Boundary plants: each writes a forbidden edge into a copy of the
      # tree and force-compiles it, so a declaration that stopped refusing
      # an edge fails here, once, outside the partitions.
      - name: Boundary plants
        run: mix test apps/cyfr/test/cyfr/boundaries_test.exs --only boundary_plant
      # .credo.exs's checks against .credo_baseline.exs: a finding the
      # baseline does not record fails, and so does a recorded one the tree
      # no longer has.
      - name: Static analysis
        run: mix credo --strict
      - name: Check formatting
        run: mix format --check-formatted
      # The CLI's operation constants are generated from the server's
      # operation table: a catalog that no longer matches it fails here.
      - name: The CLI catalog is the operation table's
        run: mix ops.gen.cli --check
      # configuration-guide.md is rendered from the settings roster: a guide
      # that no longer matches it fails here.
      - name: The configuration guide is the roster's
        run: mix cyfr.gen.configuration_guide --check
      # The tincture SDK is built from apps/cyfr/assets/js/sdk into
      # priv/static/sdk/cyfr.js and tracked, since a tincture's entry page
      # embeds it at compile time. A source edit without a rebuild fails
      # here.
      - name: The built SDK is its source's
        run: |
          set -euo pipefail
          mix esbuild sdk
          if [ -n "$(git status --porcelain -- apps/cyfr/priv/static/sdk/)" ]; then
            echo "::error::apps/cyfr/priv/static/sdk/ is not the build of apps/cyfr/assets/js/sdk: run mix esbuild sdk and commit the result"
            git status --porcelain -- apps/cyfr/priv/static/sdk/
            git diff --stat -- apps/cyfr/priv/static/sdk/
            exit 1
          fi
      # The canvas toolkit is built from apps/cyfr/assets/js/toolkit into
      # priv/static/toolkit/host.js and worker.js and tracked, since a
      # canvas's host page embeds both at compile time: the host bundle as
      # its one script, the worker bundle as inert data. No .gz is built. A
      # source edit without a rebuild fails here.
      - name: The built toolkit is its source's
        run: |
          set -euo pipefail
          mix esbuild toolkit_host
          mix esbuild toolkit_worker
          if [ -n "$(git status --porcelain -- apps/cyfr/priv/static/toolkit/)" ]; then
            echo "::error::apps/cyfr/priv/static/toolkit/ is not the build of apps/cyfr/assets/js/toolkit: run mix esbuild toolkit_host and mix esbuild toolkit_worker and commit the result"
            git status --porcelain -- apps/cyfr/priv/static/toolkit/
            git diff --stat -- apps/cyfr/priv/static/toolkit/
            exit 1
          fi
      # The harness's own tests, each against stand-ins for what the harness
      # runs: the containment library, the partition runner and its
      # environment helper, the host queue, the commit gate and the red-rate
      # reader (against a canned gh).
      - name: Verify partition infrastructure
        run: |
          bash tests/contain-test.sh
          bash tests/test-partitioned-test.sh
          elixir tests/test-partition-env-test.exs
          bash tests/heavy-check-test.sh
          bash tests/commit-gate-test.sh
          bash tests/ci-red-rate-test.sh
      # Every checked-in test WASM fixture is its source's build: the WAT
      # fixtures with the pinned wasm-tools, the Rust ones with the pinned
      # rustc and cargo-component, which refuse any other.
      - name: Every test WASM fixture is its source's build
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust-pin.outputs.rustc }}
        run: scripts/check-test-wasm.sh
      # The release proofs' shared plumbing against stand-ins: the reuse of
      # a built release, the readiness bounds, a cell's deployment file from
      # the command line, the one redaction, and the release-boot reach
      # case staging each boot vector as the vector says. The proofs
      # themselves run in the browser and release-boot jobs.
      - name: The release proofs' shared plumbing
        run: |
          set -euo pipefail
          bash tests/release-boot-test.sh
          bash tests/release-boot/reach-test.sh
      # The image suites' shared plumbing without Docker: teardown on a
      # signal, the namespace prerequisite and no bytecode under tests/.
      - name: The image suites' shared plumbing
        run: python3 -I tests/imagesuite_test.py
      # The tag pipeline publishes nothing unless every check passed: its
      # graph read from release.yml, then mutants of it, each refused.
      # It reads YAML through PyYAML, which -I finds only among the system
      # interpreter's packages: the package is installed when absent, and a
      # missing module fails the import loudly rather than skipping a check.
      - name: The tag pipeline's graph
        run: |
          set -euo pipefail
          if ! python3 -I -c 'import yaml' 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y python3-yaml
          fi
          python3 -I tests/ci-release-graph.py
      # The store switch's own cases, against docker and systemctl shims,
      # before it runs here and in release.yml.
      - name: The containerd image store switch's cases
        run: bash tests/containerd-image-store-test.sh
      # The publication test loads images with their attestations, as
      # release.yml's build does, so it runs on the image store release.yml
      # switches to, switched the same way. Nothing before it here uses
      # Docker, and the test creates its own builder after the restart.
      - name: Use the containerd image store
        run: sudo scripts/ci/containerd-image-store.sh
      # release.yml's image publication against a local registry: one build
      # per platform, the scanned image the pushed one, and each run's
      # manifest merged from its own digests while another run interleaves.
      - name: The tag pipeline's image publication
        run: bash tests/ci-publish-test.sh

  # The console's JavaScript and the SDK's source: eslint's recommended
  # rules (apps/cyfr/assets/eslint.config.mjs) and the unit tests under c8,
  # whose coverage summary is reported and never a floor. Neither needs an
  # image or a build, so the job waits on no other.
  js-unit:
    name: JavaScript lint, unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/cyfr/assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node 24, the runtime FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 gives the
      # actions.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/cyfr/assets/package-lock.json
      # eslint and c8 as package-lock.json pins them, with no install
      # script run.
      - name: Install the lint and coverage tools
        run: npm ci --ignore-scripts
      - name: Lint the console's JavaScript and the SDK
        run: npx eslint .
      - name: The console's JavaScript tests (the SDK, the canvas toolkit, the canvas, the carrier, the system layer and the markdown hook's parse step)
        env:
          CYFR_COVERAGE: 1
        run: test/run.sh

  test:
    name: Elixir Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 95
    # Both adapters must stay green. SQLite is the shipped default; Postgres is
    # bring-your-own. The data layer is Ecto-schema-backed so column values cast
    # to the same Elixir types on both, and both legs are blocking.
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      # Test-only ephemeral database — these credentials (and CYFR_SECRET_KEY_BASE
      # below) are non-secret CI fixtures for the Postgres container, never used
      # outside CI.
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: cyfr
          POSTGRES_PASSWORD: cyfr
          POSTGRES_DB: cyfr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CYFR_DATABASE: ${{ matrix.db }}
      CYFR_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://cyfr:cyfr@localhost:5432/cyfr_test' || '' }}
      CYFR_SECRET_KEY_BASE: ${{ matrix.db == 'postgres' && 'JspnK9M8XQE1HFBRZWuzJqK8ZX8ITp5vPQ6MJv2RmFfKpGr2fEhAgSf3UqBT5xTk' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache deps and build
        uses: ./.github/actions/setup-elixir
        with:
          cache-key-prefix: mix-${{ matrix.db }}
      # The cargo-component version the Rust fixtures' build script pins,
      # read as the static job reads it.
      - name: Read the Rust fixtures' toolchain pin
        id: rust-pin
        run: |
          set -euo pipefail
          pins=apps/cyfr/test/support/test_wasm/build-fixture.sh
          pin() {
            local value
            value="$(sed -n "s/^$1=//p" "$pins")"
            if ! [[ "$value" =~ ^$2$ ]]; then
              echo "::error::$pins pins no single $1 of the form $2" >&2
              exit 1
            fi
            printf '%s' "$value"
          }
          rustc="$(pin rustc_version '[0-9]+\.[0-9]+\.[0-9]+')"
          component="$(pin cargo_component_version '[0-9]+\.[0-9]+\.[0-9]+')"
          target="$(pin target 'wasm32-[a-z0-9]+')"
          {
            echo "rustc=$rustc"
            echo "cargo-component=$component"
            echo "target=$target"
          } >> "$GITHUB_OUTPUT"
      - name: Cache cargo-component
        id: cargo-component-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-component
          key: ${{ runner.os }}-cargo-component-${{ steps.rust-pin.outputs.cargo-component }}
      # The compile-path tests — Locus's own and the control plane's build
      # over the wire to the real builds service (test/integration/locus) —
      # are tagged :requires_cargo_component and excluded when the binary is
      # absent; install it so they actually run. The runner ships rustup. A
      # build runs in a home of its own outside this checkout, so it takes
      # rustup's default toolchain, never the one rust-toolchain.toml makes
      # active here: the release that file names becomes the default, with
      # the wasm targets, as the cyfr-locus image installs it
      # (Dockerfile.locus), and the check from outside the checkout is the
      # one a build sees.
      - name: Install cargo-component
        env:
          CARGO_COMPONENT_VERSION: ${{ steps.rust-pin.outputs.cargo-component }}
          CACHE_HIT: ${{ steps.cargo-component-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel = "\([0-9][0-9.]*\)"$/\1/p' rust-toolchain.toml)"
          if [ -z "$channel" ]; then
            echo "::error::rust-toolchain.toml names no channel" >&2
            exit 1
          fi
          rustup toolchain install "$channel" --profile minimal --target wasm32-wasip1 --target wasm32-wasip2
          rustup default "$channel"
          (
            cd "$RUNNER_TEMP"
            [ "$(rustc --version | cut -d' ' -f2)" = "$channel" ]
            installed="$(rustup target list --installed)"
            grep -qx wasm32-wasip1 <<<"$installed"
            grep -qx wasm32-wasip2 <<<"$installed"
          )
          if [ "$CACHE_HIT" != "true" ]; then
            cargo install cargo-component --version "$CARGO_COMPONENT_VERSION" --locked
          fi
          cargo-component --version
      - name: Install dependencies
        run: mix deps.get
      # The pinned validator every component passes (scripts/wasm-tools.sh),
      # at `_tools/wasm-tools`, where the test configuration names it.
      - name: Install the pinned wasm-tools
        run: scripts/wasm-tools.sh install _tools
      # Every layer edge is a Boundary declaration, and a forbidden
      # reference is a compiler warning: a plain compile only warns, and
      # incremental state can keep a declaration the tree no longer has, so
      # both environments compile forced with warnings as errors.
      - name: Compile with warnings as errors
        run: mix compile --force --warnings-as-errors
      - name: Compile the dev target with warnings as errors
        env:
          MIX_ENV: dev
        run: mix compile --force --warnings-as-errors
      # --warnings-as-errors covers the .exs files `mix test` loads, which a
      # forced compile never reads: a warning in a test fails the build as
      # one in the application does. The partitions test the build the
      # forced compile above made, on either adapter. The runner's own
      # PostgreSQL build, _build/test_pg, is the one the cache holds, made
      # by whichever run first saved it, and compiled incrementally over it
      # a module this tree did not change keeps the types it inferred from
      # what it called back then: the test files would be type-checked
      # against signatures the tree no longer has. The runner's output is
      # kept in a file as well as the log: a failed run names the directory
      # it kept in its own last lines, which the next step reads.
      - name: Run tests
        id: run-tests
        env:
          MIX_BUILD_PATH: _build/test
        run: |
          set -o pipefail
          scripts/test-partitioned.sh -a "${{ matrix.db }}" -- --warnings-as-errors 2>&1 |
            tee "$RUNNER_TEMP/run-tests.out"
      # A failed run keeps its directory: each partition's log and scratch
      # root, the compile and assignment logs, the failures record. That
      # directory, and no other, is the one the runner's own 'kept' line
      # names. What could carry a credential never leaves the runner: the
      # partitions' database URLs (p*.env, which the runner itself removes),
      # hidden entries (a copied .git holds the checkout's token), anything
      # but a plain file or directory (a symlink would be uploaded as its
      # target), and, in what remains, this job's database URL and key
      # base, a URL's password, an authorization header and a GitHub token.
      - name: Prepare the failed run's kept directory
        id: kept
        if: failure() && steps.run-tests.outcome == 'failure'
        run: |
          set -euo pipefail
          mapfile -t kept < <(sed -n 's/^==> logs and disposable resources kept: //p' "$RUNNER_TEMP/run-tests.out")
          if [ "${#kept[@]}" -ne 1 ]; then
            echo "::warning::the runner named ${#kept[@]} kept directories, not one; nothing is uploaded"
            exit 0
          fi
          dir=${kept[0]}
          if ! [[ "$dir" =~ ^/tmp/cyfr-t\.[A-Za-z0-9]{6}$ ]] || [ -L "$dir" ] || [ ! -d "$dir" ] || [ ! -O "$dir" ]; then
            echo "::warning::the runner's kept directory is not one it made: $dir; nothing is uploaded"
            exit 0
          fi
          find "$dir" -mindepth 1 \( -name '.*' -o -name '*.env' \) -prune -exec rm -rf -- {} +
          find "$dir" -mindepth 1 ! -type f ! -type d -delete
          python3 -I - "$dir" <<'PY'
          import os, re, sys

          root = sys.argv[1]
          literals = [os.environb.get(name, b"") for name in (b"CYFR_SECRET_KEY_BASE", b"CYFR_DATABASE_URL")]
          patterns = [
              (re.compile(rb"([A-Za-z][A-Za-z0-9+.-]*://)[^/@\s:]+:[^/@\s]*@"), rb"\1[redacted]@"),
              (re.compile(rb"((?i:authorization):[ \t]*(?i:basic|bearer)[ \t]+)\S+"), rb"\1[redacted]"),
              (re.compile(rb"gh[pousr]_[A-Za-z0-9]{36,}|github_pat_\w{22,}"), rb"[redacted]"),
          ]

          def clean(data):
              for literal in filter(None, literals):
                  data = data.replace(literal, b"[redacted]")
              for pattern, replacement in patterns:
                  data = pattern.sub(replacement, data)
              return data

          def files():
              for base, _dirs, names in os.walk(root):
                  for name in names:
                      yield os.path.join(base, name)

          def read(path):
              with open(path, "rb") as f:
                  return f.read()

          for path in files():
              data = read(path)
              if clean(data) != data:
                  with open(path, "wb") as f:
                      f.write(clean(data))
                  print("redacted:", os.path.relpath(path, root))

          left = [path for path in files() if clean(read(path)) != read(path)]
          if left:
              sys.exit("still carries a credential after redaction: " + ", ".join(left))
          PY
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Upload the failed run's kept directory
        if: failure() && steps.run-tests.outcome == 'failure' && steps.kept.outputs.dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-run-${{ matrix.db }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.kept.outputs.dir }}
          if-no-files-found: error
          retention-days: 14

  cluster:
    name: One cell on two members (Postgres and MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # One cell runs on several members, and a cluster flag is not evidence
    # of it. This job runs the two-node suite: two `:peer` nodes,
    # each running the whole application against one Postgres and one
    # object store, under every refusal CYFR_CLUSTER=1 names. Every other
    # job in this workflow runs one node, so nothing else here can tell a
    # claim that holds from a claim that only looks like it does.
    services:
      # Test-only ephemeral database, and deliberately not cyfr_test: a
      # cluster member holds no sandbox connection, so it must not share a
      # database with a run whose writes roll back. Credentials are
      # non-secret CI fixtures.
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: cyfr
          POSTGRES_PASSWORD: cyfr
          POSTGRES_DB: cyfr_cluster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CYFR_DATABASE: postgres
      CYFR_DATABASE_URL: postgres://cyfr:cyfr@localhost:5432/cyfr_cluster_test
      CYFR_CLUSTER_DATABASE_URL: postgres://cyfr:cyfr@localhost:5432/cyfr_cluster_test
      CYFR_SECRET_KEY_BASE: JspnK9M8XQE1HFBRZWuzJqK8ZX8ITp5vPQ6MJv2RmFfKpGr2fEhAgSf3UqBT5xTk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache deps and build
        uses: ./.github/actions/setup-elixir
        with:
          cache-key-prefix: mix-cluster
      # CYFR_CLUSTER=1 refuses local storage: two members would each hold
      # half of every athanor. The same image and credentials the s3-minio
      # job uses, pinned by digest; the PostgreSQL service images in this
      # workflow are pinned by tag (postgres:18.6).
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=cyfrtest -e MINIO_ROOT_PASSWORD=cyfrtest123 \
            pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 \
            server /data
      - name: Install dependencies
        run: mix deps.get
      # Forced, as the test job's is: the cache keeps _build across
      # commits, and incremental state can keep what the tree no longer has.
      - name: Compile with warnings as errors
        run: mix compile --force --warnings-as-errors
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become healthy" >&2
          docker logs minio || true
          exit 1
      # The `test` alias creates and migrates the database first, so the
      # members find a schema rather than migrating under each other.
      # The runner fails the job when --only cluster ran no test (Mix alone
      # exits 0 for that in an umbrella), which is what stops a suite that
      # silently stopped running.
      # The suite tests the build the forced compile above made. The
      # runner's own PostgreSQL build, _build/test_pg, is the one the cache
      # holds, made by whichever run first saved it, and compiled
      # incrementally over it a module this tree did not change keeps the
      # types it inferred from what it called back then: the test files
      # would be type-checked against signatures the tree no longer has.
      - name: Run the two-node suite
        env:
          MIX_BUILD_PATH: _build/test
        run: scripts/test-partitioned.sh -n 1 -a postgres -- --warnings-as-errors --only cluster apps/cyfr/test/cluster
      - name: MinIO logs
        if: failure()
        run: docker logs minio

  prima-independence:
    name: Prima compiles and tests alone
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The four islands fetch the same deps from the one lock and build
      # nothing they keep, so they share one deps cache.
      - name: Cache deps
        uses: ./.github/actions/setup-elixir
        with:
          cache-key-prefix: mix-deps
          build-cache: 'false'
      - name: Install dependencies
        run: mix deps.get
      # The shared contracts depend on no other application: a checkout
      # holding only the lock, Prima, the fetched deps, the WIT tree
      # (`Prima.WIT` embeds it), the protocol vectors, the shipped
      # components the Wasm validator's suite reads and the pinned
      # wasm-tools the component validator runs compiles it with
      # warnings as errors and runs its suite. Standalone, the application
      # loads only its own empty configuration.
      - name: Compile and test Prima alone
        run: |
          set -euo pipefail
          island="$RUNNER_TEMP/prima-island"
          mkdir -p "$island/apps" "$island/tests" "$island/seed"
          cp mix.lock "$island/"
          cp -R apps/prima "$island/apps/"
          cp -R deps wit "$island/"
          cp -R tests/fixtures "$island/tests/"
          cp -R seed/components "$island/seed/"
          scripts/wasm-tools.sh install "$island/_tools"
          cd "$island/apps/prima"
          mix compile --warnings-as-errors
          mix test

  arca-independence:
    name: Arca compiles and tests from its declared apps alone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CYFR_DATABASE: sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The four islands fetch the same deps from the one lock and build
      # nothing they keep, so they share one deps cache.
      - name: Cache deps
        uses: ./.github/actions/setup-elixir
        with:
          cache-key-prefix: mix-deps
          build-cache: 'false'
      - name: Install dependencies
        run: mix deps.get
      # Persistence holds nothing of the layers above it: a checkout with
      # only the lock, the contracts, Arca, the fetched deps and the one
      # CYFR_DATABASE parse its configuration shares with the umbrella root
      # (config/database_choice.exs) compiles it with warnings as errors and
      # runs its suite against a database it migrates itself.
      - name: Compile and test Arca from its declared apps alone
        run: |
          set -euo pipefail
          island="$RUNNER_TEMP/arca-island"
          mkdir -p "$island/apps" "$island/config"
          cp mix.lock "$island/"
          cp -R apps/prima apps/arca "$island/apps/"
          cp -R deps wit "$island/"
          cp config/database_choice.exs "$island/config/"
          cd "$island/apps/arca"
          mix compile --warnings-as-errors
          mix test

  sanctum-independence:
    name: Sanctum compiles and tests from its declared apps alone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CYFR_DATABASE: sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The four islands fetch the same deps from the one lock and build
      # nothing they keep, so they share one deps cache.
      - name: Cache deps
        uses: ./.github/actions/setup-elixir
        with:
          cache-key-prefix: mix-deps
          build-cache: 'false'
      - name: Install dependencies
        run: mix deps.get
      # The auth domain holds nothing of the domains and surfaces above it:
      # a checkout with only the lock, the contracts, Arca, Sanctum, the
      # fetched deps and the CYFR_DATABASE parse compiles it with warnings
      # as errors and runs its suite. Zero Ecto of its own — every row it
      # reads it reads through an Arca facade. What each island may declare
      # in the umbrella is a row of `Cyfr.Boundaries`, asserted against
      # each mix.exs by `Cyfr.BoundariesTest` in the main suite.
      - name: Compile and test Sanctum from its declared apps alone
        run: |
          set -euo pipefail
          island="$RUNNER_TEMP/sanctum-island"
          mkdir -p "$island/apps" "$island/config"
          cp mix.lock "$island/"
          cp -R apps/prima apps/arca apps/sanctum "$island/apps/"
          cp -R deps wit "$island/"
          cp config/database_choice.exs "$island/config/"
          cd "$island/apps/sanctum"
          mix compile --warnings-as-errors
          mix test

  locus-independence:
    name: Locus compiles and tests from its declared apps alone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The four islands fetch the same deps from the one lock and build
      # nothing they keep, so they share one deps cache.
      - name: Cache deps
        uses: ./.github/actions/setup-elixir
        with:
          cache-key-prefix: mix-deps
          build-cache: 'false'
      - name: Install dependencies
        run: mix deps.get
      # Locus releases without the control plane: a checkout holding only
      # the lock, the contracts, Locus, the fetched deps, the WIT tree
      # (`Prima.WIT` embeds it; `Locus.Runtime.Engine` reads the same
      # tree), the vector files its wires', its runtime's and its keeper
      # tests read (tests/fixtures) and the locus release's runtime
      # configuration (config/locus_runtime.exs, which its config test
      # evaluates) compiles every role with warnings as errors and runs its
      # suite, against a scripted host and no database. Its vector tests
      # fail rather than skip without the vector file.
      - name: Compile and test Locus from its declared apps alone
        run: |
          set -euo pipefail
          island="$RUNNER_TEMP/locus-island"
          mkdir -p "$island/apps" "$island/config" "$island/tests"
          cp mix.lock "$island/"
          cp -R apps/prima apps/locus "$island/apps/"
          cp -R deps wit "$island/"
          cp -R tests/fixtures "$island/tests/"
          cp config/locus_runtime.exs "$island/config/"
          scripts/wasm-tools.sh install "$island/_tools"
          cd "$island/apps/locus"
          mix compile --warnings-as-errors
          mix test

  s3-minio:
    name: S3 adapter vs MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CYFR_DATABASE: sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache deps and build
        uses: ./.github/actions/setup-elixir
        with:
          cache-key-prefix: mix-minio
      # The stub suite verifies request shape; only a real implementation
      # verifies the signature over pre-percent-encoded URLs and the
      # Content-MD5-signed DeleteObjects batch. Credentials are non-secret
      # CI fixtures mirrored in s3_minio_test.exs.
      - name: Start MinIO
        run: |
          # MinIO Inc. stopped publishing images in October 2025 and archived
          # the server in February 2026; pgsty/silo (formerly pgsty/minio) is
          # the maintained community build of the same server, with the same
          # variables and health route. Pinned by digest
          # (RELEASE.2026-09-16T00-00-00Z, the multi-arch index), as every
          # action this workflow uses is; the PostgreSQL service images are
          # pinned by tag (postgres:18.6).
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=cyfrtest -e MINIO_ROOT_PASSWORD=cyfrtest123 \
            pgsty/silo@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46 \
            server /data
      - name: Install dependencies
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become healthy" >&2
          docker logs minio || true
          exit 1
      # Arca owns the tagged adapter, append-parity and publication suites.
      # Scope the run to that app so unrelated umbrella apps with no matching
      # tests do not fail --only. The store's defaults name this container.
      - name: Run the S3 integration suite
        run: scripts/test-partitioned.sh -n 1 -a sqlite apps/arca/test --warnings-as-errors --only s3_integration
      # What the server thought of the requests, when it refused them.
      - name: MinIO logs
        if: failure()
        run: docker logs minio

  # Dockerfile.locus built once per run, for every job that runs the image:
  # builder-image, locus-runtime-image, locus-backends-image and the
  # browser job's tincture proof each load this build under their own tag.
  locus-image:
    name: The Locus image, built once for this run
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image's upgrade layer refreshes once a UTC day and is shared
      # within it (Dockerfile.locus's APT_REFRESH).
      - name: The UTC date the upgrade layer refreshes on
        id: apt-refresh
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Locus image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.locus
          build-args: |
            APT_REFRESH=${{ steps.apt-refresh.outputs.date }}
          load: true
          tags: cyfr-locus:ci
          cache-from: type=gha,scope=locus
          cache-to: type=gha,scope=locus,mode=max
      - name: Save the Locus image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/locus-image"
          docker save cyfr-locus:ci | zstd -T0 -q -o "$RUNNER_TEMP/locus-image/cyfr-locus.tar.zst"
      # Already compressed, and read only by this run's jobs. A re-run of
      # this job replaces it.
      - name: Upload the Locus image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: locus-image
          path: ${{ runner.temp }}/locus-image/cyfr-locus.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  builder-image:
    name: Builder image (lock lifecycle, isolation, memory bound, headroom)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: locus-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The service bounds every build with a cgroup of its own, which needs
      # the security option writable-cgroups=true: Docker Engine 28 or later
      # on a cgroup v2 host. Without either every case below fails for a
      # reason the suite does not name, so this names it first.
      - name: Docker Engine 28 or later on cgroup v2
        run: |
          set -euo pipefail
          version="$(docker version --format '{{.Server.Version}}')"
          cgroup="$(docker info --format '{{.CgroupVersion}}')"
          echo "Docker Engine $version on cgroup v$cgroup"
          fail=0
          if [ "${version%%.*}" -lt 28 ]; then
            echo "::error::Docker Engine $version is older than 28: writable-cgroups=true, which bounds every build, needs Docker Engine 28 or later"
            fail=1
          fi
          if [ "$cgroup" != "2" ]; then
            echo "::error::this runner's Docker Engine runs on cgroup v$cgroup: writable-cgroups=true, which bounds every build, needs a cgroup v2 host"
            fail=1
          fi
          exit "$fail"
      # The Locus image this run built once (the locus-image job).
      - name: Fetch the Locus image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: locus-image
          path: ${{ runner.temp }}/locus-image
      - name: Load the Locus image
        run: |
          set -euo pipefail
          zstd -dc "$RUNNER_TEMP/locus-image/cyfr-locus.tar.zst" | docker load
          docker tag cyfr-locus:ci cyfr-locus:smoke
      # docker-compose.yml's locus-builds service with its own settings
      # (layered with tests/builder-image/compose.locus-builds.yml for the
      # image and a loopback port), every request signed on the build wire
      # under a key of the run's own. Builds fetch from crates.io and the
      # npm registry.
      - name: Build a component through its lock lifecycle, and a tincture
        run: python3 scripts/builder-smoke.py cyfr-locus:smoke

      # Under the same settings: cyfr-locus holds exactly SETUID|SETGID|KILL
      # and the release none, with no distribution listener, and the release
      # refuses to serve without cyfr-locus; a build runs under a pooled uid
      # in a 0700 home, cannot read or signal the release (whose environ
      # holds the builds key), list the home root or read a concurrent
      # build's tree; a daemon a build.rs starts is gone, with the home, when
      # the response arrives; with a pool of one uid nothing a build leaves
      # outside its home (tests/fixtures/residue-canary.go) reaches the next;
      # and without writable-cgroups=true every build is answered
      # `unavailable`, naming the option, and no build's uid ever runs.
      - name: Build isolation, uid reuse, and the refusal without the option
        run: python3 tests/builder-image/isolation.py cyfr-locus:smoke

      # Every case: the keeper's own bound in the running service, and a
      # hostile JavaScript, Rust build.rs, process-tree and home-filling
      # build each ended at its 1 GiB bound as the wire's `memory` class
      # with no process or home of its uid left, a sibling build completing,
      # and the release untouched.
      - name: Every build's memory bound
        run: python3 tests/builder-image/memory.py cyfr-locus:smoke

      # The service's own memory, idle, answering a largest result, and
      # answering two beside two builds at their bounds, fits in what the
      # container's limit (LOCUS_BUILDS_MEMORY_LIMIT) leaves beside the
      # concurrent builds' bounds.
      - name: The container's limit holds the builds and the service
        run: python3 tests/builder-image/headroom.py cyfr-locus:smoke

      # A tincture builds only from its lockfile: one without it is refused
      # before anything runs, one out of step with its package.json fails
      # in `npm ci`, and an install script runs under the build's uid and
      # finds no credential — not the builds key, nor any variable named
      # for one, nor an npm registry credential.
      - name: A tincture builds from its lockfile, its install scripts with no credential
        run: python3 tests/builder-image/lockfile.py cyfr-locus:smoke

      # The same scan release.yml runs before publishing the Locus image.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: cyfr-locus:smoke
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

  locus-runtime-image:
    name: Runtime image (runner kills, memory bound, settlement, cleanup, credential canary)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: locus-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The service bounds every runner with a cgroup of its own, which needs
      # the security option writable-cgroups=true: Docker Engine 28 or later
      # on a cgroup v2 host. Without either every case below fails for a
      # reason the suite does not name, so this names it first.
      - name: Docker Engine 28 or later on cgroup v2
        run: |
          set -euo pipefail
          version="$(docker version --format '{{.Server.Version}}')"
          cgroup="$(docker info --format '{{.CgroupVersion}}')"
          echo "Docker Engine $version on cgroup v$cgroup"
          fail=0
          if [ "${version%%.*}" -lt 28 ]; then
            echo "::error::Docker Engine $version is older than 28: writable-cgroups=true, which bounds every runner, needs Docker Engine 28 or later"
            fail=1
          fi
          if [ "$cgroup" != "2" ]; then
            echo "::error::this runner's Docker Engine runs on cgroup v$cgroup: writable-cgroups=true, which bounds every runner, needs a cgroup v2 host"
            fail=1
          fi
          exit "$fail"
      # The host's AppArmor restriction on unprivileged user namespaces stays
      # as the runner image sets it: the keeper clones each runner's
      # namespaces under Docker's default AppArmor profile, which allows
      # the clone (docker-compose.yml's locus-runtime service says why).
      # The Locus image this run built once (the locus-image job).
      - name: Fetch the Locus image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: locus-image
          path: ${{ runner.temp }}/locus-image
      - name: Load the Locus image
        run: |
          set -euo pipefail
          zstd -dc "$RUNNER_TEMP/locus-image/cyfr-locus.tar.zst" | docker load
          docker tag cyfr-locus:ci cyfr-locus:runtime
      # docker-compose.yml's locus-runtime service with its own settings
      # (layered with tests/locus-runtime-image/compose.locus-runtime.yml
      # for the image, a loopback port and a pool of two), reaching a
      # scripted control plane on this
      # runner: a spinning guest killed at its deadline with its process
      # gone and CPU flat, a sibling that completes meanwhile, the service's
      # VM killed and the container restarted as a new boot, the control
      # plane cut with the attempt settling at its deadline, a child
      # admitted after its parent's kill that never runs, a stream the
      # control plane stops answering, a tainted runner never reassigned,
      # and the queue age of a fresh runner; and memory (memory.py's cases):
      # every runner in a cgroup of its own at the service's bound, a
      # formula's six children each holding the 64 MiB the engine lets it
      # have, together past the bound in their runner, ended with it at
      # exactly that bound while the container's limit is untouched, the
      # exit reported with every child's attempt, the uid emptied and
      # scrubbed before its reuse and the sibling completing, and without
      # writable-cgroups=true no runner process ever starting. Each case is
      # observed as the service detects it, as the control plane records it
      # and as the container's processes, uids, homes, groups, memory and
      # CPU show it.
      - name: Runner kills, memory bound, settlement and cleanup
        run: python3 tests/locus-runtime-image/runners.py cyfr-locus:runtime
      # Each runner in a user and network namespace of its own, with no
      # route out, observed on the kernel; it fails before its first step
      # on a host that cannot make the namespaces.
      - name: Each runner in namespaces of its own
        run: python3 -I tests/locus-runtime-image/namespace.py cyfr-locus:runtime
      # The canary's own checks, without the image: the streamed count
      # against a whole-buffer count across chunk boundaries, and the
      # observer verdicts against observers that fail.
      - name: The credential canary's own checks
        run: python3 -I tests/locus-runtime-image/canary_test.py
      # The credential canary (tests/locus-runtime-image/canary.py): a hostile
      # catalyst names its connection on a request to an upstream that
      # reflects it, and the scripted control plane attaches a canary value;
      # with the attempt's close held, the runner's and the service's process
      # memory, the runner's home, the container's log, the exit report, the
      # attach answer, the event and the output hold no trace of it while
      # the upstream's log does. A positive control plants another canary in
      # a disclosed field and the same dump finds it.
      - name: The credential canary
        run: python3 tests/locus-runtime-image/canary.py cyfr-locus:runtime

      # The same scan release.yml runs before publishing the Locus image, here
      # on the image the runtime role ran.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: cyfr-locus:runtime
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

  # Stdio backends isolated from each other and from the backends
  # service, under the locus-backends service's own settings. The suites
  # run here, in the workflow the tag's `verify` calls, so the release gates
  # on them.
  locus-backends-image:
    name: Backends image (end to end, isolation, refusals, residue, memory bound) and the Compose proof
    runs-on: ubuntu-latest
    # The Compose proof's six cases bring the stack up and switch its reach
    # some twenty times between them.
    timeout-minutes: 100
    needs: locus-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Compose proof drives the stack through the `cyfr` command line
      # it builds from apps/codex, and builds the Tailscale stand-in, a Go
      # module of its own.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum
      # The service bounds every backend with a cgroup of its own, which
      # needs the security option writable-cgroups=true: Docker Engine 28 or
      # later on a cgroup v2 host. Without either every case below fails for
      # a reason the suite does not name, so this names it first.
      - name: Docker Engine 28 or later on cgroup v2
        run: |
          set -euo pipefail
          version="$(docker version --format '{{.Server.Version}}')"
          cgroup="$(docker info --format '{{.CgroupVersion}}')"
          echo "Docker Engine $version on cgroup v$cgroup"
          fail=0
          if [ "${version%%.*}" -lt 28 ]; then
            echo "::error::Docker Engine $version is older than 28: writable-cgroups=true, which bounds every backend, needs Docker Engine 28 or later"
            fail=1
          fi
          if [ "$cgroup" != "2" ]; then
            echo "::error::this runner's Docker Engine runs on cgroup v$cgroup: writable-cgroups=true, which bounds every backend, needs a cgroup v2 host"
            fail=1
          fi
          exit "$fail"
      # The Locus image this run built once (the locus-image job).
      - name: Fetch the Locus image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: locus-image
          path: ${{ runner.temp }}/locus-image
      - name: Load the Locus image
        run: |
          set -euo pipefail
          zstd -dc "$RUNNER_TEMP/locus-image/cyfr-locus.tar.zst" | docker load
          docker tag cyfr-locus:ci cyfr-locus:backends
      # The image's upgrade layer refreshes once a UTC day and is shared
      # within it (Dockerfile's APT_REFRESH), as the Locus image's does.
      - name: The UTC date the upgrade layer refreshes on
        id: apt-refresh
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            APT_REFRESH=${{ steps.apt-refresh.outputs.date }}
          load: true
          tags: cyfr:push
          cache-from: type=gha,scope=cyfr-push
          cache-to: type=gha,scope=cyfr-push,mode=max

      # Every suite drives docker-compose.yml's locus-backends service with
      # its own settings (layered with
      # tests/locus-backends-image/compose.locus-backends.yml for the image
      # under test, a loopback port and the probe backend) through a
      # scripted control plane that signs as CYFR does
      # (tests/locus-backends-image/harness.py, checked against
      # tests/fixtures/locus_backends.json before any container starts).

      # A backend synced, called and listed, its sealed credential masked in
      # every result, error and stderr tail, retired once idle with its
      # tools still listed, and woken by its next call.
      - name: End to end
        run: python3 tests/locus-backends-image/e2e.py cyfr-locus:backends

      # Each backend under its own pooled uid, alone in its group, in a 0700
      # home, with an environment of its sealed block alone; none can read
      # another's home or /proc environ or the release's, nor signal
      # another backend, a relay, the release or cyfr-locus, and each reads
      # another's command line, the limit the guides state; cyfr-locus
      # holds exactly SETUID|SETGID|KILL and the release none; releasing an
      # owner leaves no process of its uid, a setsid daemon ignoring SIGTERM
      # included, and no home; and when the release dies cyfr-locus
      # retires every backend and exits.
      - name: Backend isolation
        run: python3 tests/locus-backends-image/isolation.py cyfr-locus:backends

      # A captured invoke sent again after `docker restart` (stale_boot), a
      # control message at or below the high-water mark (stale_control), an
      # invoke at a stale epoch, a replayed nonce and a sync the uid pool
      # cannot hold (capacity) are refused over the wire, and a refused sync
      # spawns nothing.
      - name: Refusals
        run: python3 tests/locus-backends-image/refusals.py cyfr-locus:backends

      # With a pool of one uid: a backend can write outside its home only
      # into the home root; the entries it leaves there, a directory tree it
      # made unwritable, System V shared memory, semaphores and message
      # queues and a POSIX message queue (tests/fixtures/residue-canary.go)
      # are gone before the next owner runs under the same uid.
      - name: Residue across uid reuse
        run: python3 tests/locus-backends-image/residue.py cyfr-locus:backends

      # A backend past LOCUS_BACKENDS_MEMORY_BYTES is ended at its bound in
      # a cgroup of its own, alone: its sibling and the service keep
      # running, and it restarts.
      - name: Every backend's memory bound
        run: python3 tests/locus-backends-image/memory.py cyfr-locus:backends

      # The Compose proof (tests/compose-proof/run.sh) on the app image
      # built above, as the proof's own build would make it: the shipped
      # docker-compose.yml brought up as a project of its own by the `cyfr`
      # command line built from this tree, its tailscale service the
      # Tailscale stand-in, which certifies no Tailscale binary
      # (tests/tailnet-real/run.sh is the real tailnet's, run by hand).
      # bind: in each reach mode, the loopback listener bound to its fixed
      # address alone and answering the host's loopback alone, not the edge
      # network, Docker's default bridge or the host's address; the proxy
      # listener answering the edge network in tailnet and public and absent
      # in local; the ports each mode publishes; readiness through the
      # mode's proxy. modes: every ordered switch of the three modes, the
      # old proxy stopped each time, forged forwarding and identity headers
      # changing no answer or client address, tailnet's HSTS, origins,
      # cookies, sockets and MCP at the ts.net name, COMPOSE_PROFILES inert
      # in the environment and refused in .env, an incoherent .env and a
      # missing mode refused before anything starts. interrupt: the
      # command line killed after acceptance and while its start is paused,
      # and a stop that fails, each recovered with `cyfr reach --resume` as
      # its sentence says, and the tailnet join's HTTPS-off and
      # tailnet_active instructions followed as printed. restore-identity:
      # a restore pairing node A's .env with node B's state keeps Serve
      # closed and answers tailnet_node_mismatch. shutdown: `docker compose
      # stop cyfr` ends within its stop_grace_period, cyfr exiting on its
      # own while it holds a stream and a running call. restore: with the
      # restore's bar in .env the cyfr service is refused at the entrypoint,
      # and the declaration `cyfr restore` runs, the bar set empty in its
      # one-off container, boots and declares. Each run fails when its
      # teardown leaves the project behind, which the teardown's stand-in
      # cases hold.
      - name: The Compose proof's teardown against stand-ins
        run: bash tests/compose-proof/cleanup-test.sh
      # The Compose proof's whole-object predicates on canned objects: each
      # changed, dropped or added field of a head, the Serve configuration,
      # the preview, the cookie's redirects, a forged anonymous refusal and
      # a proxy's capabilities fails.
      - name: The Compose proof's predicates
        run: bash tests/compose-proof/predicates-test.sh
      # The stand-in against a stub upstream: what the pinned image's Serve
      # does with Host, the forwarding and identity headers and an empty
      # configuration, its status and its join, and every one of those
      # broken on purpose failing this proof.
      - name: The Tailscale stand-in's own proof
        run: tests/compose-proof/tailscale-standin/proof.sh
      - name: The Compose proof's image
        run: docker tag cyfr:push cyfr:compose-proof
      - name: The Compose proof (bind)
        env:
          COMPOSE_PROOF_SKIP_BUILD: '1'
        run: tests/compose-proof/run.sh --case bind
      - name: The Compose proof (modes)
        env:
          COMPOSE_PROOF_SKIP_BUILD: '1'
        run: tests/compose-proof/run.sh --case modes
      - name: The Compose proof (interrupt)
        env:
          COMPOSE_PROOF_SKIP_BUILD: '1'
        run: tests/compose-proof/run.sh --case interrupt
      - name: The Compose proof (restore-identity)
        env:
          COMPOSE_PROOF_SKIP_BUILD: '1'
        run: tests/compose-proof/run.sh --case restore-identity
      - name: The Compose proof (shutdown)
        env:
          COMPOSE_PROOF_SKIP_BUILD: '1'
        run: tests/compose-proof/run.sh --case shutdown
      - name: The Compose proof (restore)
        env:
          COMPOSE_PROOF_SKIP_BUILD: '1'
        run: tests/compose-proof/run.sh --case restore

      # The app image is built here, and this is the one push-time build of
      # it — so it is scanned here, where a finding stops the commit that
      # brought it in rather than a release. Same scan release.yml runs
      # before publishing it. The Locus image is scanned in builder-image.
      - name: Scan the app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: cyfr:push
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

  # A release boots on each database. The `cyfr` release, built as
  # Dockerfile builds it (MIX_ENV=prod, the adapter chosen at compile time),
  # started against a fresh database with auto-migration on, from the
  # deployment file the `cyfr init` built from apps/codex writes: it
  # migrates the schema itself and answers the readiness check the image's
  # HEALTHCHECK runs, a public home answers at the address its name implies,
  # and a boot that raises exits non-zero naming why: every boot refusal of
  # the reach vectors, and, in a network namespace of its own (a
  # container's, holding the compose stack's address on a dummy interface),
  # a local release's bind to that address without the compose file's
  # assertion. Nothing else boots a release: the suite starts the
  # application under its test configuration, which migrates nothing and
  # reads no `.env`, so a boot that cannot migrate its database is
  # invisible to every other job here.
  release-boot:
    name: The cyfr release boots on ${{ matrix.db }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      # A database of its own, created empty: the boot is what puts a schema
      # in it. Test-only credentials, never used outside CI. The SQLite leg
      # does not reach it.
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: cyfr
          POSTGRES_PASSWORD: cyfr
          POSTGRES_DB: cyfr_release_boot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CYFR_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://cyfr:cyfr@localhost:5432/cyfr_release_boot' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A prod build of its own, per adapter: the adapter is compiled in, so
      # the two legs can share neither build nor release.
      - name: Cache deps and the prod build
        uses: ./.github/actions/setup-elixir
        with:
          cache-key-prefix: mix-release-boot-${{ matrix.db }}
      # Every cell's deployment file is the one `cyfr init`, built from
      # apps/codex, writes.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum
      - name: Install dependencies
        run: mix deps.get
      # The runner's own database names, against a docker stub: two runs on
      # one URL name and drop disjoint databases. No database is needed.
      - name: Each run names and drops databases of its own
        run: bash tests/release-boot/names-test.sh
      - name: Boot the release against a fresh ${{ matrix.db }} database
        run: tests/release-boot/boot.sh ${{ matrix.db }}

  # The browser harness (tests/browser/README.md): the `cyfr` release started
  # as release-boot starts one, on SQLite, serving two public tinctures, and
  # the frame-facts experiment run against it in every browser the official
  # Playwright image ships. The image is pinned by digest in
  # tests/browser/run.sh, so no browser binary is fetched here; Playwright's
  # library comes from tests/browser/package-lock.json, JavaScript only.
  # The experiment records what each browser allowed and fails only when it
  # could not observe an attempt. Every proof after it reuses the release
  # the experiment built (RELEASE_BOOT_SKIP_BUILD), each on its own cells
  # behind the harness's HTTPS front; a proof that uses a passkey drives
  # Chromium's virtual authenticator, so its passkey steps run in Chromium
  # alone.
  browser:
    name: Browser harness (Chromium, Firefox and WebKit; instance-entry, approval and file-offer proofs on Chromium; the canvas proof)
    runs-on: ubuntu-latest
    # Serial browser checks share one release build. The instance-entry,
    # approval and file-offer proofs run in Chromium at both viewports, and
    # the canvas proof runs at both viewports too.
    # A hang is cut here before the runner's six-hour limit.
    timeout-minutes: 145
    # The tincture proof's builds service runs the Locus image this run
    # built once.
    needs: locus-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache deps and the prod build
        uses: ./.github/actions/setup-elixir
        with:
          cache-key-prefix: mix-browser
      # The grant proof builds the command line from apps/codex.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/codex/go.mod
          cache-dependency-path: apps/codex/go.sum
      - name: Install dependencies
        run: mix deps.get
      - name: The frame-facts experiment
        env:
          BROWSER_OUT: ${{ runner.temp }}/proofs/frame-facts
        run: tests/browser/run.sh
      # The markdown hook's output after DOMPurify, which needs a browser's
      # DOM (tests/markdown-proof/README.md). It starts no release.
      - name: The markdown proof (Chromium)
        env:
          MARKDOWN_OUT: ${{ runner.temp }}/proofs/markdown
        run: tests/markdown-proof/run.sh
      # The Locus image this run built once (the locus-image job).
      - name: Fetch the Locus image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: locus-image
          path: ${{ runner.temp }}/locus-image
      - name: Load the Locus image
        run: |
          set -euo pipefail
          zstd -dc "$RUNNER_TEMP/locus-image/cyfr-locus.tar.zst" | docker load
          docker tag cyfr-locus:ci cyfr-locus:tincture-proof
      - name: The tincture proof
        env:
          RELEASE_BOOT_SKIP_BUILD: '1'
          PROOF_OUT: ${{ runner.temp }}/proofs/tincture
        run: tests/tincture-proof/run.sh cyfr-locus:tincture-proof
      - name: The frame sandbox containment proof
        env:
          RELEASE_BOOT_SKIP_BUILD: '1'
          PROOF_OUT: ${{ runner.temp }}/proofs/hostile-frame
        run: tests/hostile-frame-proof/run.sh
      - name: The pairing proof (Chromium alone, with its virtual WebAuthn authenticator)
        env:
          RELEASE_BOOT_SKIP_BUILD: '1'
          PROOF_OUT: ${{ runner.temp }}/proofs/pairing
        run: tests/pairing-proof/run.sh
      # Two homes on hostnames of their own over HTTPS, the shape the identity
      # and join proofs stand on: each a secure context, names the run's
      # authority did not sign refused, no cookie crossing between them, a
      # framed request refused, a fragment carried intact, and a passkey per
      # home in Chromium (tests/browser/README.md).
      - name: The multi-home smoke
        env:
          RELEASE_BOOT_SKIP_BUILD: '1'
          PROOF_OUT: ${{ runner.temp }}/proofs/multi-home-smoke
        run: tests/multi-home-smoke/run.sh
      # Enrollment, printed kits, a rotation, the restores and what each home
      # sees, against a directory of its own (tests/identity-proof/README.md).
      - name: The identity proof (Chromium alone, with its virtual WebAuthn authenticator)
        env:
          RELEASE_BOOT_SKIP_BUILD: '1'
          PROOF_OUT: ${{ runner.temp }}/proofs/identity
        run: tests/identity-proof/run.sh
      # A person joining a hub from their own home, on two directories: the
      # sign-in, the carry and a second profile in every browser, the passkey
      # steps and a paired device's in Chromium (tests/join-proof/README.md).
      - name: The join proof
        env:
          RELEASE_BOOT_SKIP_BUILD: '1'
          PROOF_OUT: ${{ runner.temp }}/proofs/join
        run: tests/join-proof/run.sh
      # The steps that need no execution engine and no model; the others are
      # the suite's (tests/grant-proof/README.md).
      - name: The grant proof (Chromium alone)
        env:
          RELEASE_BOOT_SKIP_BUILD: '1'
          PROOF_OUT: ${{ runner.temp }}/proofs/grant
        run: tests/grant-proof/run.sh
      - name: The instance-entry proof (Chromium, desktop and 720x720)
        env:
          RELEASE_BOOT_SKIP_BUILD: '1'
        run: |
          set -euo pipefail
          for viewport in desktop 720x720; do
            VAULT_PROOF_VIEWPORT="$viewport" PROOF_OUT="$RUNNER_TEMP/proofs/instance-entry/$viewport" tests/instance-entry-proof/run.sh
          done
      - name: The approval proof (Chromium, desktop and 720x720)
        env:
          RELEASE_BOOT_SKIP_BUILD: '1'
        run: |
          set -euo pipefail
          for viewport in desktop 720x720; do
            VAULT_PROOF_VIEWPORT="$viewport" PROOF_OUT="$RUNNER_TEMP/proofs/approval/$viewport" tests/approval-proof/run.sh
          done
      - name: The file-offer proof (Chromium, desktop and 720x720)
        env:
          RELEASE_BOOT_SKIP_BUILD: '1'
        run: |
          set -euo pipefail
          for viewport in desktop 720x720; do
            VAULT_PROOF_VIEWPORT="$viewport" PROOF_OUT="$RUNNER_TEMP/proofs/file-offer/$viewport" tests/file-offer-proof/run.sh
          done
      # The runner is the GitHub-hosted host class, held to its own canvas
      # budget (tests/canvas-proof/README.md).
      - name: The canvas proof (desktop and 720x720)
        env:
          RELEASE_BOOT_SKIP_BUILD: '1'
          CANVAS_PROOF_HOST_CLASS: github-hosted
        run: |
          set -euo pipefail
          for viewport in desktop 720x720; do
            CANVAS_PROOF_VIEWPORT="$viewport" PROOF_OUT="$RUNNER_TEMP/proofs/canvas/$viewport" tests/canvas-proof/run.sh
          done
      # Every proof's records, under proofs/<proof>, or
      # proofs/<proof>/<viewport> for a proof run at each viewport, kept so a
      # failed run's can be read, and a canvas record checked again with
      # `node proof.mjs --check-record`. Only the record files: nothing else
      # a proof leaves on a failed run is uploaded.
      - name: Upload the proofs' records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: proof-records
          path: |
            ${{ runner.temp }}/proofs/**/*-proof.json
            ${{ runner.temp }}/proofs/**/*-proof.md
            ${{ runner.temp }}/proofs/multi-home-smoke/multi-home-smoke.json
            ${{ runner.temp }}/proofs/multi-home-smoke/multi-home-smoke.md
            ${{ runner.temp }}/proofs/frame-facts/frame-facts.json
            ${{ runner.temp }}/proofs/frame-facts/frame-facts.md
            ${{ runner.temp }}/proofs/markdown/markdown.json
          retention-days: 14
      # The shipped Caddyfile in the Caddy image docker-compose.yml names, in
      # front of a stub upstream answering as cyfr's proxy listener: HSTS, the
      # endpoint's value, once on every response over TLS for a real host and
      # never for localhost, the upstream's headers through, plain HTTP
      # redirected, and the file loading with CADDY_ACME_EMAIL empty. Docker
      # alone; no release.
      - name: HSTS behind the shipped proxy
        run: tests/proxy-hsts/run.sh

  # The tailscale image docker-compose.yml pins is the one a passing
  # real-tailnet run recorded (tests/tailnet-real/verified-image, which only
  # a pass of tests/tailnet-real/run.sh writes): with no record, or one for
  # another tag or another digest under the same tag as `cyfr update` or
  # Dependabot writes, this fails until a real-tailnet run verifies the
  # pinned reference, since the Compose proof's stand-in certifies no
  # Tailscale binary.
  tailscale-image-guard:
    name: The pinned tailscale image is the one a real tailnet verified
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The guard's own cases
        run: bash tests/tailnet-real/guard-test.sh
      # The real-tailnet run's predicates on canned answers: a closed Serve
      # and the identity projection, the run itself being by hand.
      - name: The real-tailnet run's predicates
        run: bash tests/tailnet-real/predicates-test.sh
      - name: The pinned tailscale image is the verified one
        run: bash tests/tailnet-real/guard.sh

  seed-guards:
    name: Seed media (clean, immutable versions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Install media must be clean: build droppings under seed/ would be
      # excluded from every copy-on-write materialization but still counted
      # by its cap pre-check (Arca.Overlay.check_commit_cap/2) — a spurious refusal.
      - name: Seed ships no build droppings
        run: |
          set -uo pipefail
          # A scan of a missing tree finds nothing; refuse it.
          for root in seed/components seed/aqua; do
            if [ -z "$(git ls-files -- "$root" | head -1)" ]; then
              echo "::error::$root holds no tracked file — the scan would read nothing"
              exit 1
            fi
          done
          hits="$(find seed -type d \( -name target -o -name node_modules -o -name .git \) -print)"
          if [ -n "$hits" ]; then
            echo "::error::build droppings under seed/ — install media must be clean"
            echo "$hits"
            exit 1
          fi
      # A tincture ships its entry file and every asset the entry loads: a
      # declared build's output (`dist/`) is part of the seed media, so a
      # checkout that lacks any of it cannot register or serve the tincture.
      # Paths are matched literally, never as git pathspec globs.
      - name: Every seed tincture's entry and built assets are tracked
        run: |
          set -uo pipefail
          shopt -s nullglob
          tracked() { git ls-files --error-unmatch -- ":(literal)$1" >/dev/null 2>&1; }
          bad=""
          manifests=(seed/components/tinctures/local/*/*/cyfr-manifest.json)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::no seed tincture manifest matched — the step would check nothing"
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            vdir="$(dirname "$manifest")"
            # The owner's reading (Compendium.Tincture.entry_of/1): a canvas-placed
            # tincture's entry is the module its canvas block names, every other
            # tincture's is its declared entry, or the default when the entry is
            # absent or empty. A non-string entry is kept as text so it fails
            # the tracked check, as the owner refuses it.
            entry="$(jq -r 'if .tincture.frame.placement == "canvas" then (.tincture.canvas.module // empty) else (.tincture.entry | if . == null or . == "" then "index.html" else . end) end' "$manifest")" || { bad="$bad"$'\n'"$manifest: unreadable"; continue; }
            if [ -z "$entry" ]; then
              bad="$bad"$'\n'"$manifest: a canvas names no module"
              continue
            fi
            case "/$entry/" in
              */../*|*/./*|//*) bad="$bad"$'\n'"$manifest: entry '$entry' leaves the version directory"; continue ;;
            esac
            if ! tracked "$vdir/$entry"; then
              bad="$bad"$'\n'"$vdir/$entry: entry not tracked"
              continue
            fi
            # A built tincture is served from its build output, all of it tracked.
            if jq -e '.tincture.build' "$manifest" >/dev/null; then
              case "$entry" in
                dist/*) ;;
                *) bad="$bad"$'\n'"$manifest: a built tincture's entry lives under dist/, not '$entry'" ;;
              esac
              untracked="$(git ls-files --others -- "$vdir/dist")"
              if [ -n "$untracked" ]; then
                bad="$bad"$'\n'"$untracked"
              fi
            fi
            # Every local script, stylesheet and link the entry names.
            base="$(dirname "$vdir/$entry")"
            refs="$( (grep -oE '(src|href)="[^"]+"' "$vdir/$entry" || true) | sed -E 's/^(src|href)="([^"?#]*).*/\2/')"
            while IFS= read -r ref; do
              case "$ref" in
                ''|'#'*|/*|*:*) continue ;;
              esac
              ref="${ref#./}"
              if ! tracked "$base/$ref"; then
                bad="$bad"$'\n'"$base/$ref: named by $vdir/$entry, not tracked"
              fi
            done <<< "$refs"
          done
          bad="$(printf '%s\n' "$bad" | sed '/^$/d')"
          if [ -n "$bad" ]; then
            echo "::error::seed tincture entries or their assets are not tracked"
            echo "$bad"
            exit 1
          fi
      # The guard scripts' own cases, each in a scratch repository.
      - name: The CI guard scripts' own cases
        run: bash tests/ci-guards-test.sh
      # Require new version directories for seed changes; existing bundle
      # versions are immutable (scripts/ci/seed-guard.sh says what it
      # refuses).
      - name: Existing seed component versions are unmodified
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          else
            # A push names the commit it moved from. A new branch or a
            # force-push reports the null SHA, and the very first commit has
            # no parent — nothing to diff against, so nothing to guard.
            base="$BEFORE"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse --verify --quiet HEAD^ || true)"
            fi
            if [ -z "$base" ]; then
              echo "no comparable base for this push — nothing to check"
              exit 0
            fi
          fi
          scripts/ci/seed-guard.sh "$base"

  config-seam:
    name: Config keys (no compile-time/runtime split)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reject runtime reads or writes of compile-time configuration keys.
      # An intentional exception carries `config:compile-runtime-ok` on its
      # compile_env read's own line or in the comment block directly above
      # it (scripts/ci/config-seam.sh).
      - name: Keys read at compile time must not also be read at runtime
        run: scripts/ci/config-seam.sh

  vocabulary-gate:
    name: No org/project fossils (one tenancy vocabulary)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tenancy unit is the athanor and a conversation is a thread. This
      # asserts the old vocabularies — org/project, the athanor's retired
      # second name, conversation/topic subscription, the prism: PubSub
      # prefix, the keeper's retired role name, the WASM engine's retired
      # names, the gate's retired name, the desktop and card names the
      # canvas replaced and its retired measurement script — cannot creep
      # back into code, config, or operator-facing docs. Each retired name
      # is matched as a word or inside an identifier, never inside an
      # English word that merely contains its letters.
      # Free-word "org"/"project" is deliberately not gated (OCI annotations,
      # Mix.Project, Go module paths, "project directory" prose are legitimate).
      - name: Tier A/B fossil patterns must be absent
        run: |
          set -uo pipefail
          paths='apps config wit scripts tests Caddyfile docker-compose.yml Dockerfile Dockerfile.locus docker-entrypoint.sh .env.example .env.locus.example .gitignore .dockerignore README.md ARCHITECTURE.md CONTRIBUTING.md component-guide.md configuration-guide.md integration-guide.md tincture-guide.md identity-guide.md devices-guide.md'
          excl=':(exclude)**/node_modules/** :(exclude)**/package-lock.json :(exclude)**/priv/static/**'
          fail=0
          for p in \
            '\borg_id\b' \
            '\bproject_id\b' \
            '\bnormalize_(org|project|athanor)_id\b' \
            '\bscope_type\b' \
            '\bno_org\b' \
            '\buser_active_in_org\?' \
            'Arca\.Schemas\.(Org|Project)\b' \
            'Sanctum\.Tenancy\.(Orgs|Projects|Memberships)\b' \
            'Compendium\.ProjectSeeder\b' \
            'Compendium\.AthanorSeeder\b' \
            'Compendium\.Upstream\b' \
            'Compendium\.Bundle\b' \
            'Sanctum\.TenantScope\b' \
            'Arca\.Tenant\b' \
            'default_athanor' \
            'cyfr\.consent\.bootstrap' \
            ':org([^a-z_]|$)' \
            ':project([^a-z_]|$)' \
            'PrismWeb\.Endpoint\b' \
            'Prism\.AuthExchange\b' \
            'PrismWeb\.LiveClaimGate\b' \
            'CYFR_PRISM_' \
            'Prism\.AquaConversations\b' \
            ':aqua_path\b' \
            ':4001\b|4001:4001' \
            'CYFR_PORTA_' \
            'cyfr-porta' \
            'apps/porta/' \
            '[Cc]onversation|CONVERSATION' \
            'topic_subscription|TopicSubscription' \
            'Cyfr\.Topics\b' \
            'prism:[a-z_]' \
            'cyfr_contracts' \
            'CyfrContracts' \
            'Compendium\.(WITSource|WasmValidator)\b' \
            'Cyfr\.Test\.(SourceTree|CodeLines|Wait|AuthorityFixtures)\b' \
            'Emissary\.MCP\.VaultRef\b' \
            'Cyfr\.Ops\b' \
            '[Gg]rimoire|GRIMOIRE' \
            'OperationTable' \
            'Emissary\.MCP\.(RequestLog|RunningTasks|Tools\.SystemProvider)\b' \
            ':cyfr, :?tool_providers' \
            'Cyfr\.Execution\b' \
            'Cyfr\.Schedules\b' \
            'Crucible\\?\.[A-Za-z_{]' \
            'CYFR_CRUCIBLE_' \
            'crucible_' \
            ':crucible\b' \
            'crucible://' \
            'lib/crucible' \
            'CrucibleTest' \
            'cyfr\.crucible\.' \
            'test/crucible' \
            '"crucible"' \
            '\bopus_(workers|key)\b' \
            'Emissary\.MCP\.(McpServersTool|ExternalProvider|Bridge|ExternalServer\w*|ApprovalTool|NotesTool|ThreadTool|BackendDefinition|StatusRedaction)\b' \
            'Compendium\.MCP\b' \
            'Sanctum\.MCP\b' \
            'apps/spawn/' \
            'cyfr-spawn' \
            'spawn_protocol\.json' \
            'CYFR_SPAWN_CHANNEL' \
            'cyfr-worker/v1' \
            'cyfr\.worker\.key' \
            'Locus\.Spawner\b' \
            'Locus\.Test\.FakeSpawner\b' \
            '(^|[^A-Za-z])([Ss]pawners?([^a-z]|$)|SPAWNERS?([^A-Z]|$))|[a-z]Spawner' \
            'apps/opus\b' \
            '"apps", *"(opus|keeper)"' \
            'apps/\{([^},]*,)*(opus|keeper)[,}]' \
            'Dockerfile\.opus' \
            '\.env\.opus' \
            'cyfr-opus([^-A-Za-z0-9_]|$)' \
            '(^|[^A-Z0-9_])OPUS_' \
            '\bOPUS\b' \
            'CYFR_OPUS_(KEY|WORKERS|WATCH_)' \
            'wrk_opus' \
            'OpusService' \
            'cyfr\.opus\.key' \
            'Opus\\?\.(Application|AsyncTracker|Cache|ComponentCache|ComponentType|Credentials|EdgeGuard|Egress|FormulaHandler|HostClient|HttpHandler|HttpRequestValidation|HttpStreamHandler|Keeper|MixProject|OAuthHandler|Relay|Release|Runner|RunnerPool|RunnerProcess|Runtime|Settings|SharedEngine|StorageHandler|Subtree|Test|WorkerListener|WorkerService)\b' \
            'Opus\\?\.(ActivationStamping|Application|AsyncTracker|AttachedFetch|AuthorityExecutionCharacterization|AuthorityPlumbing|BootstrapFirstRun|BudgetConcurrencyCharacterization|CancelCascadeCharacterization|Chain|ComponentCache|ComponentType|Credentials|DirectKeeper|EdgeGuard|Egress|ExecutionProvenance|ExecutorCancelPenalty|ExecutorCascade|ExecutorMaskedOutput|ExecutorRateLimit|ExecutorRegistration|FormulaHandler|FormulaHandlerMcp|FormulaHandlerRunner|GenServerCatchall|HostClient|HttpHandler|HttpHandlerEnforcement|HttpRequestValidation|HttpStreamHandler|HttpStreamHandlerBoundary|KeeperChannel|KeeperMemory|KeeperVectors|LogFilterBoot|MemoryBound|ModelContract|ModelsCatalogue|NestedProbeFixture|OAuthHandler|OrphanChildren|Relay|Release|ResourceLimits|RestartRequired|RetainedInput|Runner|RunnerBoundary|RunnerControlVectors|RunnerPool|RunnerReuse|Runtime|SecretAudit|Security|SeedModelCatalysts|Settings|StorageHandler|StoreLimits|Timeout|VaultDenial|WasiCapabilities|WorkerListener|WorkerService|WorkerServicePool|WorkerServiceWire)Test\b' \
            'Opus\.\{ *([A-Za-z0-9_.]+ *, *)*(Application|AsyncTracker|Cache|ComponentCache|ComponentType|Credentials|EdgeGuard|Egress|FormulaHandler|HostClient|HttpHandler|HttpRequestValidation|HttpStreamHandler|Keeper|MixProject|OAuthHandler|Relay|Release|Runner|RunnerPool|RunnerProcess|Runtime|Settings|SharedEngine|StorageHandler|Subtree|Test|WorkerListener|WorkerService) *([,}]|$)' \
            'Cyfr\.Opus\.Key\b' \
            '\bopus_(named_by_cyfr_tests|service|watch)' \
            'MacEnvelope\.domain\(:opus\)' \
            'MacEnvelope\.label\(:worker\)' \
            '\{:opus, "worker"\}' \
            '@type service ::[^#]*:worker\b' \
            '\{PREFIX\}/worker\b' \
            '(\[:cyfr, :opus, :|cyfr\.opus\.)(formula|mcp_tool|storage|http|runtime)\b' \
            'Opus\.Telemetry\.(formula|mcp_tool|storage)_' \
            'http:\\?/\\?/opus:' \
            '/app/bin/opus\b' \
            '/run/opus\b' \
            '/var/lib/opus\b' \
            '\bopus-runner' \
            'cyfr-opus-(canary|memory|namespace|runners|unbounded)\b' \
            '\bintegration/opus\b' \
            '"integration", *"opus"' \
            '\.\./opus/(lib|test)\b' \
            '\bworker-image\b' \
            'compose\.worker\.yml' \
            'opus-independence' \
            'LOCUS_BUILDS_LOG_' \
            'cyfr-keeper' \
            'apps/keeper\b' \
            'github\.com/cyfr/keeper\b' \
            'CYFR_WORKER_KEY' \
            'CYFR_WORKERS\b' \
            'CYFR_EXECUTION_EVENTS_' \
            'CYFR_MAX_CONCURRENT_EXECUTIONS' \
            'CYFR_WORKER_WATCH_' \
            '(^|[^A-Za-z])([Ee]states?([^a-z]|$)|ESTATES?([^A-Z]|$))|[a-z]Estate' \
            'Prima\.Card\b' \
            'Prism\.Desktop\b' \
            'shell_desktop|DesktopLive' \
            'tincture\.cards' \
            'canvas-(card|stall)\b' \
            'measure\.exs' \
            ; do
            hits="$(git grep -InE "$p" -- $paths $excl || true)"
            if [ -n "$hits" ]; then
              echo "::error::fossil pattern $p"
              echo "$hits"
              fail=1
            fi
          done
          # Check athanor_id constraints in every migration. Only the baseline's
          # memberships, sessions and decision_logs columns may be nullable.
          # `grep -c` exits 1 when the count is zero, and the job's shell is
          # `bash -e`, so an unguarded count on a migration that adds no
          # athanor_id column kills the job silently — which is what every
          # check below this point had been dying behind.
          m=apps/arca/priv/repo/migrations/20260815000000_baseline.exs
          nullable="$(grep -cE 'add :athanor_id' "$m" || true)"
          notnull="$(grep -cE 'add :athanor_id.*null: false' "$m" || true)"
          if [ "$((nullable - notnull))" -ne 3 ]; then
            echo "::error::exactly three nullable athanor_id columns are allowed (memberships, sessions, decision_logs); found $((nullable - notnull))"; fail=1
          fi
          for other in apps/arca/priv/repo/migrations/*.exs; do
            [ "$other" = "$m" ] && continue
            n="$(grep -cE 'add :athanor_id' "$other" || true)"
            nn="$(grep -cE 'add :athanor_id.*null: false' "$other" || true)"
            if [ "$n" -ne "$nn" ]; then
              echo "::error file=$other::athanor_id must be null: false outside the baseline (the three nullable fabrics are baseline-only)"; fail=1
            fi
          done
          if grep -nE 'add :athanor_id.*default:' apps/arca/priv/repo/migrations/*.exs; then
            echo "::error::athanor_id column with a default — a forgotten athanor must fail, never default into somebody's"; fail=1
          fi
          if [ "$(grep -c 'COALESCE(athanor_id' "$m" || true)" -ne 1 ]; then
            echo "::error::expected exactly one COALESCE(athanor_id (the membership assignment index)"; fail=1
          fi
          # Runtime storage must stay under data/.
          if ! grep -q '^/data/$' .gitignore || grep -qE '^(components/\*|!components/_bundle/)$' .gitignore; then
            echo "::error::.gitignore must ignore /data/ and carry no components/* allowlist pair"; fail=1
          fi
          # The template `cyfr init` writes must agree with the repo's own.
          # Anchored the way the .gitignore check above is: an unanchored
          # '/data/' also matched the config template's `./data/cyfr.db` and a
          # code comment, so the ignore entry this guards could be deleted —
          # every `cyfr init` project then committing its runtime state — with
          # the gate still green.
          if ! grep -q '^/data/$' apps/codex/cmd/lifecycle.go || grep -qE 'components/\*$|!components/_bundle/' apps/codex/cmd/lifecycle.go; then
            echo "::error::lifecycle.go .gitignore template must ignore /data/ and carry no components/* allowlist pair"; fail=1
          fi
          # Operator-facing docs describe the unified athanor layout — not the
          # old two-segment one, not the split components/{athanor} roots, and
          # not a bare components/ tree at the project root.
          docs_hits="$(git grep -InE 'components/local/default|/t/:publisher/|/t/<publisher>/|components/\{athanor|^components/$' -- README.md component-guide.md configuration-guide.md integration-guide.md tincture-guide.md identity-guide.md devices-guide.md .env.example || true)"
          if [ -n "$docs_hits" ]; then
            echo "::error::guides still describe a pre-unification layout"; echo "$docs_hits"; fail=1
          fi
          # Per-athanor storage diagrams must name physical tenant roots.
          # The names below are not tenant roots. `data/` is no longer among
          # them: the guest's scope and the athanor's root are one name now
          # (Arca.Storage.tenant_roots/0).
          phantom_hits="$(git grep -InE '^ +[├└│|]+─* *(config|builds)/ ' -- README.md component-guide.md configuration-guide.md integration-guide.md tincture-guide.md identity-guide.md devices-guide.md || true)"
          if [ -n "$phantom_hits" ]; then
            echo "::error::guide tree diagrams name a scope that is not a tenant root (see Arca.Storage.tenant_roots/0)"; echo "$phantom_hits"; fail=1
          fi
          # Tracked seed media belongs under seed/.
          if git ls-files 'components/*' 'aqua/*' | grep -q .; then
            echo "::error::seed media lives under seed/ — nothing may be tracked at components/ or aqua/"; fail=1
          fi
          if git ls-files 'seed/*' | grep -vE '^seed/(components|aqua)/' | grep -q .; then
            echo "::error::seed/ carries only its two roots, components/ and aqua/"; fail=1
          fi
          # The deployment shell spells the volume/seed layout outside Elixir
          # — compose mounts, the Docker seed bake, the init template, the
          # scaffold tarball. Witness each spelling so a layout rename in
          # Arca.Storage cannot silently drift past them.
          # A comment that MENTIONS the spelling is not the spelling. Strip
          # whole-line comments first, or deleting the code a guard names is
          # masked by the paragraph explaining it — which is exactly what
          # `docker-entrypoint.sh '/app/seed/aqua'` did: the string sits in
          # three header comments above the seeding block it guards, so the
          # block could go and the gate would stay green.
          # No pipe: `grep -q` exits at the first match, and the strip
          # upstream of it then dies of SIGPIPE, which `pipefail` reports as
          # a failed pipeline even though the string was found. That made
          # these assertions answer differently on a fast machine than a
          # slow one — `lifecycle.go` was reported as no longer spelling a
          # string it still contains.
          assert_spelling() {
            stripped="$(grep -vE '^[[:space:]]*(#|//)' "$1" || true)"
            case "$stripped" in
              *"$2"*) : ;;
              *) echo "::error::$1 no longer spells '$2' — the deployment layout drifted from Arca.Storage"; fail=1 ;;
            esac
          }
          assert_spelling docker-compose.yml './data:/app/data'
          assert_spelling docker-compose.yml './aqua:/app/seed/aqua'
          assert_spelling Dockerfile 'CYFR_SEED_PATH=/app/seed'
          assert_spelling Dockerfile 'COPY seed/components/'
          assert_spelling docker-entrypoint.sh '/app/seed/aqua'
          assert_spelling apps/codex/cmd/lifecycle.go '"data"'
          assert_spelling apps/codex/cmd/lifecycle.go '"aqua"'
          assert_spelling scripts/scaffold-tarball.sh '-C seed aqua'
          exit $fail
