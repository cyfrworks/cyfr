name: Test
on:
  push:
    branches: [main]
    paths:
      - 'apps/cyfr/**'
      - 'apps/opus/**'
      - 'apps/locus/**'
      - 'config/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.github/workflows/test.yml'
      # Compile-embedded (@external_resource) into compendium/mcp/aqua_tool.ex.
      - 'component-guide.md'
      - 'tincture-guide.md'
      - 'integration-guide.md'
      # Release-critical surfaces with no workflow of their own: run the
      # suite so a change here at least builds against a green tree.
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'docker-entrypoint.sh'
      - '.env.example'
      - 'wit/**'
      - 'aqua/**'
  pull_request:
    paths:
      - 'apps/cyfr/**'
      - 'apps/opus/**'
      - 'apps/locus/**'
      - 'config/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.github/workflows/test.yml'
      # Compile-embedded (@external_resource) into compendium/mcp/aqua_tool.ex.
      - 'component-guide.md'
      - 'tincture-guide.md'
      - 'integration-guide.md'
      # Release-critical surfaces with no workflow of their own: run the
      # suite so a change here at least builds against a green tree.
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'docker-entrypoint.sh'
      - '.env.example'
      - 'wit/**'
      - 'aqua/**'
permissions:
  contents: read
env:
  MIX_ENV: test
  ERL_CRASH_DUMP_SECONDS: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    name: Elixir Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    # Both adapters must stay green. SQLite is the shipped default; Postgres is
    # bring-your-own. The data layer is Ecto-schema-backed so column values cast
    # to the same Elixir types on both, and both legs are blocking.
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      # Test-only ephemeral database — these credentials (and CYFR_SECRET_KEY_BASE
      # below) are non-secret CI fixtures for the Postgres container, never used
      # outside CI.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cyfr
          POSTGRES_PASSWORD: cyfr
          POSTGRES_DB: cyfr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CYFR_DATABASE: ${{ matrix.db }}
      CYFR_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://cyfr:cyfr@localhost:5432/cyfr_test' || '' }}
      CYFR_SECRET_KEY_BASE: ${{ matrix.db == 'postgres' && 'JspnK9M8XQE1HFBRZWuzJqK8ZX8ITp5vPQ6MJv2RmFfKpGr2fEhAgSf3UqBT5xTk' || '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        id: beam
        with:
          otp-version: '28'
          elixir-version: '1.19.5'
      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.db }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.db }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - name: Cache cargo-component
        id: cargo-component-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-component
          key: ${{ runner.os }}-cargo-component-0.21.1
      # Locus's compile-path tests are tagged :requires_cargo_component and
      # excluded when the binary is absent — install it so they actually run.
      # The runner ships rustup; only the wasm targets and the tool are added.
      - name: Install cargo-component
        run: |
          rustup target add wasm32-wasip1 wasm32-wasip2
          if [ "${{ steps.cargo-component-cache.outputs.cache-hit }}" != "true" ]; then
            cargo install cargo-component --version 0.21.1 --locked
          fi
          cargo-component --version
      - name: Install dependencies
        run: mix deps.get
      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors
      - name: Static analysis
        run: mix credo --only=warning
      - name: Check formatting
        run: mix format --check-formatted
      - name: Run tests
        run: mix test

  arca-seam:
    name: Arca single-seam (no untagged filesystem I/O)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Arca.Storage's single-seam policy: all file/blob I/O flows through the
      # storage adapter. A direct File.* / Path.wildcard call outside the adapter
      # must be acknowledged with an `# arca:bypass-ok=<A|B|C|D>` tag (see the
      # bypass-group table in Arca.Storage). This asserts every file that makes
      # such a call carries a tag, so a new module cannot silently bypass the
      # object-store seam.
      - name: Assert direct filesystem calls are tagged
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r f; do
            case "$f" in
              */arca/adapters/*) continue ;;
              apps/cyfr/lib/arca/storage.ex) continue ;;
            esac
            calls="$(grep -nE '(^|[^A-Za-z0-9_.])File\.[a-z]|Path\.wildcard' "$f" | grep -v '^[0-9]*: *#' || true)"
            if [ -n "$calls" ] && ! grep -q 'arca:bypass-ok' "$f"; then
              echo "::error file=$f::direct filesystem I/O without an arca:bypass-ok tag (see Arca.Storage single-seam policy)"
              echo "$calls"
              fail=1
            fi
          done < <(git ls-files 'apps/cyfr/lib/*.ex' 'apps/cyfr/lib/**/*.ex' 'apps/opus/lib/*.ex' 'apps/opus/lib/**/*.ex' 'apps/locus/lib/*.ex' 'apps/locus/lib/**/*.ex')
          if [ "$fail" -ne 0 ]; then
            echo "Untagged filesystem I/O found. Route it through Arca, or tag it # arca:bypass-ok=<A|B|C|D>."
            exit 1
          fi
