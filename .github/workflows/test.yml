name: Test
on:
  push:
    branches: [main]
    paths:
      # Every app: the Elixir suite also pins the CLI's grammar and the
      # bridge's protocol literals (ClientProtocolDriftTest, StackShapeTest).
      - 'apps/**'
      - 'config/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.github/workflows/test.yml'
      # Compile-embedded (@external_resource) into compendium/mcp/aqua_tool.ex.
      - 'component-guide.md'
      - 'tincture-guide.md'
      - 'integration-guide.md'
      # Release-critical surfaces with no workflow of their own: run the
      # suite so a change here at least builds against a green tree.
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'docker-entrypoint.sh'
      - '.env.example'
      # The services' env examples: the stack shape test reads them and the
      # scaffold tarball ships them.
      - '.env.*.example'
      - 'wit/**'
      - 'seed/**'
      # Surfaces the vocabulary gate scans: it cannot turn red on a change it
      # never runs on.
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    paths:
      # Every app: the Elixir suite also pins the CLI's grammar and the
      # bridge's protocol literals (ClientProtocolDriftTest, StackShapeTest).
      - 'apps/**'
      - 'config/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.github/workflows/test.yml'
      # Compile-embedded (@external_resource) into compendium/mcp/aqua_tool.ex.
      - 'component-guide.md'
      - 'tincture-guide.md'
      - 'integration-guide.md'
      # Release-critical surfaces with no workflow of their own: run the
      # suite so a change here at least builds against a green tree.
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - 'Caddyfile'
      - 'docker-entrypoint.sh'
      - '.env.example'
      # The services' env examples: the stack shape test reads them and the
      # scaffold tarball ships them.
      - '.env.*.example'
      - 'wit/**'
      - 'seed/**'
      # Surfaces the vocabulary gate scans: it cannot turn red on a change it
      # never runs on.
      - 'scripts/**'
      - 'tests/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.gitignore'
      - '.dockerignore'
  # Expose this workflow for tag-triggered image and release jobs.
  workflow_call:
permissions:
  contents: read
env:
  MIX_ENV: test
  ERL_CRASH_DUMP_SECONDS: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    name: Elixir Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    # Both adapters must stay green. SQLite is the shipped default; Postgres is
    # bring-your-own. The data layer is Ecto-schema-backed so column values cast
    # to the same Elixir types on both, and both legs are blocking.
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      # Test-only ephemeral database — these credentials (and CYFR_SECRET_KEY_BASE
      # below) are non-secret CI fixtures for the Postgres container, never used
      # outside CI.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cyfr
          POSTGRES_PASSWORD: cyfr
          POSTGRES_DB: cyfr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CYFR_DATABASE: ${{ matrix.db }}
      CYFR_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://cyfr:cyfr@localhost:5432/cyfr_test' || '' }}
      CYFR_SECRET_KEY_BASE: ${{ matrix.db == 'postgres' && 'JspnK9M8XQE1HFBRZWuzJqK8ZX8ITp5vPQ6MJv2RmFfKpGr2fEhAgSf3UqBT5xTk' || '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        id: beam
        with:
          otp-version: '29'
          elixir-version: '1.20.3'
      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.db }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.db }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - name: Cache cargo-component
        id: cargo-component-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-component
          key: ${{ runner.os }}-cargo-component-0.21.1
      # The compile-path tests — Locus's own and the control plane's build
      # over the wire to the real builds service (test/integration/locus) —
      # are tagged :requires_cargo_component and excluded when the binary is
      # absent; install it so they actually run. The runner ships rustup;
      # only the wasm targets and the tool are added.
      - name: Install cargo-component
        run: |
          rustup target add wasm32-wasip1 wasm32-wasip2
          if [ "${{ steps.cargo-component-cache.outputs.cache-hit }}" != "true" ]; then
            cargo install cargo-component --version 0.21.1 --locked
          fi
          cargo-component --version
      # Each model catalyst's `model/chat@1` mapping runs on the host
      # target; the shipped binaries are not rebuilt here.
      - name: Test the model catalysts
        run: |
          shopt -s nullglob
          chats=(seed/components/catalysts/local/*/*/src/src/chat.rs)
          # A glob that matches nothing would test nothing; refuse it.
          if [ "${#chats[@]}" -eq 0 ]; then
            echo "::error::no model catalyst source matched — the step would test nothing"
            exit 1
          fi
          for chat in "${chats[@]}"; do
            src="$(dirname "$(dirname "$chat")")"
            (cd "$src" && cargo test --quiet --target-dir "$RUNNER_TEMP/catalyst-guest-target")
          done
      # Every shipped binary is the build of its source: the stamp the build
      # script writes binds the binary's digest to the source tree's, so a
      # guest edit without a rebuild fails here, toolchain or not.
      - name: Every stamped seed guest is built from its source
        run: |
          shopt -s nullglob
          stamps=(seed/components/*/local/*/*/src/build.stamp)
          if [ "${#stamps[@]}" -eq 0 ]; then
            echo "::error::no seed build stamp matched — the step would check nothing"
            exit 1
          fi
          for stamp in "${stamps[@]}"; do
            scripts/build-seed-guest.sh "$(dirname "$(dirname "$stamp")")" --check
          done
      # The loop above only visits directories that already carry a stamp, so
      # a guest shipped without one was never bound to its source at all —
      # which is how `http` and `files` drifted to a crate version naming a
      # release they are not. Both facts are checked for every guest here.
      - name: Every seed guest carries a stamp, and its crate version is its own
        run: |
          set -uo pipefail
          shopt -s nullglob
          bad=""
          guests=0
          manifests=(seed/components/*/local/*/*/cyfr-manifest.json)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::no seed component manifest matched — the step would check nothing"
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            vdir="$(dirname "$manifest")"
            # A guest is a directory with Rust sources; tinctures have none.
            [ -f "$vdir/src/Cargo.toml" ] || continue
            guests=$((guests + 1))
            version="$(basename "$vdir")"
            if [ ! -f "$vdir/src/build.stamp" ]; then
              bad="$bad"$'\n'"$vdir: no src/build.stamp"
            fi
            crate="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' "$vdir/src/Cargo.toml" | head -1)"
            if [ "$crate" != "$version" ]; then
              bad="$bad"$'\n'"$vdir: Cargo.toml says $crate"
            fi
          done
          if [ "$guests" -eq 0 ]; then
            echo "::error::no seed guest has Rust sources — the step would check nothing"
            exit 1
          fi
          bad="$(printf '%s\n' "$bad" | sed '/^$/d')"
          if [ -n "$bad" ]; then
            echo "::error::seed guests must carry a build stamp and a crate version equal to their directory"
            echo "$bad"
            exit 1
          fi
      - name: Install dependencies
        run: mix deps.get
      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors
      - name: Static analysis
        run: mix credo --only=warning
      - name: Check formatting
        run: mix format --check-formatted
      # --warnings-as-errors covers the .exs files `mix test` loads, which a
      # forced compile never reads: a warning in a test fails the build as
      # one in the application does.
      - name: Run tests
        run: mix test --warnings-as-errors

  opus-independence:
    name: Opus compiles and tests from its declared apps alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        id: beam
        with:
          otp-version: '29'
          elixir-version: '1.20.3'
      - name: Cache deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-opus-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-opus-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - name: Install dependencies
        run: mix deps.get
      # The worker service releases without the control plane: a checkout
      # holding only the lock, the contracts, Opus, the fetched deps and the
      # WIT tree (`Compendium.WITSource` embeds it; `Opus.Runtime` reads the
      # same tree) compiles it with warnings as errors and runs its suite,
      # against a scripted host and no database.
      - name: Compile and test Opus from its declared apps alone
        run: |
          set -euo pipefail
          island="$RUNNER_TEMP/opus-island"
          mkdir -p "$island/apps"
          cp mix.lock "$island/"
          cp -R apps/cyfr_contracts apps/opus "$island/apps/"
          cp -R deps wit "$island/"
          cd "$island/apps/opus"
          mix compile --warnings-as-errors
          mix test

  locus-independence:
    name: Locus compiles and tests from its declared apps alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        id: beam
        with:
          otp-version: '29'
          elixir-version: '1.20.3'
      - name: Cache deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-locus-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-locus-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - name: Install dependencies
        run: mix deps.get
      # The builder releases without the control plane: a checkout holding
      # only the lock, the contracts, Locus, the fetched deps, the WIT tree
      # (`Compendium.WITSource` embeds it), the vector files its wire and
      # spawner tests read (tests/fixtures) and the locus release's runtime
      # configuration (config/locus_runtime.exs, which its config test
      # evaluates) compiles it with warnings as errors and runs its suite,
      # against no database. Unlike Opus's, Locus's vector tests fail
      # rather than skip without the vector file.
      - name: Compile and test Locus from its declared apps alone
        run: |
          set -euo pipefail
          island="$RUNNER_TEMP/locus-island"
          mkdir -p "$island/apps" "$island/config" "$island/tests"
          cp mix.lock "$island/"
          cp -R apps/cyfr_contracts apps/locus "$island/apps/"
          cp -R deps wit "$island/"
          cp -R tests/fixtures "$island/tests/"
          cp config/locus_runtime.exs "$island/config/"
          cd "$island/apps/locus"
          mix compile --warnings-as-errors
          mix test

  s3-minio:
    name: S3 adapter vs MinIO
    runs-on: ubuntu-latest
    env:
      CYFR_DATABASE: sqlite
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        id: beam
        with:
          otp-version: '29'
          elixir-version: '1.20.3'
      - name: Cache deps and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-minio-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-minio-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      # The stub suite verifies request shape; only a real implementation
      # verifies the signature over pre-percent-encoded URLs and the
      # Content-MD5-signed DeleteObjects batch. Credentials are non-secret
      # CI fixtures mirrored in s3_minio_test.exs.
      - name: Start MinIO
        run: |
          # docker.io/minio/minio refuses anonymous pulls; quay.io is the
          # project's own registry. Pinned by digest (RELEASE.2025-09-07T16-13-09Z)
          # like every other image and action in these workflows.
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=cyfrtest -e MINIO_ROOT_PASSWORD=cyfrtest123 \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
      - name: Install dependencies
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become healthy" >&2
          docker logs minio || true
          exit 1
      # From the umbrella root: the CYFR suite's boot wires the Opus worker
      # service, which a run from apps/cyfr does not load.
      - name: Run the S3 integration suite
        run: mix test apps/cyfr/test --only s3_integration
      # What the server thought of the requests, when it refused them.
      - name: MinIO logs
        if: failure()
        run: docker logs minio

  builder-image:
    name: Builder image (lock lifecycle, isolation, memory bound, headroom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The service bounds every build with a cgroup of its own, which needs
      # the security option writable-cgroups=true: Docker Engine 28 or later
      # on a cgroup v2 host. Without either every case below fails for a
      # reason the suite does not name, so this names it first.
      - name: Docker Engine 28 or later on cgroup v2
        run: |
          set -euo pipefail
          version="$(docker version --format '{{.Server.Version}}')"
          cgroup="$(docker info --format '{{.CgroupVersion}}')"
          echo "Docker Engine $version on cgroup v$cgroup"
          fail=0
          if [ "${version%%.*}" -lt 28 ]; then
            echo "::error::Docker Engine $version is older than 28: writable-cgroups=true, which bounds every build, needs Docker Engine 28 or later"
            fail=1
          fi
          if [ "$cgroup" != "2" ]; then
            echo "::error::this runner's Docker Engine runs on cgroup v$cgroup: writable-cgroups=true, which bounds every build, needs a cgroup v2 host"
            fail=1
          fi
          exit "$fail"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the builder image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.locus
          load: true
          tags: cyfr-locus:smoke
          cache-from: type=gha,scope=locus
          cache-to: type=gha,scope=locus,mode=max
      # docker-compose.yml's locus-builds service with its own settings
      # (layered with tests/builder-image/compose.locus-builds.yml for the
      # image and a loopback port), every request signed on the build wire
      # under a key of the run's own. Builds fetch from crates.io and the
      # npm registry.
      - name: Build a component through its lock lifecycle, and a tincture
        run: python3 scripts/builder-smoke.py cyfr-locus:smoke

      # Under the same settings: cyfr-spawn holds exactly SETUID|SETGID|KILL
      # and the release none, with no distribution listener, and the release
      # refuses to serve without cyfr-spawn; a build runs under a pooled uid
      # in a 0700 home, cannot read or signal the release (whose environ
      # holds the builds key), list the home root or read a concurrent
      # build's tree; a daemon a build.rs starts is gone, with the home, when
      # the response arrives; with a pool of one uid nothing a build leaves
      # outside its home (tests/fixtures/residue-canary.go) reaches the next;
      # and without writable-cgroups=true every build is answered
      # `unavailable`, naming the option, and no build's uid ever runs.
      - name: Build isolation, uid reuse, and the refusal without the option
        run: python3 tests/builder-image/isolation.py cyfr-locus:smoke

      # Every case: the keeper's own bound in the running service, and a
      # hostile JavaScript, Rust build.rs, process-tree and home-filling
      # build each ended at its 1 GiB bound as the wire's `memory` class
      # with no process or home of its uid left, a sibling build completing,
      # and the release untouched.
      - name: Every build's memory bound
        run: python3 tests/builder-image/memory.py cyfr-locus:smoke

      # The service's own memory, idle, answering a largest result, and
      # answering two beside two builds at their bounds, fits in what the
      # container's limit (LOCUS_BUILDS_MEMORY_LIMIT) leaves beside the
      # concurrent builds' bounds.
      - name: The container's limit holds the builds and the service
        run: python3 tests/builder-image/headroom.py cyfr-locus:smoke

      # The same scan docker.yml runs before publishing the builder image.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cyfr-locus:smoke
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

  worker-image:
    name: Worker image (runner kills, memory bound, settlement, cleanup)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The service bounds every runner with a cgroup of its own, which needs
      # the security option writable-cgroups=true: Docker Engine 28 or later
      # on a cgroup v2 host. Without either every case below fails for a
      # reason the suite does not name, so this names it first.
      - name: Docker Engine 28 or later on cgroup v2
        run: |
          set -euo pipefail
          version="$(docker version --format '{{.Server.Version}}')"
          cgroup="$(docker info --format '{{.CgroupVersion}}')"
          echo "Docker Engine $version on cgroup v$cgroup"
          fail=0
          if [ "${version%%.*}" -lt 28 ]; then
            echo "::error::Docker Engine $version is older than 28: writable-cgroups=true, which bounds every runner, needs Docker Engine 28 or later"
            fail=1
          fi
          if [ "$cgroup" != "2" ]; then
            echo "::error::this runner's Docker Engine runs on cgroup v$cgroup: writable-cgroups=true, which bounds every runner, needs a cgroup v2 host"
            fail=1
          fi
          exit "$fail"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.opus
          load: true
          tags: cyfr-opus:smoke
          cache-from: type=gha,scope=opus
          cache-to: type=gha,scope=opus,mode=max
      # docker-compose.yml's opus service with its own settings (layered
      # with tests/worker-image/compose.worker.yml for the image, a loopback
      # port and a pool of two), reaching a scripted control plane on this
      # runner: a spinning guest killed at its deadline with its process
      # gone and CPU flat, a sibling that completes meanwhile, the service's
      # VM killed and the container restarted as a new boot, the control
      # plane cut with the attempt settling at its deadline, a child
      # admitted after its parent's kill that never runs, a stream the
      # control plane stops answering, a tainted runner never reassigned,
      # and the queue age of a fresh runner; and memory (memory.py's cases):
      # every runner in a cgroup of its own at the service's bound, a
      # formula's six children each holding the 64 MiB the engine lets it
      # have, together past the bound in their runner, ended with it at
      # exactly that bound while the container's limit is untouched, the
      # exit reported with every child's attempt, the uid emptied and
      # scrubbed before its reuse and the sibling completing, and without
      # writable-cgroups=true no runner process ever starting. Each case observed as the service detects it, as the
      # control plane records it and as the container's processes, uids,
      # homes, groups, memory and CPU show it.
      - name: Runner kills, memory bound, settlement and cleanup
        run: python3 tests/worker-image/runners.py cyfr-opus:smoke

      # The same scan docker.yml runs before publishing the worker image.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cyfr-opus:smoke
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

  # D15: bridge backends isolated from each other and from the bridge. All
  # four suites run here, in the workflow the tag's `verify` calls, so the
  # release gates on them; three of them used to run in node-ci.yml, which
  # nothing at the tag waited for. One job, because both images are built
  # once for every suite that needs them.
  bridge-image:
    name: Bridge image (isolation, refusals, residue, failures and leaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the app image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: cyfr:bridge-e2e
          cache-from: type=gha,scope=cyfr-bridge-e2e
          cache-to: type=gha,scope=cyfr-bridge-e2e,mode=max
      - name: Build the bridge image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.node
          target: mcp-bridge
          load: true
          tags: cyfr-mcp-bridge:bridge-e2e
          cache-from: type=gha,scope=mcp-bridge-e2e
          cache-to: type=gha,scope=mcp-bridge-e2e,mode=max

      # Two owners' probe backends under the mcp-bridge service's own
      # settings, driven by requests signed as CYFR signs them
      # (tests/bridge-image/controller.mjs): each runs under its own pooled
      # uid (never 0 or the bridge's), neither can read the other's home or
      # /proc environ or signal it, the spawner holds exactly
      # SETUID|SETGID|KILL (CapEff 0xe0) and no inet socket, the bridge holds
      # no capability, the root is read-only, and releasing an owner leaves no
      # process of its uid, a setsid daemon ignoring SIGTERM included, and no
      # home. Also: the refused boot without a valid key, the spawner's
      # refusal of Docker's default capabilities, and retirement on loss and
      # on stop.
      - name: Backend isolation
        env:
          BRIDGE_IMAGE: cyfr-mcp-bridge:bridge-e2e
        run: node --test tests/bridge-image/isolation.test.mjs

      # A forged MAC, a timestamp outside the window, a control message below
      # the high-water mark, a stale or future epoch, a replayed nonce and a
      # captured invoke sent again after `docker restart` are refused, and a
      # sync the uid pool cannot hold spawns nothing.
      - name: Refusals
        env:
          BRIDGE_IMAGE: cyfr-mcp-bridge:bridge-e2e
        run: node --test tests/bridge-image/refusals.test.mjs

      # With a pool of one uid: a backend can write outside its home only
      # into the home root; the entries it leaves there, a directory tree it
      # made unwritable, System V shared memory, semaphores and message
      # queues and a POSIX message queue (tests/fixtures/residue-canary.go)
      # are gone before the next owner runs under the same uid. The spawner
      # refuses a writable root, a shared /tmp and Docker's default /dev/shm.
      - name: Residue across uid reuse
        env:
          BRIDGE_IMAGE: cyfr-mcp-bridge:bridge-e2e
        run: node --test tests/bridge-image/residue.test.mjs

      # Both images under docker compose with the services' own settings and
      # a 5 s bridge lease (tests/bridge-image/compose.e2e.yml): a crash of
      # cyfr between an update's commit and its sync, a sync held back across
      # a bridge restart, a revoke while the control channel is down, a dead
      # controller, a killed spawner and a crash-looping backend, each with
      # what cyfr and the bridge observe; and a canary vault entry echoed by
      # a backend that reaches no log, request-log row, execution payload or
      # file under cyfr's data volume.
      - name: Failures and leaks
        env:
          CYFR_IMAGE: cyfr:bridge-e2e
          BRIDGE_IMAGE: cyfr-mcp-bridge:bridge-e2e
        run: node --test tests/bridge-image/e2e.test.mjs

      # The same scan docker.yml runs before publishing the bridge image.
      - name: Scan the bridge image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cyfr-mcp-bridge:bridge-e2e
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # Findings with no fix in any distribution, each scoped to the
          # path it was observed at, with its reason and what would lift it.
          # Everything else fixable still fails, including the same id in
          # the bridge's own dependency tree.
          trivyignores: .trivyignore.yaml

      # The app image is built here, for the end-to-end run above, and this
      # is the one push-time build of it — so it is scanned here too. Until
      # now `cyfr` was the only shipped image scanned at tag time alone,
      # where a finding stops a release instead of the commit that brought
      # it in. Same scan docker.yml runs before publishing it.
      - name: Scan the app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cyfr:bridge-e2e
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

  arca-seam:
    name: Arca single-seam (no untagged filesystem I/O)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # All file/blob I/O must use Arca.Storage unless a direct call is marked
      # with `arca:bypass-ok=<A|B|C|D|E>` on its line or within four lines above it.
      # This includes File.*, Path.wildcard, :file, :filelib, :erl_tar and :prim_file.
      # Arca.Storage documents the bypass groups. Scratch-only modules may use
      # `arca:bypass-ok=<X> — entire module`.
      - name: Assert direct filesystem calls are tagged
        run: |
          set -uo pipefail
          fail=0
          sources="$(git ls-files 'apps/*/lib/*.ex' 'apps/*/lib/**/*.ex')"
          # A scan that reads nothing would pass; refuse it.
          if [ -z "$sources" ]; then
            echo "::error::no application sources matched — the scan would read nothing"
            exit 1
          fi
          while IFS= read -r f; do
            case "$f" in
              */arca/adapters/*) continue ;;
              apps/cyfr/lib/arca/storage.ex) continue ;;
            esac
            if grep -qE 'arca:bypass-ok=[A-E] — entire module' "$f"; then continue; fi
            bad="$(awk '
              /arca:bypass-ok/ { ok = NR }
              /(^|[^A-Za-z0-9_.])File\.[a-z]|Path\.wildcard|(^|[^A-Za-z0-9_]):(file|filelib|erl_tar|prim_file)\./ {
                if ($0 ~ /^[[:space:]]*#/) next
                if (ok && NR - ok <= 4) next
                print NR ": " $0
              }
            ' "$f")"
            if [ -n "$bad" ]; then
              echo "::error file=$f::direct filesystem I/O without a nearby arca:bypass-ok tag (see Arca.Storage single-seam policy)"
              echo "$bad"
              fail=1
            fi
          done <<< "$sources"
          if [ "$fail" -ne 0 ]; then
            echo "Untagged filesystem I/O found. Route it through Arca, or tag the call site # arca:bypass-ok=<A|B|C|D|E>."
            exit 1
          fi

  seed-guards:
    name: Seed media (clean, immutable versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      # Install media must be clean: build droppings under seed/ would be
      # excluded from every copy-on-write materialization but still counted
      # by its cap pre-check (Arca.Overlay.check_commit_cap/2) — a spurious refusal.
      - name: Seed ships no build droppings
        run: |
          set -uo pipefail
          # A scan of a missing tree finds nothing; refuse it.
          for root in seed/components seed/aqua; do
            if [ -z "$(git ls-files -- "$root" | head -1)" ]; then
              echo "::error::$root holds no tracked file — the scan would read nothing"
              exit 1
            fi
          done
          hits="$(find seed -type d \( -name target -o -name node_modules -o -name .git \) -print)"
          if [ -n "$hits" ]; then
            echo "::error::build droppings under seed/ — install media must be clean"
            echo "$hits"
            exit 1
          fi
      # A tincture ships its entry file and every asset the entry loads: a
      # declared build's output (`dist/`) is part of the seed media, so a
      # checkout that lacks any of it cannot register or serve the tincture.
      # Paths are matched literally, never as git pathspec globs.
      - name: Every seed tincture's entry and built assets are tracked
        run: |
          set -uo pipefail
          shopt -s nullglob
          tracked() { git ls-files --error-unmatch -- ":(literal)$1" >/dev/null 2>&1; }
          bad=""
          manifests=(seed/components/tinctures/local/*/*/cyfr-manifest.json)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::no seed tincture manifest matched — the step would check nothing"
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            vdir="$(dirname "$manifest")"
            entry="$(jq -r '.tincture.entry // "index.html"' "$manifest")" || { bad="$bad"$'\n'"$manifest: unreadable"; continue; }
            case "/$entry/" in
              */../*|*/./*|//*) bad="$bad"$'\n'"$manifest: entry '$entry' leaves the version directory"; continue ;;
            esac
            if ! tracked "$vdir/$entry"; then
              bad="$bad"$'\n'"$vdir/$entry: entry not tracked"
              continue
            fi
            # A built tincture is served from its build output, all of it tracked.
            if jq -e '.tincture.build' "$manifest" >/dev/null; then
              case "$entry" in
                dist/*) ;;
                *) bad="$bad"$'\n'"$manifest: a built tincture's entry lives under dist/, not '$entry'" ;;
              esac
              untracked="$(git ls-files --others -- "$vdir/dist")"
              if [ -n "$untracked" ]; then
                bad="$bad"$'\n'"$untracked"
              fi
            fi
            # Every local script, stylesheet and link the entry names.
            base="$(dirname "$vdir/$entry")"
            refs="$( (grep -oE '(src|href)="[^"]+"' "$vdir/$entry" || true) | sed -E 's/^(src|href)="([^"?#]*).*/\2/')"
            while IFS= read -r ref; do
              case "$ref" in
                ''|'#'*|/*|*:*) continue ;;
              esac
              ref="${ref#./}"
              if ! tracked "$base/$ref"; then
                bad="$bad"$'\n'"$base/$ref: named by $vdir/$entry, not tracked"
              fi
            done <<< "$refs"
          done
          bad="$(printf '%s\n' "$bad" | sed '/^$/d')"
          if [ -n "$bad" ]; then
            echo "::error::seed tincture entries or their assets are not tracked"
            echo "$bad"
            exit 1
          fi
      # Require new version directories for seed changes; existing bundle versions are immutable.
      - name: Existing seed component versions are unmodified
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          else
            # A push names the commit it moved from. A new branch or a
            # force-push reports the null SHA, and the very first commit has
            # no parent — nothing to diff against, so nothing to guard.
            base="${{ github.event.before }}"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              base="$(git rev-parse --verify --quiet HEAD^ || true)"
            fi
            if [ -z "$base" ]; then
              echo "no comparable base for this push — nothing to check"
              exit 0
            fi
          fi
          # A diff of a tree that is not there is empty; refuse it.
          if [ -z "$(git ls-files -- seed/components | head -1)" ]; then
            echo "::error::seed/components holds no tracked file — the check would compare nothing"
            exit 1
          fi
          # The rule is about paths, not file identity: every query runs with
          # --no-renames. Rename detection reports a rename under its
          # DESTINATION path, so shipping a new version by copying the last
          # one read as "files removed from the version that still ships" —
          # retiring 1.0.6 for 1.0.7 failed the check the comment below says
          # it should pass. It also hid an in-place edit whenever git paired
          # the file with a deletion elsewhere: that pair is R, which the
          # modified-file query does not select.
          bad="$(git diff --no-renames --name-only --diff-filter=M "$base"..HEAD -- 'seed/components/**')"
          # A deletion inside a version directory that still ships is a
          # mutation too; retiring the WHOLE directory is a release decision
          # and passes.
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            vdir="$(printf '%s\n' "$f" | cut -d/ -f1-6)"
            if [ -d "$vdir" ]; then bad="$bad"$'\n'"$f"; fi
          done <<< "$(git diff --no-renames --name-only --diff-filter=D "$base"..HEAD -- 'seed/components/**')"
          # Reject added files inside version directories that already exist at the base revision.
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            vdir="$(printf '%s\n' "$f" | cut -d/ -f1-6)"
            if git rev-parse --verify --quiet "$base:$vdir" >/dev/null 2>&1; then
              bad="$bad"$'\n'"$f"
            fi
          done <<< "$(git diff --no-renames --name-only --diff-filter=A "$base"..HEAD -- 'seed/components/**')"
          bad="$(printf '%s\n' "$bad" | sed '/^$/d')"
          if [ -n "$bad" ]; then
            echo "::error::files changed inside existing seed/components version directories — ship a new version instead"
            echo "$bad"
            exit 1
          fi

  config-seam:
    name: Config keys (no compile-time/runtime split)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Reject runtime reads or writes of compile-time configuration keys.
      # Intentional exceptions require `# config:compile-runtime-ok` on each
      # compile_env line.
      - name: Keys read at compile time must not also be read at runtime
        run: |
          set -uo pipefail
          keys="$(mktemp)"
          failures="$(mktemp)"
          git grep -hoE 'compile_env\(:cyfr, *:[a-z_0-9]+' -- 'apps/**/*.ex' 'apps/**/*.exs' \
            | sed 's/.*:cyfr, *://' | sort -u > "$keys"
          # A scan that finds no compile-time key reads nothing; refuse it.
          if [ ! -s "$keys" ]; then
            echo "::error::no compile_env reads matched — the scan would check nothing"
            exit 1
          fi

          while IFS= read -r key; do
            [ -n "$key" ] || continue
            # Exempt when every file that compile_env's this key carries the
            # tag, the same file-level shape the arca-seam job uses.
            untagged=$(git grep -lE "compile_env\(:cyfr, *:${key}[^a-z_0-9]" -- 'apps/**/*.ex' 'apps/**/*.exs' \
              | while IFS= read -r f; do
                  grep -q 'config:compile-runtime-ok' "$f" || echo "$f"
                done)
            [ -z "$untagged" ] && continue

            runtime=$(git grep -nE "Application\.(get_env|fetch_env!?|put_env)\(:cyfr, *:${key}[^a-z_0-9]" -- 'apps/**/*.ex' 'apps/**/*.exs' || true)
            if [ -n "$runtime" ]; then
              echo "::error::config key :${key} is read with compile_env AND at runtime — one of them will be stale" >> "$failures"
              echo "$runtime" >> "$failures"
            fi
          done < "$keys"

          if [ -s "$failures" ]; then
            cat "$failures"
            echo "Read the key one way, or tag every compile_env line for it # config:compile-runtime-ok with the reason."
            exit 1
          fi

  vocabulary-gate:
    name: No org/project fossils (one tenancy vocabulary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The tenancy unit is the athanor and a conversation is a thread. This
      # asserts the old vocabularies — org/project, conversation/topic
      # subscription, the prism: PubSub prefix — cannot creep back into code,
      # config, or operator-facing docs.
      # Free-word "org"/"project" is deliberately not gated (OCI annotations,
      # Mix.Project, Go module paths, "project directory" prose are legitimate).
      - name: Tier A/B fossil patterns must be absent
        run: |
          set -uo pipefail
          paths='apps config wit scripts tests Caddyfile docker-compose.yml Dockerfile Dockerfile.node Dockerfile.locus Dockerfile.opus docker-entrypoint.sh .env.example .env.bridge.example .env.locus.example .env.opus.example .gitignore .dockerignore README.md CONTRIBUTING.md component-guide.md integration-guide.md tincture-guide.md'
          excl=':(exclude)docs/** :(exclude)**/node_modules/** :(exclude)**/package-lock.json :(exclude)**/priv/static/**'
          fail=0
          for p in \
            '\borg_id\b' \
            '\bproject_id\b' \
            '\bnormalize_(org|project|athanor)_id\b' \
            '\bscope_type\b' \
            '\bno_org\b' \
            '\buser_active_in_org\?' \
            'Arca\.Schemas\.(Org|Project)\b' \
            'Sanctum\.Tenancy\.(Orgs|Projects|Memberships)\b' \
            'Compendium\.ProjectSeeder\b' \
            'Compendium\.AthanorSeeder\b' \
            'Compendium\.Upstream\b' \
            'Compendium\.Bundle\b' \
            'Sanctum\.TenantScope\b' \
            'Arca\.Tenant\b' \
            'default_athanor' \
            'cyfr\.consent\.bootstrap' \
            ':org([^a-z_]|$)' \
            ':project([^a-z_]|$)' \
            'PrismWeb\.Endpoint\b' \
            'Prism\.AuthExchange\b' \
            'PrismWeb\.LiveClaimGate\b' \
            'CYFR_PRISM_' \
            'Prism\.AquaConversations\b' \
            ':aqua_path\b' \
            ':4001\b|4001:4001' \
            'CYFR_PORTA_' \
            'cyfr-porta' \
            'apps/porta/' \
            '[Cc]onversation|CONVERSATION' \
            'topic_subscription|TopicSubscription' \
            'Cyfr\.Topics\b' \
            'prism:[a-z_]' \
            ; do
            hits="$(git grep -InE "$p" -- $paths $excl || true)"
            if [ -n "$hits" ]; then
              echo "::error::fossil pattern $p"
              echo "$hits"
              fail=1
            fi
          done
          # Check athanor_id constraints in every migration. Only the baseline's
          # memberships and sessions columns may be nullable.
          # `grep -c` exits 1 when the count is zero, and the job's shell is
          # `bash -e`, so an unguarded count on a migration that adds no
          # athanor_id column kills the job silently — which is what every
          # check below this point had been dying behind.
          m=apps/cyfr/priv/repo/migrations/20260815000000_baseline.exs
          nullable="$(grep -cE 'add :athanor_id' "$m" || true)"
          notnull="$(grep -cE 'add :athanor_id.*null: false' "$m" || true)"
          if [ "$((nullable - notnull))" -ne 2 ]; then
            echo "::error::exactly two nullable athanor_id columns are allowed (memberships, sessions); found $((nullable - notnull))"; fail=1
          fi
          for other in apps/cyfr/priv/repo/migrations/*.exs; do
            [ "$other" = "$m" ] && continue
            n="$(grep -cE 'add :athanor_id' "$other" || true)"
            nn="$(grep -cE 'add :athanor_id.*null: false' "$other" || true)"
            if [ "$n" -ne "$nn" ]; then
              echo "::error file=$other::athanor_id must be null: false outside the baseline (the two nullable fabrics are baseline-only)"; fail=1
            fi
          done
          if grep -nE 'add :athanor_id.*default:' apps/cyfr/priv/repo/migrations/*.exs; then
            echo "::error::athanor_id column with a default — a forgotten athanor must fail, never default into somebody's"; fail=1
          fi
          if [ "$(grep -c 'COALESCE(athanor_id' "$m" || true)" -ne 1 ]; then
            echo "::error::expected exactly one COALESCE(athanor_id (the membership assignment index)"; fail=1
          fi
          # Runtime storage must stay under data/.
          if ! grep -q '^/data/$' .gitignore || grep -qE '^(components/\*|!components/_bundle/)$' .gitignore; then
            echo "::error::.gitignore must ignore /data/ and carry no components/* allowlist pair"; fail=1
          fi
          # The template `cyfr init` writes must agree with the repo's own.
          # Anchored the way the .gitignore check above is: an unanchored
          # '/data/' also matched the config template's `./data/cyfr.db` and a
          # code comment, so the ignore entry this guards could be deleted —
          # every `cyfr init` project then committing its runtime state — with
          # the gate still green.
          if ! grep -q '^/data/$' apps/codex/cmd/lifecycle.go || grep -qE 'components/\*$|!components/_bundle/' apps/codex/cmd/lifecycle.go; then
            echo "::error::lifecycle.go .gitignore template must ignore /data/ and carry no components/* allowlist pair"; fail=1
          fi
          # Operator-facing docs describe the unified athanor layout — not the
          # old two-segment one, not the split components/{athanor} roots, and
          # not a bare components/ tree at the project root.
          docs_hits="$(git grep -InE 'components/local/default|/t/:publisher/|/t/<publisher>/|components/\{athanor|^components/$' -- README.md component-guide.md integration-guide.md tincture-guide.md .env.example || true)"
          if [ -n "$docs_hits" ]; then
            echo "::error::guides still describe a pre-unification layout"; echo "$docs_hits"; fail=1
          fi
          # Per-athanor storage diagrams must name physical tenant roots.
          # The names below are not tenant roots. `data/` is no longer among
          # them: the guest's scope and the athanor's root are one name now
          # (Arca.Storage.tenant_roots/0).
          phantom_hits="$(git grep -InE '^ +[├└│|]+─* *(config|builds)/ ' -- README.md component-guide.md integration-guide.md tincture-guide.md || true)"
          if [ -n "$phantom_hits" ]; then
            echo "::error::guide tree diagrams name a scope that is not a tenant root (see Arca.Storage.tenant_roots/0)"; echo "$phantom_hits"; fail=1
          fi
          # Tracked seed media belongs under seed/.
          if git ls-files 'components/*' 'aqua/*' | grep -q .; then
            echo "::error::seed media lives under seed/ — nothing may be tracked at components/ or aqua/"; fail=1
          fi
          if git ls-files 'seed/*' | grep -vE '^seed/(components|aqua)/' | grep -q .; then
            echo "::error::seed/ carries only its two roots, components/ and aqua/"; fail=1
          fi
          # The deployment shell spells the volume/seed layout outside Elixir
          # — compose mounts, the Docker seed bake, the init template, the
          # scaffold tarball. Witness each spelling so a layout rename in
          # Arca.Storage cannot silently drift past them.
          # A comment that MENTIONS the spelling is not the spelling. Strip
          # whole-line comments first, or deleting the code a guard names is
          # masked by the paragraph explaining it — which is exactly what
          # `docker-entrypoint.sh '/app/seed/aqua'` did: the string sits in
          # three header comments above the seeding block it guards, so the
          # block could go and the gate would stay green.
          # No pipe: `grep -q` exits at the first match, and the strip
          # upstream of it then dies of SIGPIPE, which `pipefail` reports as
          # a failed pipeline even though the string was found. That made
          # these assertions answer differently on a fast machine than a
          # slow one — `lifecycle.go` was reported as no longer spelling a
          # string it still contains.
          assert_spelling() {
            stripped="$(grep -vE '^[[:space:]]*(#|//)' "$1" || true)"
            case "$stripped" in
              *"$2"*) : ;;
              *) echo "::error::$1 no longer spells '$2' — the deployment layout drifted from Arca.Storage"; fail=1 ;;
            esac
          }
          assert_spelling docker-compose.yml './data:/app/data'
          assert_spelling docker-compose.yml './aqua:/app/seed/aqua'
          assert_spelling Dockerfile 'CYFR_SEED_PATH=/app/seed'
          assert_spelling Dockerfile 'COPY seed/components/'
          assert_spelling docker-entrypoint.sh '/app/seed/aqua'
          assert_spelling apps/codex/cmd/lifecycle.go '"data"'
          assert_spelling apps/codex/cmd/lifecycle.go '"aqua"'
          assert_spelling scripts/scaffold-tarball.sh '-C seed aqua'
          exit $fail
