name: Porta (A.Q.U.A. PWA)
# The PWA ships as a container image (ghcr.io/cyfrworks/cyfr-porta) rebuilt
# in lockstep with the cyfr image — same bare-semver tag as docker.yml / release.yml.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cyfrworks/cyfr-porta

jobs:
  build:
    if: github.repository == 'cyfrworks/cyfr'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          platform="${{ matrix.platform }}"
          echo "arch=${platform#linux/}" >> "$GITHUB_OUTPUT"

      - name: Build and push (per-arch)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.node
          target: porta
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.arch }}
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=porta-${{ steps.meta.outputs.arch }}
          cache-to: type=gha,scope=porta-${{ steps.meta.outputs.arch }},mode=max

  merge:
    if: github.repository == 'cyfrworks/cyfr'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        run: |
          tags=(--tag ${{ env.IMAGE }}:latest)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags+=(--tag ${{ env.IMAGE }}:${{ steps.version.outputs.version }})
          fi
          docker buildx imagetools create "${tags[@]}" \
            ${{ env.IMAGE }}:amd64 \
            ${{ env.IMAGE }}:arm64
