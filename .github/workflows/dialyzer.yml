# Run Dialyzer with the flags and warning filters configured in mix.exs.
name: Dialyzer
on:
  push:
    branches: [main]
    paths:
      - 'apps/**/lib/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.dialyzer_ignore.exs'
      - '.github/workflows/dialyzer.yml'
  pull_request:
    paths:
      - 'apps/**/lib/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.dialyzer_ignore.exs'
      - '.github/workflows/dialyzer.yml'
permissions:
  contents: read
env:
  MIX_ENV: dev
  ERL_CRASH_DUMP_SECONDS: 0
  # Mix through 1.20 can wait forever on its own build lock the second
  # time a fresh lock directory is taken, and a runner starts every one
  # fresh. One Mix process at a time builds here, so the lock is off.
  MIX_OS_CONCURRENCY_LOCK: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  dialyzer:
    name: Specs agree with the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        id: beam
        with:
          otp-version: '29'
          elixir-version: '1.20.4'
      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-dialyzer-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-mix-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      # Cache the PLT by OTP, Elixir and dependency versions.
      - name: Cache PLT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _build/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - name: Build PLT
        run: mix dialyzer --plt
      # Unused warning filters fail the build; remove filters when their warnings are fixed.
      - name: Dialyzer
        run: mix dialyzer
