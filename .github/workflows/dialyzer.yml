# Run Dialyzer with the flags and warning filters configured in mix.exs.
name: Dialyzer
on:
  push:
    branches: [main]
    paths:
      - 'apps/**/lib/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.dialyzer_ignore.exs'
      - 'config/**'
      - 'apps/*/mix.exs'
      - '.github/actions/**'
      - '.github/workflows/dialyzer.yml'
      - 'scripts/fetch-prebuilt-binaries.sh'
  pull_request:
    paths:
      - 'apps/**/lib/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.dialyzer_ignore.exs'
      - 'config/**'
      - 'apps/*/mix.exs'
      - '.github/actions/**'
      - '.github/workflows/dialyzer.yml'
      - 'scripts/fetch-prebuilt-binaries.sh'
  workflow_call:
permissions:
  contents: read
concurrency:
  group: dialyzer-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  MIX_ENV: dev
  ERL_CRASH_DUMP_SECONDS: 0
  # Mix through 1.20 can wait forever on its own build lock the second
  # time a fresh lock directory is taken, and a runner starts every one
  # fresh. One Mix process at a time builds here, so the lock is off.
  MIX_OS_CONCURRENCY_LOCK: 0
jobs:
  dialyzer:
    name: Specs agree with the code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The PLTs live under _build (mix.exs), so this cache carries them.
      - uses: ./.github/actions/setup-elixir
        with:
          cache-key-prefix: dialyzer
      - run: |
          scripts/ci/retry.sh mix deps.get
          scripts/fetch-prebuilt-binaries.sh
      - run: mix compile --warnings-as-errors
      - name: Build PLT
        run: mix dialyzer --plt
      # Unused warning filters fail the build; remove filters when their warnings are fixed.
      - name: Dialyzer
        run: mix dialyzer
