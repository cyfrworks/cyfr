name: License Lint

# Check directory-based licensing: the `apps/sanctum` application uses
# FSL-1.1-Apache-2.0; all other source uses Apache-2.0. The Locus image
# is Apache-2.0 alone, so the apps it releases reach no FSL file.

# Each paths list is exactly what the steps read: the first step's
# `git ls-files` patterns (a git pathspec `*` crosses `/`), and the second
# step's Dockerfile, root and app mix.exs and its whole-tree grep of
# apps/locus and apps/prima.
on:
  pull_request:
    paths:
      - '**/*.ex'
      - '**/*.exs'
      - 'apps/codex/**/*.go'
      - 'tests/locus-backends-image/**/*.py'
      - 'tests/locus-backends-image/**/*.mjs'
      - 'tests/fixtures/**/*.go'
      - 'wit/**/*.wit'
      - 'apps/cyfr/assets/js/**/*.js'
      - 'Dockerfile.locus'
      - 'apps/locus/**'
      - 'apps/prima/**'
      - '.github/workflows/license-lint.yml'
  push:
    branches: [main]
    paths:
      - '**/*.ex'
      - '**/*.exs'
      - 'apps/codex/**/*.go'
      - 'tests/locus-backends-image/**/*.py'
      - 'tests/locus-backends-image/**/*.mjs'
      - 'tests/fixtures/**/*.go'
      - 'wit/**/*.wit'
      - 'apps/cyfr/assets/js/**/*.js'
      - 'Dockerfile.locus'
      - 'apps/locus/**'
      - 'apps/prima/**'
      - '.github/workflows/license-lint.yml'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: license-lint-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spdx-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Verify SPDX headers in tracked Elixir, Go, backends image suite, WIT
      # and console JS source. Seed examples are outside this lint's scope.
      - name: Assert SPDX license boundary
        run: |
          set -uo pipefail

          FSL='SPDX-License-Identifier: FSL-1.1-Apache-2.0'
          APACHE='SPDX-License-Identifier: Apache-2.0'

          is_fsl_zone() {
            case "$1" in
              apps/sanctum/*) return 0 ;;
            esac
            return 1
          }

          patterns=('*.ex' '*.exs' 'apps/codex/*.go' 'apps/locus/keeper/*.go' 'tests/locus-backends-image/*.py' 'tests/locus-backends-image/*.mjs' 'tests/fixtures/*.go' 'wit/*.wit' 'apps/cyfr/assets/js/*.js' 'apps/cyfr/assets/js/hooks/*.js')

          # A pattern that matches nothing checks nothing while the scan of
          # the others passes; refuse each such pattern by itself.
          empty=0
          for pattern in "${patterns[@]}"; do
            if [ -z "$(git ls-files "$pattern")" ]; then
              echo "::error::no tracked source matches $pattern — the lint would check nothing there"
              empty=1
            fi
          done
          if [ "$empty" -ne 0 ]; then
            exit 1
          fi

          # Each header is read through a here-string: under pipefail a
          # `printf | grep -q` fails whenever grep has matched and exited
          # before printf wrote the header's last line.
          fail=0
          while IFS= read -r f; do
            head3="$(head -3 "$f")"

            if is_fsl_zone "$f"; then
              if ! grep -qF "$FSL" <<<"$head3"; then
                echo "::error file=$f::FSL-zone file is missing the FSL-1.1-Apache-2.0 header"
                fail=1
              fi
            else
              if ! grep -qF "$APACHE" <<<"$head3"; then
                echo "::error file=$f::file is missing the Apache-2.0 header"
                fail=1
              fi
              if grep -qF "$FSL" <<<"$head3"; then
                echo "::error file=$f::FSL header outside the FSL zone (should be Apache-2.0)"
                fail=1
              fi
            fi
          done < <(git ls-files "${patterns[@]}")

          if [ "$fail" -ne 0 ]; then
            echo "License boundary check failed. Fix the headers above."
            exit 1
          fi

      # The `locus` image is labelled Apache-2.0 alone, so what it releases
      # must be: its release names the contracts and its own app and nothing
      # else (root mix.exs), its app depends in the umbrella on the
      # contracts alone, and no file of the app carries the FSL header. A
      # reach into the control plane is a compile error in the island's own
      # build (test.yml's independence jobs); this is the same boundary read
      # as a licence.
      - name: Assert the Apache-2.0 image releases no FSL code
        run: |
          set -uo pipefail
          fail=0
          if ! grep -qxF 'LABEL org.opencontainers.image.licenses="Apache-2.0"' Dockerfile.locus; then
            echo "::error file=Dockerfile.locus::the locus image must be labelled Apache-2.0 alone"
            fail=1
          fi
          roster="$(awk '$0 ~ "^      locus: \\[$" { inblk = 1; next } inblk && /applications: \[/ { inapps = 1; next } inapps && /\]/ { exit } inapps { sub(/^ +/, ""); sub(/:.*/, ""); print }' mix.exs | sort | tr '\n' ' ')"
          if [ "$roster" != "locus prima " ]; then
            echo "::error file=mix.exs::the locus release must hold prima and locus alone, found: ${roster:-nothing}"
            fail=1
          fi
          deps="$(grep -oE '\{:[a-z_]+, in_umbrella: true' apps/locus/mix.exs | sed -E 's/^\{:([a-z_]+).*/\1/' | sort -u | tr '\n' ' ')"
          if [ "$deps" != "prima " ]; then
            echo "::error file=apps/locus/mix.exs::locus may depend in the umbrella on prima alone, found: ${deps:-nothing}"
            fail=1
          fi
          fsl="$(grep -rlF 'SPDX-License-Identifier: FSL-1.1-Apache-2.0' apps/locus apps/prima || true)"
          if [ -n "$fsl" ]; then
            echo "::error::FSL-licensed files in what the locus image releases:"
            echo "$fsl"
            fail=1
          fi
          exit "$fail"
