name: License Lint

# Check directory-based licensing: the `apps/sanctum` application uses
# FSL-1.1-Apache-2.0; all other source uses Apache-2.0. The builder and
# worker images are Apache-2.0 alone, so the apps they release reach no FSL
# file.

on:
  pull_request:
    paths:
      - '**/*.ex'
      - '**/*.exs'
      - 'apps/codex/**'
      - 'apps/mcp-bridge/**/*.mjs'
      - 'apps/spawn/**'
      - 'tests/bridge-image/**'
      - 'tests/fixtures/*.go'
      - 'wit/**'
      - 'LICENSES/**'
      - 'mix.exs'
      - 'Dockerfile.locus'
      - 'Dockerfile.opus'
      - '.github/workflows/license-lint.yml'
  push:
    branches: [main]
    paths:
      - '**/*.ex'
      - '**/*.exs'
      - 'apps/codex/**'
      - 'apps/mcp-bridge/**/*.mjs'
      - 'apps/spawn/**'
      - 'tests/bridge-image/**'
      - 'tests/fixtures/*.go'
      - 'wit/**'
      - 'LICENSES/**'
      - 'mix.exs'
      - 'Dockerfile.locus'
      - 'Dockerfile.opus'

jobs:
  spdx-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Verify SPDX headers in tracked Elixir, Go, bridge, WIT and console JS
      # source. Seed examples are outside this lint's scope.
      - name: Assert SPDX license boundary
        run: |
          set -uo pipefail

          FSL='SPDX-License-Identifier: FSL-1.1-Apache-2.0'
          APACHE='SPDX-License-Identifier: Apache-2.0'

          is_fsl_zone() {
            case "$1" in
              apps/sanctum/*) return 0 ;;
            esac
            return 1
          }

          fail=0
          checked=0
          while IFS= read -r f; do
            head3="$(head -3 "$f")"

            if is_fsl_zone "$f"; then
              if ! printf '%s' "$head3" | grep -qF "$FSL"; then
                echo "::error file=$f::FSL-zone file is missing the FSL-1.1-Apache-2.0 header"
                fail=1
              fi
            else
              if ! printf '%s' "$head3" | grep -qF "$APACHE"; then
                echo "::error file=$f::file is missing the Apache-2.0 header"
                fail=1
              fi
              if printf '%s' "$head3" | grep -qF "$FSL"; then
                echo "::error file=$f::FSL header outside the FSL zone (should be Apache-2.0)"
                fail=1
              fi
            fi
            checked=$((checked + 1))
          done < <(git ls-files '*.ex' '*.exs' 'apps/codex/*.go' 'apps/spawn/*.go' 'apps/mcp-bridge/*.mjs' 'apps/mcp-bridge/test/*.mjs' 'tests/bridge-image/*.mjs' 'tests/fixtures/*.go' 'wit/*.wit' 'apps/cyfr/assets/js/*.js' 'apps/cyfr/assets/js/hooks/*.js')

          # A scan that reads nothing would pass; refuse it.
          if [ "$checked" -eq 0 ]; then
            echo "::error::no tracked source matched — the lint would check nothing"
            exit 1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "License boundary check failed. Fix the headers above."
            exit 1
          fi

      # The `locus` and `opus` images are labelled Apache-2.0 alone, so what
      # each releases must be: its release names the contracts and its own
      # app and nothing else (root mix.exs), its app depends in the umbrella
      # on the contracts alone, and no file of either app carries the FSL
      # header. A reach into the control plane is a compile error in the
      # island's own build (test.yml's independence jobs); this is the same
      # boundary read as a licence.
      - name: Assert the Apache-2.0 images release no FSL code
        run: |
          set -uo pipefail
          fail=0
          for app in locus opus; do
            file="Dockerfile.$app"
            if ! grep -qxF 'LABEL org.opencontainers.image.licenses="Apache-2.0"' "$file"; then
              echo "::error file=$file::the $app image must be labelled Apache-2.0 alone"
              fail=1
            fi
            roster="$(awk -v app="$app" '$0 ~ "^      " app ": \\[$" { inblk = 1; next } inblk && /applications: \[/ { inapps = 1; next } inapps && /\]/ { exit } inapps { sub(/^ +/, ""); sub(/:.*/, ""); print }' mix.exs | sort | tr '\n' ' ')"
            if [ "$roster" != "$app prima " ]; then
              echo "::error file=mix.exs::the $app release must hold prima and $app alone, found: ${roster:-nothing}"
              fail=1
            fi
            deps="$(grep -oE '\{:[a-z_]+, in_umbrella: true' "apps/$app/mix.exs" | sed -E 's/^\{:([a-z_]+).*/\1/' | sort -u | tr '\n' ' ')"
            if [ "$deps" != "prima " ]; then
              echo "::error file=apps/$app/mix.exs::$app may depend in the umbrella on prima alone, found: ${deps:-nothing}"
              fail=1
            fi
            fsl="$(grep -rlF 'SPDX-License-Identifier: FSL-1.1-Apache-2.0' "apps/$app" apps/prima || true)"
            if [ -n "$fsl" ]; then
              echo "::error::FSL-licensed files in what the $app image releases:"
              echo "$fsl"
              fail=1
            fi
          done
          exit "$fail"
